<!doctype html>
<html lang="ca">
<head>

<title>Batalla naval de coordenades · FR-4C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Taller de l'app FR-4C · Gràfiques: la batalla naval sobre una graella cartesiana (postMessage fr4c-bat-*).
   Contra la màquina o contra un company (cadascú al seu ordinador: l'app fa de pont amb Firebase). */
:root{--taronja:#f26b1d;--blau:#2a6fd6;--mar:#1d5fa8;--tinta:#1b1b1b;--ok:#2c9a58;--ko:#d64242;--fons:#eaf4fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;color:var(--tinta);overflow:hidden;user-select:none}
body{background:linear-gradient(#cfe8fb 0%,#e9f5fd 55%,#bfe0f7 100%)}
.ones{position:fixed;left:0;right:0;bottom:0;height:70px;pointer-events:none;z-index:0;overflow:hidden}
.ones svg{position:absolute;bottom:0;width:200%;height:70px;animation:ona 9s linear infinite}.ones svg.o2{animation-duration:14s;opacity:.55;bottom:6px}
@keyframes ona{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.gavina{position:fixed;top:56px;left:-60px;font-size:26px;animation:vola 26s linear infinite;z-index:0;pointer-events:none;opacity:.8}
@keyframes vola{0%{transform:translate(0,0)}25%{transform:translate(30vw,14px)}50%{transform:translate(60vw,-6px)}75%{transform:translate(90vw,12px)}100%{transform:translate(115vw,0)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.cap{display:flex;align-items:center;gap:12px;padding:8px 16px;font-weight:700}
.cap .tit{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}
.cap .dreta{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:3px solid var(--tinta);background:#fff;color:var(--tinta);border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover:not(:disabled){background:#fff3e6}.btn:disabled{opacity:.45;cursor:default}
.big{font:inherit;font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;padding:12px 22px;border-radius:16px;border:4px solid var(--tinta);background:var(--taronja);color:#fff;cursor:pointer;box-shadow:0 5px 0 #0003}
.big.sec{background:#fff;color:var(--tinta)}.big:disabled{opacity:.5;cursor:default}
.big:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0003}
.cos{flex:1;min-height:0;padding:0 16px 16px;display:flex;gap:16px}
.caixa{background:#fffffff2;border:4px solid var(--tinta);border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 #0002}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0}
.centre{margin:auto;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:900px}
.pers{display:flex;gap:22px;justify-content:center}
.pers button{width:230px;border:4px solid var(--tinta);border-radius:20px;background:#fff;padding:10px;cursor:pointer;font:inherit;font-weight:800;font-size:1.15rem;box-shadow:0 5px 0 #0003}
.pers button.on{background:#ffe7d3;border-color:var(--taronja);transform:translateY(-4px)}
.pers button svg{width:150px;height:150px;display:block;margin:0 auto}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.fila{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.codi{font-family:"Bricolage Grotesque",sans-serif;font-size:3.4rem;letter-spacing:.2em;background:#fff;border:4px dashed var(--taronja);border-radius:16px;padding:4px 20px}
input.cin{width:160px;height:58px;border:3px solid var(--tinta);border-radius:12px;font:inherit;font-size:2rem;font-weight:800;text-align:center;letter-spacing:.15em}
.esq{width:41%;display:flex;flex-direction:column;gap:10px;min-height:0}
.dre{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.tauler{width:100%;height:auto;max-height:100%;display:block;background:#fff;border:3px solid var(--tinta);border-radius:14px}
.zona-t{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.zona-t svg{max-height:100%;width:auto;max-width:100%}
.etq{font-family:"Bricolage Grotesque",sans-serif;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.etq .pt{margin-left:auto;font-size:.95rem;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:700}

.baf b{color:var(--taronja)}
.av.salta{animation:salta .55s}@keyframes salta{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}}
.av.tremola{animation:trem .45s}@keyframes trem{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pregunta{background:#fff7ee;border:4px solid var(--taronja);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;align-items:center;animation:apar .3s}
@keyframes apar{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.pregunta .q{font-size:1.2rem;font-weight:800;text-align:center}
.flota{display:flex;flex-wrap:wrap;gap:8px}
.flota button{border:3px solid var(--tinta);border-radius:12px;background:#fff;padding:5px 10px;font:inherit;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:6px}
.flota button.on{background:var(--taronja);color:#fff}.flota button.posat{background:#e8f6ee;border-color:var(--ok)}
.flota i{display:inline-flex;gap:2px}.flota i b{width:10px;height:10px;border-radius:50%;background:#6b7a8f;display:block}
.torn{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;padding:4px 12px;border-radius:999px;background:#fff;border:3px solid var(--tinta)}
.torn.meu{background:var(--taronja);color:#fff}
.barra{height:8px;border-radius:99px;background:#0001;overflow:hidden}.barra i{display:block;height:100%;background:var(--taronja);transition:width 1s linear}
.msg{min-height:1.5em;font-weight:800;text-align:center;font-size:1.05rem}.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.mini{font-size:.9rem;color:#555}
.fi .estrella{font-size:4rem}
.mar-punt{transition:r .2s}
.esquitx{animation:esq .6s ease-out}@keyframes esq{from{r:2;opacity:1}to{r:22;opacity:0}}
.boom{animation:boom .5s ease-out}@keyframes boom{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.boom,.mira{transform-box:fill-box;transform-origin:center}
.mira{animation:mira 1s ease-in-out infinite}@keyframes mira{50%{transform:scale(1.25)}}
.amagat{display:none!important}

<body>
<div class="gavina">🕊️</div>
<div class="ones"><svg viewBox="0 0 1200 70" preserveAspectRatio="none" class="o2"><path d="M0 30 Q75 10 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V70 H0Z" fill="#5aa7e6"/></svg><svg viewBox="0 0 1200 70" preserveAspectRatio="none"><path d="M0 40 Q75 22 150 40 T300 40 T450 40 T600 40 T750 40 T900 40 T1050 40 T1200 40 V70 H0Z" fill="#2f86d6"/></svg></div>
<div id="app">
  <div class="cap"><span class="tit">⚓ Batalla naval de coordenades</span><span id="info" class="mini"></span>
    <span class="dreta"><span id="rellotge" class="torn amagat"></span><button class="btn" id="mus" title="Música">🎵</button><button class="btn" id="so" title="So">🔊</button><button class="btn" id="surt">Surt</button></span></div>
  <div class="cos" id="cos"></div>
</div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const N = '#1b1b1b', T = '#f26b1d', B = '#2a6fd6';
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), tria = a => a[Math.floor(Math.random() * a.length)];
const NIVELLS = { 1: { min: -3, max: 3, pas: 1 }, 2: { min: -4, max: 4, pas: 1 }, 3: { min: -8, max: 8, pas: 2 } };
const FLOTA = [{ id: 'pa', nom: 'Portaavions', mida: 4 }, { id: 'fr', nom: 'Fragata', mida: 3 }, { id: 'sb', nom: 'Submarí', mida: 2 }, { id: 'pt', nom: 'Patrullera', mida: 2 }];
const TOTAL = FLOTA.reduce((s, f) => s + f.mida, 0);
const MINUTS = 12, TEMPS_TORN = 40;
const M = { dinsApp: false, nom: '', nivell: 2, record: 0, so: true, mus: true, pers: null, mode: null };
try { M.so = localStorage.getItem('fr4c_bat_so') !== '0'; M.mus = localStorage.getItem('fr4c_bat_mus') !== '0'; } catch (e) { }
const envia = m => { try { if (window.parent !== window) window.parent.postMessage(m, '*'); } catch (e) { } };
const fz = v => (v < 0 ? '−' : '') + Math.abs(v);
const pt = (x, y) => `(${fz(x)}, ${fz(y)})`;
const K = (x, y) => `${x},${y}`;

/* ---------- so i música (tot generat aquí, sense fitxers) ---------- */
let AC = null; const ac = () => { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; };
function nota(f, ini, dur, ona = 'sine', vol = .1, f2 = null) { const c = ac(), t = c.currentTime + ini; const o = c.createOscillator(), g = c.createGain(); o.type = ona; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05); }
function soroll(ini, dur, freq, vol = .25, tipus = 'bandpass') { const c = ac(), t = c.currentTime + ini; const n = c.createBuffer(1, c.sampleRate * dur, c.sampleRate); const d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); const s = c.createBufferSource(); s.buffer = n; const fl = c.createBiquadFilter(); fl.type = tipus; fl.frequency.value = freq; const g = c.createGain(); g.gain.value = vol; s.connect(fl); fl.connect(g); g.connect(c.destination); s.start(t); }

    else if (t === 'tocat') { nota(330, 0, .16, 'triangle', .07, 230); nota(494, .09, .22, 'triangle', .05); } // un «tump» amable
    else if (t === 'enfonsat') { [523, 392, 330, 262].forEach((f, i) => nota(f, i * .13, .2, 'triangle', .06)); nota(196, .5, .45, 'sine', .05, 150); }

    else if (t === 'perd') [440, 392, 349, 262].forEach((f, i) => nota(f, i * .2, .3, 'triangle', .1));
    else if (t === 'meu') { nota(640, 0, .13, 'triangle', .08, 900); nota(900, .12, .2, 'triangle', .08, 540); }

  } catch (e) { }
}
// Una cançó mariner pròpia (6/8), suau, només a les pantalles d'entrada
const CANCO = [[392, 1], [494, .5], [587, 1], [494, .5], [440, 1], [392, .5], [440, 1.5], [392, 1], [330, .5], [294, 1.5], [392, 1], [494, .5], [587, 1], [659, .5], [587, 1], [494, .5], [440, 1.5], [494, 1], [440, .5], [392, 1.5]];
const MUS = { on: false, tm: null, i: 0 };
const PANT_MUS = ['inici', 'company', 'espera', 'colloca'];
function musicaInici() {
  if (M.dinsApp) { if (M.mus && M.so && !MUS.on && PANT_MUS.includes(M.pantalla)) musica(true); return; } // el navegador només deixa sonar quan la pàgina ha rebut un clic: ho prova ara i, si no pot, al primer clic o tecla
  if (!M.mus || !M.so || MUS.on || !PANT_MUS.includes(M.pantalla)) return;
  try { const c = ac(); const va = () => { if (c.state === 'running' && !MUS.on && PANT_MUS.includes(M.pantalla)) musica(true); }; va(); c.resume().then(va).catch(() => { }); } catch (e) { }
}
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, musicaInici, true));
function musica(on) {
  clearTimeout(MUS.tm); MUS.on = on; if (!on || !M.mus || !M.so) MUS.on = false;
  if (M.dinsApp) { envia({ tipus: 'fr4c-bat-mus', on: MUS.on }); return; } // dins de l'app, la música la fa sonar l'app
  if (!MUS.on) return;
  const toca = () => { if (!MUS.on) return; const [f, d] = CANCO[MUS.i % CANCO.length]; try { nota(f, 0, d * .32, 'triangle', .045); nota(f / 2, 0, d * .3, 'sine', .03); } catch (e) { } MUS.i++; MUS.tm = setTimeout(toca, d * 330); };

/* ---------- personatges mariners ---------- */
function robotMariner(estat = 'normal') {
  const ulls = estat === 'content' ? `<path d="M48 68 q7 -10 14 0 M78 68 q7 -10 14 0" stroke="${T}" stroke-width="5" fill="none" stroke-linecap="round"/>` : estat === 'pensa' ? `<rect x="48" y="62" width="14" height="7" rx="3.5" fill="${T}"/><rect x="78" y="62" width="14" height="7" rx="3.5" fill="${T}"/>` : `<circle cx="55" cy="66" r="7.5" fill="${T}"/><circle cx="85" cy="66" r="7.5" fill="${T}"/>`;

function comaMariner(estat = 'normal') {

    <ellipse cx="40" cy="54" rx="21" ry="18" fill="${T}" stroke="${N}" stroke-width="3"/><path d="M26 44 L40 50 L54 44 L54 52 L26 52Z" fill="#fff" stroke="${N}" stroke-width="2" stroke-linejoin="round"/><path d="M28 47 L40 52 L52 47" fill="none" stroke="${B}" stroke-width="2"/><path d="M37 51 L40 58 L43 51Z" fill="#d33" stroke="${N}" stroke-width="1.5"/><ellipse cx="40" cy="64" rx="9" ry="7" fill="#fff"/>
    <path d="M25 20L20 3L35 12Z" fill="${T}" stroke="${N}" stroke-width="3" stroke-linejoin="round"/><path d="M55 20L60 3L45 12Z" fill="${T}" stroke="${N}" stroke-width="3" stroke-linejoin="round"/>

    <path d="M26 31l-9 -2M26 34l-9 2M54 31l9 -2M54 34l9 2" stroke="${N}" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="40" cy="6" rx="21" ry="7" fill="#24418a" stroke="${N}" stroke-width="2.5"/><rect x="25" y="7" width="30" height="6" rx="3" fill="#fff" stroke="${N}" stroke-width="2"/><path d="M53 11 q6 4 4 10" fill="none" stroke="#24418a" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="-3" r="5" fill="#d33" stroke="${N}" stroke-width="2"/></svg>`;
}
const persSvg = (p, e) => p === 'coma' ? comaMariner(e) : robotMariner(e);
const persNom = p => p === 'coma' ? 'en Coma' : 'FR-4C';
const persNomM = p => p === 'coma' ? 'En Coma' : 'FR-4C';

/* ---------- el tauler cartesià ---------- */
const C = 44, MG = 34;

const mida = () => 2 * MG + (valors().length - 1) * C;
const px = x => MG + (x - L().min) / L().pas * C, py = y => MG + (L().max - y) / L().pas * C;
const existeix = (x, y) => { const l = L(); return x >= l.min && x <= l.max && y >= l.min && y <= l.max && (x - l.min) % l.pas === 0 && (y - l.min) % l.pas === 0; };
function fons() {
  const S = mida(), vs = valors(); let s = `<rect width="${S}" height="${S}" fill="#f2f8fd"/>`; let l = '';
  for (const v of vs) { l += `M${px(v)} ${py(L().min) + 10}V${py(L().max) - 10}M${px(L().min) - 10} ${py(v)}H${px(L().max) + 10}`; }
  s += `<path d="${l}" stroke="#c9dcef" stroke-width="1.5"/>`;
  s += `<path d="M${px(L().min) - 14} ${py(0)}H${px(L().max) + 16}M${px(0)} ${py(L().min) + 14}V${py(L().max) - 16}" stroke="${N}" stroke-width="2.6"/><path d="M${px(L().max) + 22} ${py(0)}l-9 -5v10Z M${px(0)} ${py(L().max) - 22}l-5 9h10Z" fill="${N}"/>`;
  for (const v of vs) { if (v !== 0) { s += `<text x="${px(v)}" y="${py(0) + 17}" text-anchor="middle" font-size="13" font-weight="800" fill="${N}">${fz(v)}</text><text x="${px(0) - 7}" y="${py(v) + 4.5}" text-anchor="end" font-size="13" font-weight="800" fill="${N}">${fz(v)}</text>`; } }
  s += `<text x="${px(0) - 6}" y="${py(0) + 16}" text-anchor="end" font-size="12" font-weight="800">0</text><text x="${px(L().max) + 24}" y="${py(0) - 8}" text-anchor="end" font-size="15" font-weight="900" fill="${B}">x</text><text x="${px(0) + 9}" y="${py(L().max) - 14}" font-size="15" font-weight="900" fill="${B}">y</text>`;
  for (const x of vs) for (const y of vs) s += `<circle cx="${px(x)}" cy="${py(y)}" r="2.6" fill="#8fb0d0"/>`;
  return s;

function revela() { // el company ja ha dit si l'havien tocat (o ha passat massa estona): ara surt el resultat
  const e = P.espera; if (!e || P.fase !== 'joc') return; P.espera = null; const { x, y, res } = e;
  P.tretsMeus[K(x, y)] = res.r === 'a' ? 'a' : 't'; P.nou = K(x, y);
  if (res.r === 'a') { so('aigua'); diu(`${pt(x, y)}: <b>aigua</b>. 💧`, 'pensa'); }
  else { P.encerts++; so(res.r === 'e' ? 'enfonsat' : 'tocat'); diu(res.r === 'e' ? `${pt(x, y)}: <b>tocat i enfonsat</b>! Has enfonsat el ${res.v.nom.toLowerCase()}!` : `${pt(x, y)}: <b>tocat</b>! 💥`, 'content'); }
  if (tocades(P.seva, P.tretsMeus) === TOTAL) return fi(true);
  repinta();
}
function passaTorn() { P.torn = 'riv'; if (M.mode === 'company') envia({ tipus: 'fr4c-bat-net', op: 'escriu', upd: { torn: NET.jo === 'a' ? 'b' : 'a' } }); torn(); }
const msg = (t, c = '') => { const m = $('#msg'); if (m) { m.className = 'msg ' + c; m.innerHTML = t; } };
// la màquina: al nivell 1 dispara a l'atzar; als nivells 2 i 3, si toca, busca al voltant
function tretMaquina() {
  if (P.fase !== 'joc') return;
  const lliures = []; for (const x of valors()) for (const y of valors()) if (!P.tretsSeus[K(x, y)]) lliures.push([x, y]);
  let tria2 = null;
  if (M.nivell > 1 || Math.random() < .4) {
    const enf = new Set(enfonsatsDe(P.meva, P.tretsSeus).flatMap(id => P.meva.find(v => v.id === id).cells.map(c => K(...c))));
    const toc = Object.entries(P.tretsSeus).filter(([k, r]) => r !== 'a' && !enf.has(k)).map(([k]) => k.split(',').map(Number));
    const veins = toc.flatMap(([x, y]) => [[x + L().pas, y], [x - L().pas, y], [x, y + L().pas], [x, y - L().pas]]).filter(([x, y]) => existeix(x, y) && !P.tretsSeus[K(x, y)]);
    if (veins.length) tria2 = tria(veins);
  }
  const [x, y] = tria2 || tria(lliures);
  rebTret(x, y);
}
// un tret de l'altre: primer l'alumne ha de dir si l'ha tocat o no (practica llegir coordenades al seu tauler)
function rebTret(x, y, k = null) {
  P.pendent = { x, y, k }; P.torn = 'jo'; torn(); so('bip');
  $('#preg').innerHTML = `<div class="pregunta"><div class="q">${P.nomR} dispara al <b style="color:${T}">${pt(x, y)}</b>.<br>Mira la teva flota: t'ha tocat?</div><div class="fila"><button class="big sec" data-r="a">💧 Aigua</button><button class="big" data-r="t">💥 Tocat!</button></div></div>`;
  diu(`Busca el punt <b>${pt(x, y)}</b> a la teva graella.`, 'pensa');
  $$('#preg [data-r]').forEach(b => b.onclick = () => respon(b.dataset.r));
}
function respon(r) {
  const { x, y, k } = P.pendent; const res = resolTret(P.meva, P.tretsSeus, x, y); const bo = res.r === 'a' ? 'a' : 't';
  if (M.mode === 'company' && k) envia({ tipus: 'fr4c-bat-net', op: 'escriu', upd: { [`trets/${k}/v`]: true } });
  P.respostes++;
  if (r === bo) { P.ben++; P.encerts++; so('ok'); } else { P.errors++; P.fallades.push(`${pt(x, y)}: deia ${r === 'a' ? 'aigua' : 'tocat'}`); so('ko'); }
  P.tretsSeus[K(x, y)] = bo; P.nouMeu = K(x, y); P.pendent = null; $('#preg').innerHTML = '';
  setTimeout(() => so(bo === 'a' ? 'aigua' : res.r === 'e' ? 'enfonsat' : 'tocat'), 250);
  const txt = bo === 'a' ? 'era <b>aigua</b>' : res.r === 'e' ? `t'ha <b>enfonsat</b> el ${res.v.nom.toLowerCase()}` : 't\'ha <b>tocat</b> el ' + res.v.nom.toLowerCase();
  diu(r === bo ? `Ben vist! El ${pt(x, y)} ${txt}. Ara et toca a tu.` : `Compte: el ${pt(x, y)} ${txt}. Mira'l a la graella (primer la x, després la y).`, r === bo ? 'content' : 'pensa');
  if (tocades(P.meva, P.tretsSeus) === TOTAL) return fi(false);
  torn(true);
}
function fiTemps() { const a = tocades(P.seva, P.tretsMeus), b = tocades(P.meva, P.tretsSeus); fi(a > b ? true : a < b ? false : null, true); }
function fi(guanyo, perTemps = false) {
  if (P.fi) return; P.fi = true; P.fase = 'fi'; clearInterval(P.iv); P.guanya = guanyo;
  if (P.espera) { const e = P.espera; P.espera = null; P.tretsMeus[K(e.x, e.y)] = e.res.r === 'a' ? 'a' : 't'; }
  if (P.pendent) { const { x, y } = P.pendent; P.tretsSeus[K(x, y)] = resolTret(P.meva, P.tretsSeus, x, y).r === 'a' ? 'a' : 't'; P.pendent = null; }
  if (M.mode === 'company' && NET) envia({ tipus: 'fr4c-bat-net', op: 'escriu', upd: { estat: 'fi', guanya: guanyo === true ? NET.jo : guanyo === false ? (NET.jo === 'a' ? 'b' : 'a') : 'empat' } });
  const temps = Math.round((Date.now() - P.t0) / 1000); const toc = tocades(P.seva, P.tretsMeus);
  const punts = toc * 10 + P.ben * 5 + (guanyo ? 50 : 0) - P.errors * 3;
  envia({ tipus: 'fr4c-bat-fi', punts: Math.max(0, punts), encerts: P.encerts, errors: P.errors, nivell: M.nivell, temps, fallades: P.fallades.slice(0, 12) });
  so(guanyo ? 'guanya' : guanyo === false ? 'perd' : 'ok');
  repinta();
  $('#preg').innerHTML = ''; document.body.insertAdjacentHTML('beforeend', `<div id="fiCapa" style="position:fixed;inset:0;background:#0006;z-index:5;display:flex;align-items:center;justify-content:center"><div class="pregunta fi" style="max-width:520px;padding:22px 26px"><div class="estrella">${guanyo ? '🏆' : guanyo === false ? '🌊' : '🤝'}</div><div class="q">${perTemps ? 'S\'ha acabat el temps! ' : ''}${guanyo ? 'Has guanyat la batalla!' : guanyo === false ? `${P.nomR} ha enfonsat la teva flota.` : 'Empat!'}</div>
    <div class="mini">Punts tocats: <b>${toc}</b> de ${TOTAL} · Respostes bones «tocat o aigua»: <b>${P.ben}</b> de ${P.respostes} · Punts: <b>${Math.max(0, punts)}</b></div>
    <div class="fila"><button class="big" id="altra">Una altra partida</button><button class="big sec" id="veure">Mira els taulers</button><button class="big sec" id="surt2">Surt</button></div></div></div>`);
  diu(guanyo ? 'Visca! Meu, quina batalla!' : 'La propera la guanyem!', guanyo ? 'content' : 'pensa');
  ['#ix', '#iy', '#foc'].forEach(s => { const e = $(s); if (e) e.disabled = true; });
  $('#veure').onclick = () => { $('#fiCapa').style.display = 'none'; $('#preg').innerHTML = `<div class="fila"><button class="big" id="altra2">Una altra partida</button></div>`; $('#altra2').onclick = () => $('#altra').click(); };
  $('#altra').onclick = () => { $('#fiCapa')?.remove(); if (M.mode === 'company') envia({ tipus: 'fr4c-bat-net', op: 'surt' }); inici(); };
  $('#surt2').onclick = surt;
}
function marxat() {
  if (P.fase !== 'joc') return;
  $('#preg').innerHTML = `<div class="pregunta"><div class="q">${P.nomR} s'ha desconnectat.</div><div class="fila"><button class="big sec" id="espera2">Espera</button><button class="big" id="vsm">Acaba contra la màquina</button></div></div>`;
  $('#espera2').onclick = () => { P.avisMarxa = false; $('#preg').innerHTML = ''; };
  $('#vsm').onclick = () => { envia({ tipus: 'fr4c-bat-net', op: 'surt' }); NET = null; M.mode = 'maquina'; P.nomR = persNomM(rival()); $('#preg').innerHTML = ''; $('#barra').classList.add('amagat'); if (P.torn !== 'jo') setTimeout(tretMaquina, 800); torn(); };
}

/* ---------- missatges de l'app (mode company: l'app fa de pont amb Firebase) ---------- */
function rebEstat(p) {
  if (!NET || !p) return; NET.p = p; const jo = NET.jo, ell = jo === 'a' ? 'b' : 'a';
  if (M.pantalla === 'espera' && p.b) { so('meu'); colloca(); return; }
  if ((M.pantalla === 'esperaRival' || M.pantalla === 'colloca') && p.a?.llest && p.b?.llest && P.fase === 'colloca') {
    if (M.pantalla === 'colloca') return; // encara col·loco
    try { P.seva = JSON.parse(p[ell].flota).map(v => ({ ...FLOTA.find(f => f.id === v.id), cells: v.cells })); } catch (e) { return; }
    if (jo === 'a' && !p.torn) envia({ tipus: 'fr4c-bat-net', op: 'escriu', upd: { torn: 'a', estat: 'joc', inici: Date.now() } });
    if (!p.torn) return;
    comencaJoc(); return;
  }
  if (P.fase !== 'joc') return;
  // trets nous de l'altre
  const trets = Object.entries(p.trets || {}).sort((u, v) => u[0] < v[0] ? -1 : 1);
  NET.vistos = NET.vistos || new Set();
  for (const [k, t] of trets) { if (t.q === jo && t.v && P.espera && P.espera.x === t.x && P.espera.y === t.y) revela(); if (NET.vistos.has(k)) continue; NET.vistos.add(k); if (t.q === ell) { rebTret(t.x, t.y, k); } }
  if (p.torn === jo && P.torn !== 'jo' && !P.pendent) { P.torn = 'jo'; torn(); }
  if (p.estat === 'fi' && !P.fi) { fi(p.guanya === jo ? true : p.guanya === 'empat' ? null : false); }
}
window.addEventListener('message', ev => {
  const d = ev.data || {};
  if (d.tipus === 'fr4c-bat-ini') { const ja = M.dinsApp; M.dinsApp = true; if (!ja) MUS.on = false; M.nom = d.nom || ''; M.nivell = Math.max(1, Math.min(3, d.nivell || 2)); M.record = d.record || 0; if (d.so === false) M.so = false; pintaBotons(); if (M.pantalla === 'inici') inici(); musicaInici(); return; }
  if (d.tipus !== 'fr4c-bat-xarxa') return;
  if (d.ev === 'creada') { NET = { codi: d.codi, jo: 'a', p: null }; espera(d.codi); }
  else if (d.ev === 'unit') { NET = { codi: d.codi, jo: 'b', p: null }; M.nivell = d.nivell || M.nivell; so('meu'); colloca(); }
  else if (d.ev === 'error') company(d.msg || 'No s\'ha pogut connectar.');
  else if (d.ev === 'estat') rebEstat(d.p);
});
function surt() { musica(false); clearInterval(P.iv); if (NET) envia({ tipus: 'fr4c-bat-net', op: 'surt', marxa: true }); M.pantalla = 'fora'; envia({ tipus: 'fr4c-bat-tanca' }); if (window.parent === window) inici(); }
function pintaBotons() { $('#so').textContent = M.so ? '🔊' : '🔇'; $('#mus').style.opacity = M.mus ? 1 : .4; }
$('#so').onclick = () => { M.so = !M.so; try { localStorage.setItem('fr4c_bat_so', M.so ? '1' : '0'); } catch (e) { } if (!M.so) musica(false); pintaBotons(); };
$('#mus').onclick = () => { M.mus = !M.mus; try { localStorage.setItem('fr4c_bat_mus', M.mus ? '1' : '0'); } catch (e) { } musica(M.mus && ['inici', 'company', 'espera', 'colloca'].includes(M.pantalla)); pintaBotons(); };
$('#surt').onclick = surt;
window.__bat = { P, M, MUS, existeix, resolTret, dispara, respon, flotaAtzar, valors };
pintaBotons(); inici(); musicaInici(); envia({ tipus: 'fr4c-bat-llest' });
</script>
