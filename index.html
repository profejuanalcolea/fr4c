<script type="text/plain" id="joc-dimp"><!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fraccions impròpies amb en FR-4C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--ink:#000000;--muted:#555555;--line:#cfcfcf;--paper:#ffffff;
  --accent:#ff6a00;--accent-soft:#ffe3cc;--empty:#f3f3f3;--ok:#1f8a44;--ko:#c62828;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000000;--ink:#ffffff;--muted:#bdbdbd;--line:#444444;--paper:#141414;--accent-soft:#40210a;--empty:#262626;}}
:root[data-theme="dark"]{--bg:#000000;--ink:#ffffff;--muted:#bdbdbd;--line:#444444;--paper:#141414;--accent-soft:#40210a;--empty:#262626;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',Verdana,sans-serif;font-size:clamp(16px,1.35vw,25px);line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.hide{display:none!important}
.disp{font-family:'Bricolage Grotesque','Arial Black',sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1}

/* barra superior */
header{display:flex;align-items:center;gap:1rem;padding:.45rem 1.2rem;border-bottom:4px solid var(--ink)}
header h1{font-size:1.3em;margin:0;flex:1}
.lvl{background:var(--accent);color:#000;border:3px solid #000;border-radius:999px;padding:.15em .8em;font-weight:700;white-space:nowrap}
.dots{display:flex;gap:.35em}
.dots i{width:.7em;height:.7em;border-radius:50%;border:3px solid var(--ink);display:block}
.dots i.done{background:var(--ink)}.dots i.now{background:var(--accent)}
.ico{border:3px solid var(--ink);background:var(--paper);border-radius:12px;width:2.3em;height:2.3em;font-size:.9em}
.stars{font-weight:700;white-space:nowrap}

/* escenari */
main{display:grid;grid-template-columns:minmax(200px,22%) 1fr;gap:1.1rem;padding:.8rem 1.2rem 1rem;max-width:1700px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}.robcol{flex-direction:row;align-items:center}.robot{width:120px!important}}
.robcol{display:flex;flex-direction:column;gap:.8rem}
.robot{width:100%;max-width:210px;position:relative;margin:0 auto}
.robot svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{border:4px solid var(--ink);background:var(--paper);border-radius:20px;padding:.8em 1em;font-size:1.05em;min-height:5.2em;position:relative;flex:1}
.bubble::before{content:"";position:absolute;left:50%;top:-16px;border:14px solid transparent;border-bottom-color:var(--ink);border-top:0;transform:translateX(-50%)}
@media (max-width:820px){.bubble::before{left:-16px;top:50%;border:14px solid transparent;border-right-color:var(--ink);border-left:0;transform:translateY(-50%)}}

.stage{border:4px solid var(--ink);border-radius:24px;padding:.9rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;min-height:60vh;background:var(--paper)}
.q{font-size:1.5em;font-weight:700;margin:0;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.q .big{font-size:1.6em}
.work{flex:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1.4rem}
.foot{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;min-height:4.2rem}
.btn{border:4px solid #000;background:var(--paper);color:var(--ink);padding:.5em 1.1em;border-radius:16px;box-shadow:4px 4px 0 var(--ink);font-weight:700;font-size:1.05em}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#000}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* fracció apilada */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;line-height:1.02}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.mixed{display:inline-flex;align-items:center;gap:.12em;font-family:'Bricolage Grotesque',sans-serif;font-weight:800}

/* unitats (cercles i barres) */
.unit{width:clamp(100px,10vw,185px);height:auto}
.unit.bar{width:clamp(180px,20vw,340px)}
.unit path,.unit rect.p{fill:var(--empty);stroke:var(--ink);stroke-width:3}
.unit path.on,.unit rect.p.on{fill:var(--accent)}
.unit.click path,.unit.click rect.p{cursor:pointer}
.unit.click path:hover,.unit.click rect.p:hover{fill:var(--accent-soft)}
.unit.click path.on:hover,.unit.click rect.p.on:hover{fill:var(--accent)}
.unit .on{animation:pop .22s}
@keyframes pop{50%{opacity:.5}}
.count{font-size:1.2em;font-weight:700}

/* opcions */
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;width:100%}
@media (max-width:820px){.opts{grid-template-columns:repeat(2,1fr)}}
.opt{border:4px solid #000;background:var(--paper);color:var(--ink);border-radius:20px;padding:.25em;font-size:1.8em;box-shadow:5px 5px 0 var(--ink)}
.opt.good{background:var(--ok);color:#fff}.opt.bad{background:var(--ko);color:#fff;animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* recta */
.line{width:100%;height:auto;overflow:visible}
.line .axis{stroke:var(--ink);stroke-width:5}
.line .tk{stroke:var(--ink);stroke-width:3}
.line .tk.int{stroke-width:6}
.line .lab{fill:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:38px;text-anchor:middle}
.line .hit{fill:transparent;cursor:pointer}
.line .hit:hover+.dot{fill:var(--accent-soft);stroke:var(--ink)}
.line .dot{fill:transparent;stroke:transparent;stroke-width:3;pointer-events:none}
.line .mark{fill:var(--accent);stroke:#000;stroke-width:4}
.line .bad{fill:var(--ko);stroke:#000;stroke-width:3}
.line .flag{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;fill:var(--ink);text-anchor:middle}
.line .jump{fill:none;stroke:var(--accent);stroke-width:4;stroke-dasharray:6 6}

.result{font-size:1.6em;font-weight:700;display:flex;gap:.4em;align-items:center;justify-content:center;flex-wrap:wrap}
.result .fr,.result .mixed{font-size:1.1em}

/* portada i final */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem;min-height:100vh;padding:1rem}
.cover h2{font-size:clamp(2.3rem,5.5vw,4.8rem);margin:0}
.cover .robot{max-width:130px}
.cover p{max-width:38em;margin:0;font-size:1.05em}
.levels{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center}
.levels div{border:4px solid var(--ink);border-radius:18px;padding:.3em 1em;min-width:10em}
.levels b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:1.3em}
.sig{color:var(--muted);font-size:.8em}

/* fruites */
.fruits{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.fruitbar{padding:.45rem 1.2rem;border-bottom:4px solid var(--ink)}
.fruit{border:4px solid #000;border-radius:18px;background:var(--paper);color:var(--ink);padding:.05em .6em .05em .4em;display:flex;align-items:center;gap:.3em;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.2em;position:relative;box-shadow:3px 3px 0 var(--ink);min-width:4.2em;justify-content:center}
.fruit .e{font-size:1.45em;line-height:1}
.fruit.sel{background:var(--accent);color:#000;transform:translateY(-4px);box-shadow:3px 7px 0 var(--ink)}
.fruit.bump .e{animation:fbump .5s}
@keyframes fbump{40%{transform:scale(1.5) rotate(-12deg)}}
.fruit .plus{position:absolute;top:-.9em;right:-.3em;background:#000;color:#fff;border-radius:999px;padding:0 .4em;font-size:.8em;animation:plus 1.3s forwards;pointer-events:none}
@keyframes plus{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}
.pick{display:flex;flex-direction:column;align-items:center;gap:.55rem;border:4px dashed var(--ink);border-radius:22px;padding:.6rem 1.2rem}
.btn.small{font-size:.8em;padding:.35em .9em;box-shadow:3px 3px 0 var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem;width:min(560px,92vw)}
.rank li{display:grid;grid-template-columns:2em 2em 1fr auto;align-items:center;gap:.5em;border:4px solid var(--ink);border-radius:16px;padding:.05em .8em;font-size:1.1em;font-weight:700;text-align:left}
.rank li.top{background:var(--accent);color:#000}
.rank .e{font-size:1.4em}.rank .pt{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3em}

/* ajuda visual */
.units{display:flex;flex-wrap:wrap;gap:1.4rem;justify-content:center;align-items:flex-start;width:100%}
.ucol{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.ulab{min-height:2.5em;font-size:1.2em;display:flex;align-items:center;gap:.3em;opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .3s}
.ulab.show{opacity:1;transform:none}
.ulab small{font-weight:700;color:var(--muted);font-size:.7em}
.merge{display:flex;align-items:center;justify-content:center;gap:.5em;font-size:1.5em;min-height:2.9em;width:100%}
.merge .pt{display:inline-flex;transition:transform .45s ease-in,opacity .45s ease-in;animation:popin .3s both}
.merge .op{font-weight:800}
.merge .res{display:inline-flex;align-items:center;gap:.35em;font-weight:800;background:var(--accent-soft);border:4px solid var(--ink);border-radius:18px;padding:.1em .6em;animation:popin .45s both}
@keyframes popin{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.line .band{fill:var(--accent);opacity:.75;animation:fadein .35s both}
.line .band.rest{opacity:.4}
.line .seglab{fill:var(--ink);font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;text-anchor:middle;animation:fadein .35s both}
@keyframes fadein{from{opacity:0}}

/* robot animat */
.bob{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 50%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.eyes{animation:blink 4s infinite;transform-origin:50px 44px;transform-box:view-box}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.m-wave .armR,.m-happy .armR{animation:wave .45s ease-in-out infinite alternate;transform-origin:72px 88px;transform-box:view-box}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(20deg)}}
.robot.jump svg{animation:hop .6s}
@keyframes hop{40%{transform:translateY(-14%)}}
.robot.shake svg{animation:rshake .5s}
@keyframes rshake{20%,60%{transform:translateX(-4%)}40%,80%{transform:translateX(4%)}}
.talk .mouth{animation:talk .18s infinite alternate;transform-origin:50px 60px;transform-box:view-box}
@keyframes talk{to{transform:scaleY(.4)}}
.sweat{position:absolute;right:14%;top:14%;font-size:2.2em;animation:drip 1.4s forwards;pointer-events:none}
@keyframes drip{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(60px)}}
.spark{position:absolute;font-size:1.8em;pointer-events:none;animation:spark 1s forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
.dotsthink::after{content:"";animation:th 1s steps(4) infinite}
@keyframes th{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<\!-- PORTADA -->
<section id="scrCover" class="cover">
  <div class="robot" id="coverRob"></div>
  <h2 class="disp">Fraccions impròpies</h2>
  <p>En FR-4C ha descobert unes fraccions estranyes: tenen <b>el numerador més gran que el denominador</b>. Són més d'una unitat sencera! Ajudem-lo a representar-les.</p>
  <div class="levels">
    <div><b>Nivell 1</b>Quina fracció és?</div>
    <div><b>Nivell 2</b>Pinta-la</div>
    <div><b>Nivell 3</b>Posa-la a la recta</div>
  </div>
  <div class="pick">
    <p><b>Qui comença?</b> Toqueu una fruita. Durant la partida la podeu canviar quan vulgueu.</p>
    <div class="fruits" id="coverFruits"></div>
    <button class="btn small" id="bReset">Posa a zero els comptadors</button>
  </div>
  <div class="foot">
    <button class="btn primary" id="bGo">Comencem</button>
    <button class="btn" id="bTest">🔊 Prova el so</button>
    <button class="btn" id="bFs1">⛶ Pantalla completa</button>
  </div>
  <div class="sig">Matemàtiques · Ins Júlia Minguell, Badalona · Fet amb IA</div>
</section>

<\!-- JOC -->
<section id="scrGame" class="hide">
  <header>
    <h1 class="disp">Fraccions impròpies</h1>
    <span class="lvl" id="lvl">Nivell 1</span>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <button class="ico" id="bSnd" aria-pressed="true" aria-label="So">🔊</button>
    <button class="ico" id="bFs" aria-label="Pantalla completa">⛶</button>
  </header>
  <nav class="fruitbar fruits" id="gameFruits" aria-label="Equips: toca una fruita per canviar qui juga"></nav>
  <main>
    <div class="robcol">
      <div class="robot" id="rob"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </div>

      <div class="foot" id="foot"></div>
    </div>

</section>

<canvas id="confetti"></canvas>

<script>
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const NUM=['zero','un','dos','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze','tretze','catorze','quinze'];
const SING={2:'mig',3:'terç',4:'quart',5:'cinquè',6:'sisè'};
const PLUR={2:'mitjos',3:'terços',4:'quarts',5:'cinquens',6:'sisens'};
const words=(n,d)=>NUM[n]+' '+(n===1?SING[d]:PLUR[d]);
function mixedHTML(n,d){const w=Math.floor(n/d),r=n%d;return r?`<span class="mixed">${w}${F(r,d)}</span>`:`<span class="mixed">${w}</span>`;}
function mixedWords(n,d){const w=Math.floor(n/d),r=n%d;const ws=w===1?'un sencer':NUM[w]+' sencers';return r?`${ws} i ${words(r,d)}`:ws;}

/* ================= SO ================= */
let AC=null,MASTER=null,SND=true;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MASTER=AC.createGain();MASTER.gain.value=.9;MASTER.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return AC;}
function tone(type,f,t,dur,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MASTER);o.start(t);o.stop(t+dur+.05);}
const SFX={
  coin(){const t=AC.currentTime;tone('square',988,t,.08,.25);tone('square',1319,t+.08,.3,.25);},
  merge(){const t=AC.currentTime;tone('sine',300,t,.35,.35,1100);},
  ding(){const t=AC.currentTime;tone('sine',1047,t,.25,.5);tone('sine',1568,t+.13,.45,.5);},
  ohoh(){const t=AC.currentTime;tone('square',392,t,.28,.35);tone('square',294,t+.3,.45,.35);},
  pop(){const t=AC.currentTime;tone('triangle',660,t,.09,.35,990);},
  unpop(){const t=AC.currentTime;tone('triangle',700,t,.09,.3,420);},
  boop(){const t=AC.currentTime;tone('sine',520,t,.12,.3);},
  whoosh(){const t=AC.currentTime;tone('sawtooth',200,t,.3,.12,1200);},
  bleep(){const t=AC.currentTime;[880,660,990,740].forEach((f,i)=>tone('square',f,t+i*.07,.06,.12));},
  fanfare(){const t=AC.currentTime;[523,659,784,1047,784,1047].forEach((f,i)=>tone('triangle',f,t+i*.14,i===5?.7:.16,.45));},
  level(){const t=AC.currentTime;[392,523,659,784].forEach((f,i)=>tone('square',f,t+i*.1,.14,.2));},
  sad(){const t=AC.currentTime;[440,415,392,370].forEach((f,i)=>tone('triangle',f,t+i*.22,.3,.3));}
};
function sfx(n){if(!SND||!ac())return;try{SFX[n]();}catch(e){}}

/* ================= ROBOT ================= */
function robotSVG(mood){let eyes,mouth;const O='#ff6a00';
  if(mood==='happy'){eyes=`<path d="M31 45 q7 -9 14 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/><path d="M55 45 q7 -9 14 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;mouth=`<path d="M40 59 q10 8 20 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  else if(mood==='think'){eyes=`<circle cx="40" cy="41" r="5" fill="${O}"/><circle cx="64" cy="41" r="5" fill="${O}"/>`;mouth=`<path d="M43 60 h14" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  else if(mood==='oops'){eyes=`<circle cx="38" cy="44" r="4.5" fill="${O}"/><circle cx="62" cy="44" r="4.5" fill="${O}"/><path d="M31 35 l11 3 M69 35 l-11 3" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;mouth=`<path d="M40 62 q5 -4 10 0 t10 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  else if(mood==='wow'){eyes=`<circle cx="38" cy="44" r="7" fill="${O}"/><circle cx="62" cy="44" r="7" fill="${O}"/>`;mouth=`<circle cx="50" cy="61" r="4.5" fill="none" stroke="${O}" stroke-width="4"/>`;}
  else{eyes=`<circle cx="38" cy="44" r="5.5" fill="${O}"/><circle cx="62" cy="44" r="5.5" fill="${O}"/>`;mouth=`<path d="M42 60 q8 4 16 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  const up=mood==='wave'||mood==='happy';
  const armR=up?`<path d="M72 88 L86 70" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="87" cy="68" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:`<path d="M72 88 L84 100" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="85" cy="101" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`;
  const armL=mood==='happy'?`<path d="M28 88 L14 70" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="13" cy="68" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:mood==='think'?`<path d="M28 88 L40 66" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="41" cy="64" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:`<path d="M28 88 L16 100" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="15" cy="101" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`;
  return `<svg viewBox="-12 -16 130 134" class="m-${mood}" aria-hidden="true"><g class="bob">${armL}<g class="armR">${armR}</g>
  <rect x="30" y="82" width="40" height="26" rx="8" fill="${O}" stroke="#000" stroke-width="4"/><text x="50" y="100" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="11">FR-4C</text>
  <rect x="6" y="36" width="10" height="20" rx="4" fill="#fff" stroke="#000" stroke-width="4"/><rect x="84" y="36" width="10" height="20" rx="4" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect x="14" y="20" width="72" height="58" rx="16" fill="#fff" stroke="#000" stroke-width="4"/><rect x="22" y="28" width="56" height="42" rx="10" fill="#000"/>
  <g class="eyes">${eyes}</g><g class="mouth">${mouth}</g>
  <line x1="50" y1="8" x2="50" y2="20" stroke="#000" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="6" r="6" fill="${O}" stroke="#000" stroke-width="3"/></g></svg>`;}
let sayTimer=null;
function say(html,mood='idle',anim){
  const r=$('#rob');r.innerHTML=robotSVG(mood);r.classList.remove('jump','shake');void r.offsetWidth;
  if(anim==='jump'){r.classList.add('jump');sparks();}
  if(anim==='shake'){r.classList.add('shake');const s=document.createElement('span');s.className='sweat';s.textContent='💧';r.appendChild(s);setTimeout(()=>s.remove(),1500);}
  // text lletra a lletra (respectant etiquetes)
  const b=$('#bubble');clearInterval(sayTimer);
  const parts=html.split(/(<[^>]+>)/);let out='',pi=0,ci=0;r.classList.add('talk');
  const svg=r.querySelector('svg');if(svg)svg.classList.add('talk');
  sayTimer=setInterval(()=>{
    let steps=2;
    while(steps>0&&pi<parts.length){const p=parts[pi];
      if(p.startsWith('<')){out+=p;pi++;continue;}
      if(ci<p.length){out+=p[ci++];steps--;}else{pi++;ci=0;}}
    b.innerHTML=out;
    if(pi>=parts.length){clearInterval(sayTimer);b.innerHTML=html;if(svg)svg.classList.remove('talk');}
  },22);
}
function sparks(){const r=$('#rob');for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=rnd(['✨','⭐','✦']);
  s.style.left='45%';s.style.top='35%';const a=Math.PI*2*i/8;s.style.setProperty('--dx',Math.cos(a)*90+'px');s.style.setProperty('--dy',Math.sin(a)*90+'px');r.appendChild(s);setTimeout(()=>s.remove(),1050);}}

/* ================= DIBUIXOS ================= */
function circleSVG(d,filledSet,click,u){const cx=60,cy=60,r=52;let s=`<svg class="unit ${click?'click':''}" viewBox="0 0 120 120" role="img" aria-label="Unitat dividida en ${d} parts">`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path data-u="${u}" data-i="${i}" class="${filledSet.has(i)?'on':''}" d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${d===1?1:0} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z"/>`;}
  return s+`</svg>`;}
function barSVG(d,filledSet,click,u){const W=300,H=80,w=W/d;let s=`<svg class="unit bar ${click?'click':''}" viewBox="-3 -3 ${W+6} ${H+6}" role="img" aria-label="Unitat dividida en ${d} parts">`;
  for(let i=0;i<d;i++)s+=`<rect data-u="${u}" data-i="${i}" class="p ${filledSet.has(i)?'on':''}" x="${(i*w).toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${H}"/>`;
  return s+`</svg>`;}
const unitSVG=(shape,d,set,click,u)=>shape==='bar'?barSVG(d,set,click,u):circleSVG(d,set,click,u);
function fillSets(n,d,units){const sets=[];let left=n;for(let u=0;u<units;u++){const k=Math.max(0,Math.min(d,left));sets.push(new Set([...Array(k).keys()]));left-=k;}return sets;}

/* ================= REPTES ================= */
const LEVELS=[
  {name:'Nivell 1 · Quina fracció és?',items:[
    {t:'read',n:3,d:2,shape:'circle'},{t:'read',n:5,d:4,shape:'bar'},{t:'read',n:7,d:3,shape:'circle'},{t:'read',n:11,d:4,shape:'bar'}]},
  {name:'Nivell 2 · Pinta-la',items:[
    {t:'paint',n:5,d:3,shape:'circle'},{t:'paint',n:7,d:4,shape:'bar'},{t:'paint',n:8,d:3,shape:'circle'},{t:'paint',n:11,d:6,shape:'bar'}]},
  {name:'Nivell 3 · Posa-la a la recta',items:[
    {t:'line',n:7,d:4,max:3},{t:'line',n:8,d:3,max:4},{t:'line',n:13,d:5,max:3,noLabels:true},{t:'line',n:11,d:4,max:4,fromMixed:true}]}
];
const ALL=[];LEVELS.forEach((L,li)=>L.items.forEach(it=>ALL.push({...it,li})));
let idx=0,tries=0,cur=null,done=false;

function renderTop(){
  $('#lvl').textContent=LEVELS[ALL[idx].li].name;
  $('#dots').innerHTML=ALL.map((_,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join('');
}
function nextBtn(){const last=idx===ALL.length-1;
  $('#foot').innerHTML=`<button class="btn primary" id="bNext">${last?'Acabar 🎉':'Següent repte'}</button>`;
  $('#bNext').onclick=next;$('#bNext').focus({preventScroll:true});}
function next(){if(idx<ALL.length-1){const lvlChange=ALL[idx+1].li!==ALL[idx].li;idx++;sfx(lvlChange?'level':'whoosh');load(lvlChange);}else finale();}

function load(newLevel){
  AIDTOK++;cur=ALL[idx];tries=0;done=false;renderTop();$('#foot').innerHTML='';
  const intros={
    read:['Mireu el dibuix. Quina fracció hi ha pintada?','Compteu bé: quantes parts té cada unitat?','Aquesta és més llarga… Quina fracció és?','Última del nivell 1! Compta, compta…'],
    paint:['Ara vosaltres pinteu! Toqueu els trossos per pintar-los.','Pinteu la fracció. Quants trossos té cada barra?','Aquesta passa de dues unitats. Endavant!','Sisens! Aquesta és la més difícil de pintar.'],
    line:['Posem la fracció a la recta. Toqueu el punt on va.','Ara la recta va fins al 4. Compteu els salts!','Ull: aquí no hi ha números a les marques petites…','Repte final: us la dono com a nombre mixt!']};
  const pos=ALL.slice(0,idx).filter(a=>a.li===cur.li).length;
  let intro=intros[cur.t][pos];
  if(newLevel&&cur.t==='paint')intro='<b>Nivell 2!</b> '+intro;
  if(newLevel&&cur.t==='line')intro='<b>Nivell 3!</b> '+intro;
  say(intro,newLevel?'wave':'idle');
  if(cur.t==='read')loadRead();else if(cur.t==='paint')loadPaint();else loadLine();
}

/* ================= FRUITES (equips) ================= */
const FRUITS=[{e:'🍎',n:'Poma'},{e:'🍌',n:'Plàtan'},{e:'🍇',n:'Raïm'},{e:'🍓',n:'Maduixa'},{e:'🍊',n:'Taronja'},{e:'🍉',n:'Síndria'}];
const KEY='fr4c-impropies-fruites';let FS={sc:[0,0,0,0,0,0],sel:0};
try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.sc)&&v.sc.length===6&&v.sel>=0&&v.sel<6)FS=v;}catch(e){}
function saveFS(){try{localStorage.setItem(KEY,JSON.stringify(FS));}catch(e){}}
function renderFruits(){document.querySelectorAll('.fruits').forEach(box=>{
  box.innerHTML=FRUITS.map((f,i)=>`<button class="fruit ${FS.sel===i?'sel':''}" data-f="${i}" aria-pressed="${FS.sel===i}" aria-label="${f.n}: ${FS.sc[i]} punts"><span class="e">${f.e}</span><span class="pts">${FS.sc[i]}</span></button>`).join('');});}
document.addEventListener('click',e=>{const b=e.target.closest('.fruit');if(!b)return;const i=+b.dataset.f;if(i===FS.sel)return;
  FS.sel=i;saveFS();sfx('boop');renderFruits();
  if(!$('#scrGame').classList.contains('hide')&&!done)say(`Ara juga <b>${FRUITS[i].e} ${FRUITS[i].n}</b>! Endavant!`,'wave');});
function award(p){FS.sc[FS.sel]+=p;saveFS();renderFruits();sfx('coin');
  const b=$(`#gameFruits .fruit[data-f="${FS.sel}"]`);if(!b)return;b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');
  const s=document.createElement('span');s.className='plus';s.textContent='+'+p;b.appendChild(s);setTimeout(()=>s.remove(),1300);}
$('#bReset').onclick=()=>{const b=$('#bReset');
  if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Segur? Torna a tocar';clearTimeout(b._t);b._t=setTimeout(()=>{b.dataset.c='';b.textContent='Posa a zero els comptadors';},4000);return;}
  clearTimeout(b._t);FS.sc=[0,0,0,0,0,0];saveFS();renderFruits();sfx('unpop');b.dataset.c='';b.textContent='Comptadors a zero ✓';
  setTimeout(()=>{b.textContent='Posa a zero els comptadors';},2500);};

/* ================= AJUDA VISUAL EN ENCERTAR ================= */
const ucol=svg=>`<div class="ucol">${svg}<div class="ulab"></div></div>`;
function partsOf(n,d){const w=Math.floor(n/d),r=n%d,p=[];for(let i=0;i<w;i++)p.push([d,d]);if(r)p.push([r,d]);return p;}
let AIDTOK=0;
function aid(){const tok=++AIDTOK,{n,d}=cur,parts=partsOf(n,d);const T=(ms,f)=>setTimeout(()=>{if(tok===AIDTOK)f();},ms);
  const labs=[...document.querySelectorAll('#work .ulab')];
  parts.forEach((p,i)=>{if(labs[i])T(120+i*200,()=>{labs[i].innerHTML=F(p[0],p[1])+(p[0]===p[1]?'<small>= 1</small>':'');labs[i].classList.add('show');sfx('pop');});});
  const m=$('#merge');if(!m)return;
  const base=(cur.t==='line'?150+parts.length*220:120+parts.length*200)+250;
  T(base,()=>{m.innerHTML=parts.map(p=>`<span class="pt">${F(p[0],p[1])}</span>`).join('<span class="pt op">+</span>');});
  T(base+850,()=>{const r=m.getBoundingClientRect(),cx=r.left+r.width/2;
    m.querySelectorAll('.pt').forEach(el=>{const b=el.getBoundingClientRect();el.style.transform=`translateX(${cx-(b.left+b.width/2)}px) scale(.5)`;el.style.opacity='0';});sfx('merge');});
  T(base+1350,()=>{m.innerHTML=`<span class="res">${F(n,d)} = ${mixedHTML(n,d)}</span>`;});}

/* ---- Nivell 1: llegir ---- */
function loadRead(){const {n,d,shape}=cur,units=Math.ceil(n/d);$('#work').onclick=null;
  $('#q').innerHTML='Quina fracció hi ha pintada?';
  const sets=fillSets(n,d,units);
  let opts=[[n,d],[n,units*d],[d,n],[n-d,d],[n+1,d]].filter(([a,b])=>a>0);
  const seen=new Set();opts=opts.filter(([a,b])=>{const k=a+'/'+b;if(seen.has(k))return false;seen.add(k);return true;}).slice(0,4);
  shuffle(opts);
  $('#work').innerHTML=`<div class="units">${sets.map((s,u)=>ucol(unitSVG(shape,d,s,false,u))).join('')}</div><div class="merge" id="merge" aria-live="polite"></div>
    <div class="opts">${opts.map(([a,b])=>`<button class="opt" data-n="${a}" data-d="${b}" aria-label="${words(a,b)}">${F(a,b)}</button>`).join('')}</div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;const a=+b.dataset.n,c=+b.dataset.d;
    if(a===n&&c===d){b.classList.add('good');document.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      win(`Exacte! Cada unitat té <b>${d}</b> parts i n'hi ha <b>${n}</b> de pintades: ${F(n,d)}, <i>${words(n,d)}</i>.`);aid();}
    else{b.classList.add('bad');b.disabled=true;
      let h;if(c===units*d)h=`Compte! El denominador diu en quantes parts es divideix <b>UNA</b> unitat, no totes juntes.`;
      else if(a===d&&c===n)h=`Ui, està al revés! A dalt van les parts pintades, a baix les parts d'una unitat.`;
      else h=`Gairebé! Torneu a comptar les parts pintades, una per una.`;
      fail(h,()=>{document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.n===n&&+o.dataset.d===d)o.classList.add('good');});aid();});}});
}

/* ---- Nivell 2: pintar ---- */
function loadPaint(){const {n,d,shape}=cur,units=Math.ceil(n/d)+1;
  $('#q').innerHTML=`Pinteu <span class="big">${F(n,d)}</span>`;
  const sets=Array.from({length:units},()=>new Set());
  $('#work').innerHTML=`<div class="units" id="units"></div><div class="count">Trossos pintats: <span id="cnt">0</span></div><div class="merge" id="merge" aria-live="polite"></div>`;
  const draw=()=>{$('#units').innerHTML=sets.map((s,u)=>ucol(unitSVG(shape,d,s,!done,u))).join('');$('#cnt').textContent=sets.reduce((a,s)=>a+s.size,0);};
  const tidy=()=>{const f=fillSets(n,d,units);f.forEach((s,u)=>{sets[u].clear();s.forEach(x=>sets[u].add(x));});};
  draw();
  $('#work').onclick=e=>{if(done)return;const el=e.target.closest('[data-u]');if(!el)return;const u=+el.dataset.u,i=+el.dataset.i;
    if(sets[u].has(i)){sets[u].delete(i);sfx('unpop');}else{sets[u].add(i);sfx('pop');}draw();};
  $('#foot').innerHTML=`<button class="btn" id="bClr">Esborra</button><button class="btn primary" id="bChk">Comprova</button>`;
  $('#bClr').onclick=()=>{if(done)return;sets.forEach(s=>s.clear());sfx('unpop');draw();};
  $('#bChk').onclick=()=>{if(done)return;const c=sets.reduce((a,s)=>a+s.size,0);
    if(c===n){win(`Perfecte! ${F(n,d)} són <b>${Math.floor(n/d)}</b> ${Math.floor(n/d)===1?'unitat sencera':'unitats senceres'}${n%d?` i ${F(n%d,d)} més`:''}.`);tidy();draw();aid();}
    else{const h=c<n?`N'heu pintat <b>${c}</b>, però en calen <b>${n}</b>. Quan una unitat s'omple, continueu a la següent!`:`N'heu pintat <b>${c}</b>: massa! En calen només <b>${n}</b>.`;
      fail(h,()=>{tidy();draw();aid();});}};
}

/* ---- Nivell 3: recta ---- */
function loadLine(){const {n,d,fromMixed}=cur;cur.mark=null;cur.bad=null;cur.aid=false;
  $('#q').innerHTML=fromMixed?`On va el nombre mixt <span class="big">${mixedHTML(n,d)}</span>?`:`On va <span class="big">${F(n,d)}</span> a la recta?`;
  $('#work').innerHTML=`<div id="lineBox" style="width:100%"></div><div class="merge" id="merge" aria-live="polite"></div>`;
  drawLine();
  $('#work').onclick=e=>{if(done)return;const h=e.target.closest('.hit');if(!h)return;const k=+h.dataset.k;
    if(k===n){cur.mark=k;cur.aid=true;
      win(fromMixed?`Molt bé! ${mixedHTML(n,d)} = ${F(n,d)}: ${Math.floor(n/d)} unitats són ${Math.floor(n/d)*d} ${PLUR[d]}, i ${n%d} més fan ${n}.`
        :`Sí! Des del 0 fem <b>${n}</b> salts de ${F(1,d)}.`);drawLine(true);aid();}
    else{cur.bad=k;drawLine();sfx('ohoh');
      const h2=k%d===0&&k/d===Math.floor(n/d)?`Aquí hi ha el ${k/d}, i ens falten ${n-k} salts més!`:`Aquest punt és ${F(k,d)}. Cada unitat té <b>${d}</b> trossos: compteu <b>${n}</b> salts des del 0.`;
      fail(h2,()=>{cur.mark=n;cur.aid=true;drawLine(true);aid();},true);}};
}
function drawLine(jumps){const {n,d,max,noLabels}=cur,W=1000,x0=40,x1=960,y=110,step=(x1-x0)/(max*d);
  let s=`<svg class="line" viewBox="0 0 ${W} 250" role="img" aria-label="Recta de 0 a ${max} dividida en ${PLUR[d]}"><line class="axis" x1="${x0-20}" y1="${y}" x2="${x1+25}" y2="${y}"/><path d="M${x1+25} ${y-10} L${x1+40} ${y} L${x1+25} ${y+10}" fill="var(--ink)"/>`;
  if(cur.aid){const w=Math.floor(n/d),r=n%d;
    for(let u=0;u<w;u++){const a=x0+u*d*step,b=a+d*step;s+=`<rect class="band" x="${a}" y="${y-9}" width="${b-a}" height="18" style="animation-delay:${.15+u*.22}s"/><text class="seglab" x="${(a+b)/2}" y="${y+125}" style="animation-delay:${.15+u*.22}s">${d}/${d}</text>`;}
    if(r){const a=x0+w*d*step,b=a+r*step;s+=`<rect class="band rest" x="${a}" y="${y-9}" width="${b-a}" height="18" style="animation-delay:${.15+w*.22}s"/><text class="seglab" x="${(a+b)/2}" y="${y+125}" style="animation-delay:${.15+w*.22}s">${r}/${d}</text>`;}}
  if(jumps&&cur.mark!=null){for(let k=0;k<cur.mark;k++){const a=x0+k*step,b=a+step;s+=`<path class="jump" d="M${a} ${y-12} Q${(a+b)/2} ${y-12-Math.min(40,step*.8)} ${b} ${y-12}"/>`;}}
  for(let k=0;k<=max*d;k++){const x=x0+k*step,int=k%d===0;
    s+=`<line class="tk ${int?'int':''}" x1="${x}" y1="${y-(int?26:16)}" x2="${x}" y2="${y+(int?26:16)}"/>`;
    if(int)s+=`<text class="lab" x="${x}" y="${y+70}">${k/d}</text>`;
    else if(!noLabels&&d<=4)s+=`<text class="lab" x="${x}" y="${y+62}" style="font-size:22px;fill:var(--muted)">${k}/${d}</text>`;
    s+=`<rect class="hit" data-k="${k}" x="${x-Math.max(14,step/2)}" y="${y-60}" width="${Math.max(28,step)}" height="120"/><circle class="dot" cx="${x}" cy="${y}" r="14"/>`;}
  if(cur.bad!=null&&cur.mark==null){const x=x0+cur.bad*step;s+=`<circle class="bad" cx="${x}" cy="${y}" r="15"/>`;}
  if(cur.mark!=null){const x=x0+cur.mark*step;s+=`<circle class="mark" cx="${x}" cy="${y}" r="18"/><text class="flag" x="${x}" y="${y-72}">${n}/${d}</text>`;}
  $('#lineBox').innerHTML=s+`</svg>`;}

/* ---- encert i error ---- */
function win(msg){done=true;const p=tries===0?2:1;
  sfx('ding');setTimeout(()=>award(p),250);
  const f=FRUITS[FS.sel];
  say((tries===0?rnd(['Bip-bip! ','','Circuits feliços! ']):'Ara sí! ')+msg+` <b>+${p} per a ${f.e}</b>`,'happy','jump');nextBtn();}
function fail(msg,reveal,soundDone){tries++;if(!soundDone)sfx('ohoh');
  if(tries>=2){done=true;reveal();setTimeout(()=>sfx('sad'),500);
    say(`Error als meus circuits… i als vostres! Mireu la solució a sota. La propera la clavem!`,'oops','shake');nextBtn();}
  else say('Oh-oh… '+msg+' <b>Torneu-ho a provar!</b>','oops','shake');}

/* ================= FINAL ================= */
function finale(){AIDTOK++;$('#scrGame').classList.add('hide');const e=$('#scrEnd');e.classList.remove('hide');
  const order=FRUITS.map((f,i)=>({...f,s:FS.sc[i]})).sort((a,b)=>b.s-a.s);const med=['🥇','🥈','🥉'];
  e.innerHTML=`<div class="robot">${robotSVG('happy')}</div><h2 class="disp">Classificació</h2>
    <ol class="rank">${order.map((f,i)=>`<li class="${i===0&&f.s>0?'top':''}"><span class="m">${f.s>0&&i<3?med[i]:''}</span><span class="e">${f.e}</span><span class="nm">${f.n}</span><span class="pt">${f.s}</span></li>`).join('')}</ol>
    <p class="result">Recordeu: ${F(7,4)} = ${F(4,4)} + ${F(3,4)} = ${mixedHTML(7,4)}</p>
    <div class="foot"><button class="btn primary" id="bAgain">Tornar a l'inici</button></div>
    <div class="sig">Matemàtiques · Ins Júlia Minguell, Badalona · Fet amb IA</div>`;
  $('#bAgain').onclick=()=>{e.classList.add('hide');$('#scrCover').classList.remove('hide');renderFruits();window.scrollTo(0,0);};
  sfx('fanfare');confetti();}
function confetti(){const c=$('#confetti');if(!c.getContext||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=c.getContext('2d');if(!x)return;
  c.width=innerWidth;c.height=innerHeight;const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:Math.random()*6.3,s:6+Math.random()*8,col:rnd(['#ff6a00','#000','#ffb27a','#ffffff'])}));
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.save();x.translate(p.x+Math.sin(p.r)*10,p.y);x.rotate(p.r);x.fillStyle=p.col;x.strokeStyle='#000';x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<260)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();}

/* ================= INICI ================= */
function start(){idx=0;$('#scrCover').classList.add('hide');$('#scrGame').classList.remove('hide');renderFruits();ac();sfx('level');load(true);window.scrollTo(0,0);}
function fs(){const d=document;try{if(!d.fullscreenElement)d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();else d.exitFullscreen&&d.exitFullscreen();}catch(e){}}
$('#coverRob').innerHTML=robotSVG('wave');renderFruits();
$('#bGo').onclick=()=>{start();const f=FRUITS[FS.sel];say(`Hola, classe! Sóc en FR-4C. Avui mirem fraccions <b>més grans que 1</b>. Comença <b>${f.e} ${f.n}</b>: quina fracció hi ha pintada?`,'wave','jump');};
$('#bTest').onclick=()=>{SND=true;ac();sfx('ding');setTimeout(()=>sfx('ohoh'),600);};
$('#bFs1').onclick=fs;$('#bFs').onclick=fs;
$('#bSnd').onclick=()=>{SND=!SND;$('#bSnd').textContent=SND?'🔊':'🔇';$('#bSnd').setAttribute('aria-pressed',SND);};
document.addEventListener('keydown',e=>{if((e.key==='ArrowRight'||e.key==='Enter')&&$('#bNext')&&!$('#scrGame').classList.contains('hide')&&document.activeElement!==$('#bNext')){e.preventDefault();$('#bNext').click();}});
<\/script>
