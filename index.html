<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR-4C · Matemàtiques 4t ESO</title>
<style>
:root{
  --tinta:#1b1b1b; --paper:#ffffff; --suau:#f5f3ef; --linia:#dcd8d0; --gris:#8f8a82;
  --taronja:#f26b1d; --taronja-suau:#fde6d6; --taronja-fosc:#c9520f;
  --ok:#2c9a58; --ok-suau:#dcf2e4; --ko:#d64242; --ko-suau:#fbe1e1;
  --groc:#e2a90b; --groc-suau:#fff3cc;
  --radi:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--tinta);font-size:clamp(15px,1.3vw,20px);line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:700}
.ocult{display:none!important}

/* ---------- capçalera ---------- */
#cap{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:2px solid var(--tinta);background:var(--paper);position:relative;z-index:20}
#btn-profe{width:30px;height:30px;opacity:.35;transition:opacity .2s;display:grid;place-items:center;border-radius:8px}
#btn-profe:hover{opacity:.8}
.marca{font-weight:800;letter-spacing:.04em;font-size:1.05rem}
.marca span{color:var(--taronja)}
#cap-context{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gris);font-size:.95rem}
#cap-context b{color:var(--tinta)}
.eines{display:flex;gap:6px;align-items:center}
.eina{height:38px;min-width:38px;padding:0 8px;border-radius:10px;border:2px solid var(--linia);display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;background:var(--paper)}
.eina:hover,.eina.activa{border-color:var(--tinta)}
.eina.activa{background:var(--suau)}
.eina svg{width:20px;height:20px}
.eina.silenci{color:var(--ko);border-color:var(--ko)}
#conn{width:10px;height:10px;border-radius:50%;background:var(--linia)}
#conn.on{background:var(--ok)}
#cap-alumne{display:flex;align-items:center;gap:8px;font-weight:700}
.boto-petit{padding:6px 12px;border-radius:10px;border:2px solid var(--tinta);font-weight:700;font-size:.85rem;background:var(--paper)}
.boto-petit:hover{background:var(--suau)}

/* ---------- vista ---------- */
#vista{height:calc(100% - 56px);overflow:auto;position:relative}
.pantalla{min-height:100%;padding:18px 28px;display:flex;flex-direction:column}
.centrat{align-items:center;justify-content:center;text-align:center}

.boto{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:12px;background:var(--tinta);color:var(--paper);font-weight:800;font-size:1.05rem;border:2px solid var(--tinta);transition:transform .1s}
.boto:hover{transform:translateY(-1px)}
.boto:active{transform:translateY(1px)}
.boto.taronja{background:var(--taronja);border-color:var(--taronja)}
.boto.sec{background:var(--paper);color:var(--tinta)}
.boto:disabled{opacity:.4;cursor:default;transform:none}
.enllac{color:var(--gris);text-decoration:underline;font-size:.9rem}

/* ---------- robot ---------- */
.robot{display:block;overflow:visible}
.robot .cos{animation:sura 3.2s ease-in-out infinite}
.robot .ulls{transform-origin:70px 66px;animation:parpella 4.5s infinite}
.robot .antena{transform-origin:70px 34px;animation:antena 2.4s ease-in-out infinite}
.robot.saluda .brac{transform-origin:92px 128px;animation:saluda 1.8s ease-in-out infinite}
@keyframes saluda{0%,60%,100%{transform:rotate(0)}15%,45%{transform:rotate(-14deg)}30%{transform:rotate(8deg)}}
@keyframes sura{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes parpella{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* FR-4C de la portada: moviments a l'atzar */
.rob-portada{position:relative;cursor:pointer;display:inline-block;-webkit-tap-highlight-color:transparent}
.rob-portada>svg{transform-origin:50% 60%}
.rob-portada .fx{position:absolute;pointer-events:none;font-weight:900;color:#f26b1d;font-size:1.6rem;animation:fxpuja 1.4s ease-out forwards}
@keyframes fxpuja{0%{opacity:0;transform:translate(0,10px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-60px) scale(1.2)}}
.rob-portada.m-saluda .brac{transform-origin:92px 128px;animation:saluda 1s ease-in-out 3}
.rob-portada.m-gir>svg{animation:fxgir 1.3s cubic-bezier(.4,0,.3,1)}
@keyframes fxgir{0%{transform:rotate(0)}80%{transform:rotate(375deg)}90%{transform:rotate(355deg)}100%{transform:rotate(360deg)}}
.rob-portada.m-tomb>svg{animation:fxtomb 1.2s ease-in-out}
@keyframes fxtomb{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(8px) scaleY(.9)}55%{transform:translateY(-70px) rotate(-200deg)}80%{transform:translateY(0) rotate(-360deg)}88%{transform:translateY(0) rotate(-360deg) scaleY(.88)}100%{transform:rotate(-360deg)}}
.rob-portada.m-antena .antena circle{animation:fxllum .5s ease-in-out 3}
@keyframes fxllum{0%,100%{fill:#f26b1d;filter:none}50%{fill:#fff6b0;filter:drop-shadow(0 0 10px #ff8a1d) drop-shadow(0 0 4px #ffd400)}}
.rob-portada.m-antena .antena{animation:none}
.rob-portada.m-ullet .ulls{animation:fxparp .9s}
.rob-portada.m-ullet .ulls>:nth-child(2){transform-box:fill-box;transform-origin:center;animation:fxullet 1.8s .9s}
@keyframes fxparp{0%,20%,40%,100%{transform:scaleY(1)}10%,30%{transform:scaleY(.1)}}
@keyframes fxullet{0%,100%{transform:scaleY(1)}20%,70%{transform:scaleY(.12)}}
.rob-portada.m-mira .ulls{animation:fxmira 2.6s ease-in-out}
@keyframes fxmira{0%,100%{transform:translateX(0)}20%,75%{transform:translate(7px,3px)}}
.rob-portada.m-pensa .ulls{animation:fxmira2 2.4s ease-in-out}
@keyframes fxmira2{0%,100%{transform:translate(0)}20%,80%{transform:translate(-4px,-5px)}}
.rob-portada.m-ball>svg{animation:fxball .5s ease-in-out 5 alternate}
@keyframes fxball{from{transform:rotate(-9deg) translateX(-6px)}to{transform:rotate(9deg) translateX(6px) translateY(-6px)}}
.rob-portada.m-salt>svg{animation:fxsalt .7s ease-out}
.rob-portada.m-salt .brac{transform-origin:92px 128px;animation:fxbrac .7s ease-out}
@keyframes fxsalt{0%,100%{transform:translateY(0)}15%{transform:translateY(6px) scaleY(.92)}50%{transform:translateY(-34px)}}
@keyframes fxbrac{50%{transform:rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){.rob-portada *,.rob-portada>svg{animation:none!important}}
@keyframes antena{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.bafarada{position:relative;background:var(--paper);border:2px solid var(--tinta);border-radius:16px;padding:12px 16px;font-weight:600;max-width:360px;text-align:left}
.bafarada::before{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:var(--tinta);border-left:0}
.bafarada::after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:var(--paper);border-left:0}

/* ---------- portada ---------- */
.portada{display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:40px;max-width:1050px;margin:auto;width:100%}
.portada h1{font-size:3.2rem;line-height:1.05;letter-spacing:-.02em}
.portada h1 span{color:var(--taronja)}
.portada p.sub{font-size:1.2rem;color:var(--gris);margin:12px 0 28px}
.portada h1.titol-portada{font-size:2.9rem}
.portada p.portada-sub{font-size:1.35rem;line-height:1.4}
.portada p.portada-sub b{color:var(--tinta)}
.formulari{display:flex;flex-direction:column;gap:14px;max-width:380px}
.formulari label{font-weight:700;font-size:.95rem}
.camp{width:100%;padding:12px 14px;border:2px solid var(--tinta);border-radius:12px;background:var(--paper);font-size:1.1rem}
.camp:focus{outline:3px solid var(--taronja-suau);border-color:var(--taronja)}
.missatge-error{color:var(--ko);font-weight:700;min-height:1.4em}
@keyframes tremola{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tremola{animation:tremola .25s 2}

/* ---------- mapa ---------- */
.mapa-cap{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.mapa-cap h2{font-size:1.7rem}
.barra-prog{height:14px;border-radius:7px;background:var(--suau);border:2px solid var(--tinta);overflow:hidden;width:260px}
.barra-prog i{display:block;height:100%;background:var(--ok);transition:width .5s}
.graella{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.targeta{border:2px solid var(--linia);border-radius:var(--radi);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--paper);transition:transform .15s,box-shadow .15s;position:relative}
.targeta .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid currentColor}
.targeta h3{font-size:1.05rem;line-height:1.25}
.targeta .estat{margin-top:auto;font-size:.85rem;font-weight:700}
.targeta.disponible{border-color:var(--taronja);cursor:pointer;box-shadow:0 4px 0 var(--taronja)}
.targeta.disponible:hover{transform:translateY(-3px)}
.targeta.disponible .num{color:var(--taronja)}
.targeta.disponible .estat{color:var(--taronja-fosc)}
.targeta.assolit{border-color:var(--ok);background:var(--ok-suau);cursor:pointer}
.targeta.assolit .num{color:var(--ok);background:var(--paper)}
.targeta.assolit .estat{color:var(--ok)}
.targeta.bloquejat,.targeta.construccio,.targeta.tancat{color:var(--gris);background:var(--suau)}.targeta.tancat{border-style:dashed;border-color:var(--taronja)}.targeta.tancat .estat{color:var(--taronja);font-weight:800}
.targeta.construccio{border-style:dashed}

/* ---------- objectiu ---------- */
.obj-cap{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.obj-cap h2{font-size:1.3rem;flex:1}
.punts{display:flex;gap:6px}
.punts i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tinta);background:var(--paper)}
.punts i.ara{background:var(--taronja);border-color:var(--taronja)}
.punts i.ok{background:var(--ok);border-color:var(--ok)}
.punts i.ko{background:var(--ko);border-color:var(--ko)}

.joc{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;flex:1;min-height:0}
.costat{border:2px solid var(--tinta);border-radius:var(--radi);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.costat.pregunta{background:var(--paper)}
.costat.respostes{background:var(--suau)}
.etiqueta{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.enunciat{font-size:1.35rem;font-weight:600;line-height:1.35}
.visual{display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;flex:1;min-height:140px}
.visual svg.dib{max-width:100%;max-height:230px}
.pista{display:flex;gap:12px;align-items:flex-start;background:var(--groc-suau);border:2px solid var(--groc);border-radius:12px;padding:10px 14px;font-size:1rem}
.pista .ico{font-size:1.4rem;line-height:1}

.opcions{display:flex;flex-direction:column;gap:10px}
.opcio{border:2px solid var(--tinta);border-radius:12px;background:var(--paper);padding:8px 16px;font-size:1.15rem;font-weight:700;text-align:left;display:flex;align-items:center;gap:14px;min-height:54px}
.opcio .fr.mitja{font-size:1.3em}
.opcio:hover:not(:disabled){background:var(--taronja-suau)}
.opcio .lletra{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--tinta);display:grid;place-items:center;font-size:.9rem}
.opcio.triada{background:var(--taronja-suau);border-color:var(--taronja)}
.opcio.correcta{background:var(--ok-suau);border-color:var(--ok)}
.opcio.erronia{background:var(--ko-suau);border-color:var(--ko)}
.opcio:disabled{cursor:default}
.opcions.fila{flex-direction:row}
.opcions.fila .opcio{flex:1;justify-content:center;font-size:1.4rem}

.entrada-frac{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto}
.entrada-frac input{width:120px;text-align:center;font-size:2.2rem;font-weight:800;padding:6px;border:2px solid var(--tinta);border-radius:12px;background:var(--paper)}
.entrada-frac .ratlla{width:150px;height:5px;background:var(--tinta);border-radius:3px}
.entrada-num{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto;font-size:1.4rem;font-weight:700}
.entrada-num input{width:160px;text-align:center;font-size:2.2rem;font-weight:800;padding:6px;border:2px solid var(--tinta);border-radius:12px}
input:focus{outline:3px solid var(--taronja-suau);border-color:var(--taronja)}
input:disabled{background:var(--suau)}

.retorn{border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;animation:apareix .3s both}
.retorn.ok{background:var(--ok-suau);border:2px solid var(--ok)}
.mix{display:inline-flex;align-items:center;font-weight:800;vertical-align:middle;margin:0 .15em}
.mix .mix-e{font-size:1.85em;line-height:1;margin-right:.08em}
.mix .fr{margin:0}
.mix.mitja{font-size:1.5em}.mix.gran{font-size:2.6em}
.opcio .mix.mitja{font-size:1.3em}
.entrada-mixt{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px auto}
.entrada-mixt input.ent{width:96px;height:96px;text-align:center;font-size:3rem;font-weight:800;border:2px solid var(--tinta);border-radius:12px}
.entrada-mixt .entrada-frac{margin:0}
.divisio{display:inline-grid;grid-template-columns:auto auto;font-size:2.2rem;font-weight:800;line-height:1.3}
.divisio span{padding:0 14px}
.divisio .dd{border-left:4px solid var(--tinta);border-bottom:4px solid var(--tinta)}
.divisio .q{border-left:4px solid var(--tinta);color:var(--taronja)}
.divisio .r{color:var(--taronja)}
.recta-zona{cursor:pointer}
.apartats{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.ap{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--linia);border-radius:12px;padding:8px 12px;background:var(--paper)}
.ap.ok{border-color:var(--ok);background:var(--ok-suau)}.ap.ko{border-color:var(--ko);background:#fdecec}
.ap-l{font-weight:900;color:var(--gris);min-width:22px;padding-top:6px}
.ap-cos{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ap-num .enter-gran{font-size:1.6rem}
.ap-signes{display:flex;gap:6px}
.ap-cicle{width:62px;height:52px;border-radius:10px;border:3px solid var(--taronja);background:#fff;font-size:1.9rem;font-weight:900;cursor:pointer;line-height:1;flex:none}.ap-cicle i{font-style:normal;color:var(--taronja);font-size:1.5rem;opacity:.8}.ap-cicle:not(:disabled):hover{background:#fff3ea}.ap-cicle.ple{border-color:var(--tinta);background:#fff}.ap-cicle:focus-visible{outline:3px solid var(--taronja);outline-offset:2px}.ap-cicle:disabled{cursor:default}
.ap-signes button,.ap-ops button{min-width:48px;height:44px;border-radius:10px;border:2px solid var(--tinta);background:#fff;font-size:1.35rem;font-weight:900;padding:0 10px}
.ap-ops{display:flex;gap:6px;flex-wrap:wrap}.ap-ops button{font-size:1.05rem;font-weight:800}
.ap-signes button.triat,.ap-ops button.triat,.ap-ord-pool button.triat{background:var(--tinta);color:#fff!important}
.ap-expr{font-size:1.35rem;font-weight:800;white-space:nowrap}
.ap-ent{display:flex;align-items:center;gap:6px}.ap-ent .signes{display:flex;gap:4px}
.ap-ent .signes button{width:40px;height:40px;border-radius:9px;border:2px solid var(--tinta);font-size:1.4rem;font-weight:900;background:#fff;line-height:1}
.ap-ent .signes button.activa{background:var(--tinta);color:#fff}
.ap-ent input{width:76px;height:44px;border:2px solid var(--tinta);border-radius:10px;font-size:1.4rem;font-weight:800;text-align:center}
.ap-text{font-size:1.05rem;font-weight:600;flex:1 1 260px;line-height:1.35}
.comp-sims{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:2rem;font-weight:900}.comp-sims span{color:var(--tinta);margin:0 10px}
.regla-s{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:1.4rem;font-weight:700;background:#fff;border:2px solid var(--linia);border-radius:14px;padding:16px 26px}.regla-s .res{font-size:2.6rem;font-weight:900}
.taula-signes{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;font-size:1.6rem;font-weight:700;background:#fff;border:2px solid var(--linia);border-radius:14px;padding:18px 28px}
.ap-uni{font-weight:700;color:var(--gris)}
.ap-ord{width:100%}.ap-ord-cap{font-weight:700;margin-bottom:6px}
.ap-ord-fila{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:48px}
.ap-ord-fila i{font-style:normal;font-weight:900;color:var(--gris)}
.ap-ord-fila .buit{width:54px;height:42px;border:2px dashed var(--linia);border-radius:10px;display:inline-block}
.ap-ord-fila button,.ap-ord-pool button,.ap-ord-pool .usat{min-width:54px;height:42px;border-radius:10px;border:2px solid var(--tinta);background:#fff;font-size:1.2rem;font-weight:900;padding:0 8px}
.ap-ord-pool{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ap-ord-pool .usat{display:inline-flex;align-items:center;justify-content:center;opacity:.25;border-style:dashed}
.ap-bona{width:100%;font-size:.95rem;color:#1d6b3f;font-weight:700}
.ap-buit{display:inline-block;min-width:34px;text-align:center;border-bottom:3px solid var(--tinta);font-weight:900}
.ap-corr-llista{display:inline-flex;flex-direction:column;gap:2px}
.previ-nav{display:flex;align-items:center;gap:6px;margin-left:10px}.previ-nav b{min-width:34px;text-align:center}
#banda-previ{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:90;background:#7c5cd6;color:#fff;border-radius:999px;padding:6px 8px 6px 16px;font-size:.9rem;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#banda-previ button{border:0;background:#fff;color:#5a3fb0;border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
.retorn.previ{background:#f2edfd;border:2px solid #7c5cd6}.previ-sol{margin:4px 0 4px 18px;padding:0}
.ronda-demo{display:flex;flex-direction:column;gap:14px}
.rd-ex{border:2px solid var(--linia);border-radius:14px;background:var(--paper);overflow:hidden}
.rd-cap{display:flex;gap:10px;align-items:center;background:#f4f2ee;padding:6px 12px;font-size:.85rem;color:var(--gris)}
.rd-cap b{background:var(--tinta);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.rd-pista{margin-left:auto;color:#8a6d00;font-weight:700}
.rd-cos{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;padding:12px}
.rd-preg .visual{margin:8px 0}.rd-preg .visual svg{max-width:100%;height:auto}
.rd-sol{border-left:2px dashed var(--linia);padding-left:12px;font-size:.95rem}.rd-sol ol{margin:4px 0 0 18px;padding:0}
.punts i.salt{background:#cfcac2;border-color:#cfcac2}
#rectaz-int{width:100%;max-width:560px;display:block;margin:0 auto;touch-action:manipulation}
.ovelles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ovelles .ov{display:flex;flex-direction:column;align-items:center;gap:4px}.ovelles .ov span{font-size:3rem;line-height:1}.ovelles .ov b{font-size:1.6rem;color:var(--taronja)}
.ovelles .ov.buit span{opacity:.6}
.conj-txt{text-align:center;font-size:1.35rem;font-weight:800;margin-top:10px;letter-spacing:.02em}
.lletra-conj{font-size:1.7rem;font-weight:900;font-family:'Cambria Math','STIX Two Math','Times New Roman',serif}
.xips-z{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.xips-z span{border:2px solid var(--linia);border-radius:12px;padding:6px 14px;font-size:1.5rem;font-weight:900;background:#fff;min-width:54px;text-align:center}
#recta-int{width:100%;max-width:530px;display:block;margin:0 auto;touch-action:manipulation}
.transf{display:flex;align-items:center;gap:14px}

// ---------- CONFIGURACIÓ ----------

};

// ---------- UTILITATS ----------

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const tria = arr => arr[Math.floor(Math.random() * arr.length)];
const barreja = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const mcd = (a, b) => b ? mcd(b, a % b) : Math.abs(a);
const nouId = () => [...crypto.getRandomValues(new Uint8Array(8))].map(b => b.toString(16).padStart(2, '0')).join('');
const frac = (n, d, cls = '') => `<span class="fr ${cls}"><span>${n}</span><span>${d}</span></span>`;
const ftxt = (n, d) => `${n}/${d}`;
const nouCodi = () => String(rnd(1000, 9999));
const dataCurta = t => { const d = new Date(t); return d.toLocaleDateString('ca-ES', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' }); };
const ordenaNoms = (a, b) => (a[1].nom || '').localeCompare(b[1].nom || '', 'ca');

// ---------- BASE DE DADES ----------
let DB = null;
async function connectaFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const [appM, authM, dbM] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-database.js`)
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  try { await auth.authStateReady(); } catch (e) { await new Promise(r => { const u = authM.onAuthStateChanged(auth, () => { u(); r(); }); }); }
  if (!auth.currentUser) await authM.signInAnonymously(auth);
  const db = dbM.getDatabase(app);
  const r = p => dbM.ref(db, p);
  return {
    local: false,
    on: (p, cb) => dbM.onValue(r(p), s => cb(s.val())),
    set: (p, v) => vigila(dbM.set(r(p), v), p),
    update: (p, o) => vigila(dbM.update(r(p), o), p),
    push: async (p, v) => { const k = dbM.push(r(p)); await vigila(dbM.set(k, v), p); return k.key; },
    remove: p => vigila(dbM.remove(r(p)), p),
    get: p => dbM.get(r(p)).then(s => s.val()),

    esProfe: () => !!auth.currentUser && auth.currentUser.uid === UID_PROFE,
    entraProfe: async (usuari, pw) => {
      const u = usuari.trim(); const correu = u.includes('@') ? u : `${u}@${DOMINI_PROFE}`;
      const cred = await authM.signInWithEmailAndPassword(auth, correu, pw);
      if (cred.user.uid !== UID_PROFE) { await authM.signOut(auth); location.reload(); throw { code: 'fr4c/no-profe' }; }
    },
    surtProfe: async () => { await authM.signOut(auth); location.reload(); }
  };
}
function connectaLocal() {
  const CLAU = 'fr4c_objectius_local';
  let arbre = {};
  try { arbre = JSON.parse(localStorage.getItem(CLAU)) || {}; } catch (e) { }
  const oients = new Set();
  const trossos = p => p.split('/').filter(Boolean);
  const copia = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const llegeix = p => trossos(p).reduce((o, k) => (o == null ? null : (o[k] ?? null)), arbre);
  const escriu = (p, v) => {
    const ks = trossos(p); let o = arbre;
    for (const k of ks.slice(0, -1)) { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }
    const u = ks[ks.length - 1];
    if (v == null) delete o[u]; else o[u] = copia(v);
  };
  const avisa = () => {
    try { localStorage.setItem(CLAU, JSON.stringify(arbre)); } catch (e) { }
    for (const l of oients) l.cb(copia(llegeix(l.p)));
  };
  return {
    local: true,
    on: (p, cb) => { const l = { p, cb }; oients.add(l); setTimeout(() => cb(copia(llegeix(p)))); return () => oients.delete(l); },
    set: async (p, v) => { escriu(p, v); avisa(); },
    update: async (p, o) => { for (const [k, v] of Object.entries(o)) escriu(p + '/' + k, v); avisa(); },
    push: async (p, v) => { const k = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); escriu(p + '/' + k, v); avisa(); return k; },
    remove: async p => { escriu(p, null); avisa(); },
    get: async p => copia(llegeix(p)),
    onConn: cb => cb(true),
    esProfe: () => false
  };
}

// Avís visible quan Firebase rebutja una escriptura (normalment, regles desactualitzades)
function vigila(promesa, p) {
  return promesa.catch(e => {
    console.error('Firebase ha rebutjat', p, e);
    const perm = /permission|denied/i.test(String(e?.code || e?.message || e));
    let el = document.getElementById('avis-db');
    if (!el) { el = document.createElement('div'); el.id = 'avis-db'; document.body.appendChild(el); }
    el.innerHTML = `<b>⚠ No s'ha pogut desar.</b> ${perm ? `Firebase ha rebutjat el canvi (<code>${String(p).replace(/^objectius\//, '')}</code>). Segurament cal actualitzar les <b>regles</b> de Firebase.` : 'Comprova la connexió a internet.'} <button onclick="this.parentNode.remove()">✕</button>`;
    clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 15000);
    throw e;
  });
}

// ---------- ESTAT ----------
const S = {

function generaRonda(o, nivell, evitar = []) {
  const tema = TEMES[o]; const ev = new Set(evitar || []); const usats = new Set(); const out = [];
  for (const [tipus, opts] of tema.sequencia[nivell]) {
    let ex = null;
    for (let k = 0; k < 60; k++) {
      const c = tema.gen[tipus](nivell, opts || {});
      if (usats.has(c.sig)) continue;
      ex = c; if (!ev.has(c.sig)) break;
    }
    if (!ex) ex = tema.gen[tipus](nivell, opts || {});
    usats.add(ex.sig); ex.tipus = ex.tipus || tipus;
    if (tema.signeEscrit) { // a partir de l'objectiu 5 el signe s'escriu, sense botons
      if (ex.resposta?.mode === 'enter') ex.resposta.escrit = true;
      if (ex.resposta?.mode === 'apartats') ex.resposta.items.forEach(it => { if (it.tipus === 'enter') it.escrit = true; });
    }
    out.push(ex);
  }
  return out;
}

  if (ex.pistaSempre) return 'completa';
  if (nv === 1) return i === 0 ? 'completa' : i === 1 ? 'mitja' : null;
  if (nv === 2) return i === 0 ? 'completa' : null;
  return null;
}

// ---------- FR-4C de la portada: moviments a l'atzar ----------
const MOVS_PORTADA = ['saluda', 'gir', 'tomb', 'antena', 'ullet', 'mira', 'pensa', 'ball', 'salt'];
const DURADA_MOV = { saluda: 3100, gir: 1400, tomb: 1300, antena: 1600, ullet: 2800, mira: 2700, pensa: 2500, ball: 2600, salt: 800 };
let tPortada = null, movAnterior = null, movOcupat = false;
function fxPortada(w, txts, n, x0, y0) {
  for (let i = 0; i < n; i++) setTimeout(() => {
    if (!w.isConnected) return;
    const e = document.createElement('span'); e.className = 'fx'; e.textContent = txts[i % txts.length];
    e.style.left = (x0 + (Math.random() * 60 - 30)) + 'px'; e.style.top = (y0 + Math.random() * 20) + 'px'; e.style.setProperty('--dx', (Math.random() * 50 - 25) + 'px');
    w.appendChild(e); setTimeout(() => e.remove(), 1500);
  }, i * 280);
}
function movPortada(forçat) {
  const w = $('#rob-portada'); if (!w || movOcupat) return;
  const mou = MOVS_PORTADA.filter(m => m !== movAnterior); const m = forçat || tria(mou); movAnterior = m; movOcupat = true;
  const svg = w.querySelector('svg'); svg.classList.remove('saluda');
  w.classList.add('m-' + m);
  if (m === 'pensa') fxPortada(w, ['•', '•', '•'], 3, 150, 0);
  if (m === 'ball') fxPortada(w, ['♪', '♫', '♪', '♫'], 4, 100, 10);
  if (m === 'salt') fxPortada(w, ['✦', '★', '✦', '★', '✦'], 5, 95, 40);
  setTimeout(() => { w.classList.remove('m-' + m); movOcupat = false; }, DURADA_MOV[m]);
}
function animaPortada() {
  clearTimeout(tPortada);
  const w = $('#rob-portada'); if (!w) return;
  const quiet = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = w.querySelector('svg');
  setTimeout(() => svg.classList.remove('saluda'), 3600);
  w.onclick = () => { if (movOcupat) return; so('pas'); movPortada(); };
  if (quiet) return;
  const prog = () => { tPortada = setTimeout(() => { if (!$('#rob-portada')) return; movPortada(); prog(); }, 6000 + Math.random() * 4000); };
  prog();
}
// pantalla completa (tota l'app)
function esPantallaCompleta() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function commutaPantallaCompleta() {
  const d = document, el = d.documentElement;
  const avisa = () => { const m = obreModal(`<h3>Pantalla completa</h3><p>Aquest navegador no deixa posar l'app a pantalla completa des d'aquí (passa sovint dins el Google Sites).</p><p>Pots obrir-la en una pestanya nova i fer-hi pantalla completa, o prémer <b>F11</b>.</p><div class="accions"><button class="boto sec" data-tanca-modal>D'acord</button><button class="boto taronja" id="fs-nova">Obre en una pestanya nova</button></div>`); $('#fs-nova', m).onclick = () => { window.open(location.href, '_blank'); tancaModal(); }; };
  try {
    if (esPantallaCompleta()) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || d.fullscreenEnabled === false) return avisa();
    const r = req.call(el); if (r && r.catch) r.catch(avisa);
  } catch (e) { avisa(); }
}
function pintaBotoFs() {

}

// calculadora
function calcula(expr) {
  const s = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s/g, '').replace(/,/g, '.');
  if (!/^[\d.+\-*/()]+$/.test(s)) throw new Error('x');
  let i = 0;
  const num = () => { const m = s.slice(i).match(/^\d*\.?\d+/); if (!m) throw new Error('x'); i += m[0].length; return parseFloat(m[0]); };
  const fac = () => { if (s[i] === '-') { i++; return -fac(); } if (s[i] === '(') { i++; const v = exp(); if (s[i] !== ')') throw new Error('x'); i++; return v; } return num(); };
  const ter = () => { let v = fac(); while (s[i] === '*' || s[i] === '/') { const o = s[i++]; const w = fac(); v = o === '*' ? v * w : v / w; } return v; };
  const exp = () => { let v = ter(); while (s[i] === '+' || s[i] === '-') { const o = s[i++]; const w = ter(); v = o === '+' ? v + w : v - w; } return v; };
  const v = exp(); if (i !== s.length || !isFinite(v)) throw new Error('x'); return +v.toFixed(10);
}
let calcExpr = '';
const tecles = ['C', '(', ')', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '0', ',', '⌫', '='];
$('#calc-tecles').innerHTML = tecles.map(t => `<button class="${'÷×−+()'.includes(t) ? 'op' : ''} ${t === '=' ? 'igual' : ''}" data-t="${t}">${t}</button>`).join('');
const pintaCalc = () => { $('#calc-disp').textContent = calcExpr || '0'; };
function premTecla(t) {
  if (t === 'C') { calcExpr = ''; $('#calc-hist').textContent = ''; }
  else if (t === '⌫') calcExpr = calcExpr.slice(0, -1);
  else if (t === '=') { try { const v = calcula(calcExpr); $('#calc-hist').textContent = calcExpr + ' ='; calcExpr = String(v).replace('.', ','); } catch (e) { $('#calc-hist').textContent = 'Error'; } }
  else calcExpr += t;
  pintaCalc();
}
$$('#calc-tecles button').forEach(b => b.onclick = () => premTecla(b.dataset.t));
document.addEventListener('keydown', e => {
  if ($('#f-calc').classList.contains('ocult') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  const m = { '*': '×', '/': '÷', '-': '−', '+': '+', 'Enter': '=', 'Backspace': '⌫', 'Escape': 'C', '.': ',', ',': ',', '(': '(', ')': ')' };
  if (/^\d$/.test(e.key)) premTecla(e.key); else if (m[e.key] && !(e.key === 'Enter' && S.vista === 'objectiu')) { premTecla(m[e.key]); }
});
// esborrany
const cv = $('#esb-canvas'); const ctx = cv.getContext('2d');
let esbColor = '#1b1b1b', esbGoma = false, dibuixant = false, ultim = null, imatge = null;
function ajustaCanvas() {
  const r = cv.getBoundingClientRect(); if (!r.width) return;
  const dpr = window.devicePixelRatio || 1;
  const prev = cv.width ? cv.toDataURL() : null;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (prev) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, r.width, r.height); img.src = prev; }
}
const posPunter = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => { dibuixant = true; ultim = posPunter(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!dibuixant) return; const p = posPunter(e);
  ctx.globalCompositeOperation = esbGoma ? 'destination-out' : 'source-over';
  ctx.strokeStyle = esbColor; ctx.lineWidth = esbGoma ? 26 : 3.5;
  ctx.beginPath(); ctx.moveTo(...ultim); ctx.lineTo(...p); ctx.stroke(); ultim = p;
});
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { dibuixant = false; }));
$$('.esb-eines [data-color], .esb-eines [data-goma]').forEach(b => b.onclick = () => {

$('#esb-net').onclick = () => { const r = cv.getBoundingClientRect(); ctx.clearRect(0, 0, r.width, r.height); };
$('#esb-gran').onclick = () => { const f = $('#f-esb'); f.classList.toggle('gran'); f.style.left = '2vw'; f.style.top = '64px'; f.style.right = 'auto'; ajustaCanvas(); };
// temporitzador
let tTotal = 300, tResta = 300, tInterval = null;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function pintaTemps() {
  const d = $('#temps-disp'); d.textContent = mmss(tResta); d.classList.toggle('acabat', tResta === 0 && tTotal > 0);
  $('#temps-go').textContent = tInterval ? 'Pausa' : 'Inicia';
  $('#e-temps-txt').textContent = (tInterval || (tResta < tTotal && tResta > 0)) ? mmss(tResta) : (tResta === 0 ? '00:00' : '');
}
function sona() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .3); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3); }); } catch (e) { }
}
function paraTemps() { clearInterval(tInterval); tInterval = null; }
$$('[data-min]').forEach(b => b.onclick = () => { paraTemps(); tTotal = tResta = Number(b.dataset.min) * 60; pintaTemps(); });
$$('[data-mes]').forEach(b => b.onclick = () => { const v = Number(b.dataset.mes) * 60; tResta = Math.max(0, tResta + v); tTotal = Math.max(tResta, tTotal + v, 0); pintaTemps(); });
$('#temps-go').onclick = () => {
  if (tInterval) { paraTemps(); pintaTemps(); return; }
  if (tResta === 0) tResta = tTotal;
  tInterval = setInterval(() => { tResta = Math.max(0, tResta - 1); if (tResta === 0) { paraTemps(); sona(); } pintaTemps(); }, 1000);
  pintaTemps();
};
$('#temps-reset').onclick = () => { paraTemps(); tResta = tTotal; pintaTemps(); };
$('#temps-gran').onclick = () => { const f = $('#f-temps'); f.classList.toggle('gran'); f.style.left = '50%'; f.style.top = '80px'; f.style.right = 'auto'; f.style.transform = f.classList.contains('gran') ? 'translateX(-50%)' : ''; if (!f.classList.contains('gran')) { f.style.left = 'auto'; f.style.right = '320px'; } };
pintaTemps();

  if (DB.local && !$('.avis-local')) document.body.insertAdjacentHTML('beforeend', `<div class="avis-local">Mode de prova · no es desa res a Firebase</div>`);
  DB.onConn(on => $('#conn').classList.toggle('on', on));

    if (S.vista === 'mapa' || S.vista === 'portada') render();

    refrescaPanell();

    else if (S.vista === 'mapa') render();

}
(async function inicia() {

    window.__A = () => A; window.__RE = () => RE; return arrenca();

})();
