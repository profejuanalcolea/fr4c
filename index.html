<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FR-4C · Matemàtiques 4t ESO</title>
<style>
:root{
  --tinta:#1b1b1b; --paper:#ffffff; --suau:#f5f3ef; --linia:#dcd8d0; --gris:#8f8a82;
  --taronja:#f26b1d; --taronja-suau:#fde6d6; --taronja-fosc:#c9520f;
  --ok:#2c9a58; --ok-suau:#dcf2e4; --ko:#d64242; --ko-suau:#fbe1e1;
  --groc:#e2a90b; --groc-suau:#fff3cc;
  --radi:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--paper);color:var(--tinta);font-size:clamp(15px,1.3vw,20px);line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:700}
.ocult{display:none!important}

/* ---------- capçalera ---------- */
#cap{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:2px solid var(--tinta);background:var(--paper);position:relative;z-index:20}
#btn-profe{width:30px;height:30px;opacity:.35;transition:opacity .2s;display:grid;place-items:center;border-radius:8px}
#btn-profe:hover{opacity:.8}
.marca{font-weight:800;letter-spacing:.04em;font-size:1.05rem}
.marca span{color:var(--taronja)}
#cap-context{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gris);font-size:.95rem}
#cap-context b{color:var(--tinta)}
.eines{display:flex;gap:6px;align-items:center}
.eina{height:38px;min-width:38px;padding:0 8px;border-radius:10px;border:2px solid var(--linia);display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;background:var(--paper)}
.eina:hover,.eina.activa{border-color:var(--tinta)}
.eina.activa{background:var(--suau)}
.eina svg{width:20px;height:20px}
.eina.silenci{color:var(--ko);border-color:var(--ko)}
#conn{width:10px;height:10px;border-radius:50%;background:var(--linia)}
#conn.on{background:var(--ok)}
#cap-alumne{display:flex;align-items:center;gap:8px;font-weight:700}
.boto-petit{padding:6px 12px;border-radius:10px;border:2px solid var(--tinta);font-weight:700;font-size:.85rem;background:var(--paper)}
.boto-petit:hover{background:var(--suau)}

/* ---------- vista ---------- */
#vista{height:calc(100% - 56px);overflow:auto;position:relative}
.pantalla{min-height:100%;padding:18px 28px;display:flex;flex-direction:column}
.centrat{align-items:center;justify-content:center;text-align:center}

.boto{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 26px;border-radius:12px;background:var(--tinta);color:var(--paper);font-weight:800;font-size:1.05rem;border:2px solid var(--tinta);transition:transform .1s}
.boto:hover{transform:translateY(-1px)}
.boto:active{transform:translateY(1px)}
.boto.taronja{background:var(--taronja);border-color:var(--taronja)}
.boto.sec{background:var(--paper);color:var(--tinta)}
.boto:disabled{opacity:.4;cursor:default;transform:none}
.enllac{color:var(--gris);text-decoration:underline;font-size:.9rem}

/* ---------- robot ---------- */
.robot{display:block;overflow:visible}
.robot .cos{animation:sura 3.2s ease-in-out infinite}
.robot .ulls{transform-origin:70px 66px;animation:parpella 4.5s infinite}
.robot .antena{transform-origin:70px 34px;animation:antena 2.4s ease-in-out infinite}
.robot.saluda .brac{transform-origin:92px 128px;animation:saluda 1.8s ease-in-out infinite}
@keyframes saluda{0%,60%,100%{transform:rotate(0)}15%,45%{transform:rotate(-14deg)}30%{transform:rotate(8deg)}}
@keyframes sura{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes parpella{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
/* FR-4C de la portada: moviments a l'atzar */
.rob-portada{position:relative;cursor:pointer;display:inline-block;-webkit-tap-highlight-color:transparent}
.rob-portada>svg{transform-origin:50% 60%}
.rob-portada .fx{position:absolute;pointer-events:none;font-weight:900;color:#f26b1d;font-size:1.6rem;animation:fxpuja 1.4s ease-out forwards}
@keyframes fxpuja{0%{opacity:0;transform:translate(0,10px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),-60px) scale(1.2)}}
.rob-portada.m-saluda .brac{transform-origin:92px 128px;animation:saluda 1s ease-in-out 3}
.rob-portada.m-gir>svg{animation:fxgir 1.3s cubic-bezier(.4,0,.3,1)}
@keyframes fxgir{0%{transform:rotate(0)}80%{transform:rotate(375deg)}90%{transform:rotate(355deg)}100%{transform:rotate(360deg)}}
.rob-portada.m-tomb>svg{animation:fxtomb 1.2s ease-in-out}
@keyframes fxtomb{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(8px) scaleY(.9)}55%{transform:translateY(-70px) rotate(-200deg)}80%{transform:translateY(0) rotate(-360deg)}88%{transform:translateY(0) rotate(-360deg) scaleY(.88)}100%{transform:rotate(-360deg)}}
.rob-portada.m-antena .antena circle{animation:fxllum .5s ease-in-out 3}
@keyframes fxllum{0%,100%{fill:#f26b1d;filter:none}50%{fill:#fff6b0;filter:drop-shadow(0 0 10px #ff8a1d) drop-shadow(0 0 4px #ffd400)}}
.rob-portada.m-antena .antena{animation:none}
.rob-portada.m-ullet .ulls{animation:fxparp .9s}
.rob-portada.m-ullet .ulls>:nth-child(2){transform-box:fill-box;transform-origin:center;animation:fxullet 1.8s .9s}
@keyframes fxparp{0%,20%,40%,100%{transform:scaleY(1)}10%,30%{transform:scaleY(.1)}}
@keyframes fxullet{0%,100%{transform:scaleY(1)}20%,70%{transform:scaleY(.12)}}
.rob-portada.m-mira .ulls{animation:fxmira 2.6s ease-in-out}
@keyframes fxmira{0%,100%{transform:translateX(0)}20%,75%{transform:translate(7px,3px)}}
.rob-portada.m-pensa .ulls{animation:fxmira2 2.4s ease-in-out}
@keyframes fxmira2{0%,100%{transform:translate(0)}20%,80%{transform:translate(-4px,-5px)}}
.rob-portada.m-ball>svg{animation:fxball .5s ease-in-out 5 alternate}
@keyframes fxball{from{transform:rotate(-9deg) translateX(-6px)}to{transform:rotate(9deg) translateX(6px) translateY(-6px)}}
.rob-portada.m-salt>svg{animation:fxsalt .7s ease-out}
.rob-portada.m-salt .brac{transform-origin:92px 128px;animation:fxbrac .7s ease-out}
@keyframes fxsalt{0%,100%{transform:translateY(0)}15%{transform:translateY(6px) scaleY(.92)}50%{transform:translateY(-34px)}}
@keyframes fxbrac{50%{transform:rotate(-40deg)}}
@media (prefers-reduced-motion:reduce){.rob-portada *,.rob-portada>svg{animation:none!important}}
@keyframes antena{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.bafarada{position:relative;background:var(--paper);border:2px solid var(--tinta);border-radius:16px;padding:12px 16px;font-weight:600;max-width:360px;text-align:left}
.bafarada::before{content:"";position:absolute;left:-12px;top:22px;border:10px solid transparent;border-right-color:var(--tinta);border-left:0}
.bafarada::after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:var(--paper);border-left:0}

/* ---------- portada ---------- */
.portada{display:grid;grid-template-columns:1fr 1.2fr;align-items:center;gap:40px;max-width:1050px;margin:auto;width:100%}
.portada h1{font-size:3.2rem;line-height:1.05;letter-spacing:-.02em}
.portada h1 span{color:var(--taronja)}
.portada p.sub{font-size:1.2rem;color:var(--gris);margin:12px 0 28px}
.portada h1.titol-portada{font-size:2.9rem}
.portada p.portada-sub{font-size:1.35rem;line-height:1.4}
.portada p.portada-sub b{color:var(--tinta)}
.formulari{display:flex;flex-direction:column;gap:14px;max-width:380px}
.formulari label{font-weight:700;font-size:.95rem}
.camp{width:100%;padding:12px 14px;border:2px solid var(--tinta);border-radius:12px;background:var(--paper);font-size:1.1rem}
.camp:focus{outline:3px solid var(--taronja-suau);border-color:var(--taronja)}
.missatge-error{color:var(--ko);font-weight:700;min-height:1.4em}
@keyframes tremola{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tremola{animation:tremola .25s 2}

/* ---------- mapa ---------- */
.mapa-cap{display:flex;align-items:center;gap:20px;margin-bottom:22px}
.mapa-cap h2{font-size:1.7rem}
.barra-prog{height:14px;border-radius:7px;background:var(--suau);border:2px solid var(--tinta);overflow:hidden;width:260px}
.barra-prog i{display:block;height:100%;background:var(--ok);transition:width .5s}
.graella{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.targeta{border:2px solid var(--linia);border-radius:var(--radi);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:150px;background:var(--paper);transition:transform .15s,box-shadow .15s;position:relative}
.targeta .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid currentColor}
.targeta h3{font-size:1.05rem;line-height:1.25}
.targeta .estat{margin-top:auto;font-size:.85rem;font-weight:700}
.targeta.disponible{border-color:var(--taronja);cursor:pointer;box-shadow:0 4px 0 var(--taronja)}
.targeta.disponible:hover{transform:translateY(-3px)}
.targeta.disponible .num{color:var(--taronja)}
.targeta.disponible .estat{color:var(--taronja-fosc)}
.targeta.assolit{border-color:var(--ok);background:var(--ok-suau);cursor:pointer}
.targeta.assolit .num{color:var(--ok);background:var(--paper)}
.targeta.assolit .estat{color:var(--ok)}
.targeta.bloquejat,.targeta.construccio{color:var(--gris);background:var(--suau)}
.targeta.construccio{border-style:dashed}

/* ---------- objectiu ---------- */
.obj-cap{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.obj-cap h2{font-size:1.3rem;flex:1}
.punts{display:flex;gap:6px}
.punts i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tinta);background:var(--paper)}
.punts i.ara{background:var(--taronja);border-color:var(--taronja)}
.punts i.ok{background:var(--ok);border-color:var(--ok)}
.punts i.ko{background:var(--ko);border-color:var(--ko)}

.joc{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;flex:1;min-height:0}
.costat{border:2px solid var(--tinta);border-radius:var(--radi);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0}
.costat.pregunta{background:var(--paper)}
.costat.respostes{background:var(--suau)}
.etiqueta{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.enunciat{font-size:1.35rem;font-weight:600;line-height:1.35}
.visual{display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center;flex:1;min-height:140px}
.visual svg.dib{max-width:100%;max-height:230px}
.pista{display:flex;gap:12px;align-items:flex-start;background:var(--groc-suau);border:2px solid var(--groc);border-radius:12px;padding:10px 14px;font-size:1rem}
.pista .ico{font-size:1.4rem;line-height:1}

.opcions{display:flex;flex-direction:column;gap:10px}
.opcio{border:2px solid var(--tinta);border-radius:12px;background:var(--paper);padding:8px 16px;font-size:1.15rem;font-weight:700;text-align:left;display:flex;align-items:center;gap:14px;min-height:54px}
.opcio .fr.mitja{font-size:1.3em}
.opcio:hover:not(:disabled){background:var(--taronja-suau)}
.opcio .lletra{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid var(--tinta);display:grid;place-items:center;font-size:.9rem}
.opcio.triada{background:var(--taronja-suau);border-color:var(--taronja)}
.opcio.correcta{background:var(--ok-suau);border-color:var(--ok)}
.opcio.erronia{background:var(--ko-suau);border-color:var(--ko)}
.opcio:disabled{cursor:default}
.opcions.fila{flex-direction:row}
.opcions.fila .opcio{flex:1;justify-content:center;font-size:1.4rem}

.entrada-frac{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px auto}
.entrada-frac input{width:120px;text-align:center;font-size:2.2rem;font-weight:800;padding:6px;border:2px solid var(--tinta);border-radius:12px;background:var(--paper)}
.entrada-frac .ratlla{width:150px;height:5px;background:var(--tinta);border-radius:3px}
.entrada-num{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto;font-size:1.4rem;font-weight:700}
.entrada-num input{width:160px;text-align:center;font-size:2.2rem;font-weight:800;padding:6px;border:2px solid var(--tinta);border-radius:12px}
input:focus{outline:3px solid var(--taronja-suau);border-color:var(--taronja)}
input:disabled{background:var(--suau)}

.retorn{border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start;animation:apareix .3s both}
.retorn.ok{background:var(--ok-suau);border:2px solid var(--ok)}
.mix{display:inline-flex;align-items:center;font-weight:800;vertical-align:middle;margin:0 .15em}
.mix .mix-e{font-size:1.85em;line-height:1;margin-right:.08em}
.mix .fr{margin:0}
.mix.mitja{font-size:1.5em}.mix.gran{font-size:2.6em}
.opcio .mix.mitja{font-size:1.3em}
.entrada-mixt{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px auto}
.entrada-mixt input.ent{width:96px;height:96px;text-align:center;font-size:3rem;font-weight:800;border:2px solid var(--tinta);border-radius:12px}
.entrada-mixt .entrada-frac{margin:0}
.divisio{display:inline-grid;grid-template-columns:auto auto;font-size:2.2rem;font-weight:800;line-height:1.3}
.divisio span{padding:0 14px}
.divisio .dd{border-left:4px solid var(--tinta);border-bottom:4px solid var(--tinta)}
.divisio .q{border-left:4px solid var(--tinta);color:var(--taronja)}
.divisio .r{color:var(--taronja)}
.recta-zona{cursor:pointer}
.apartats{display:flex;flex-direction:column;gap:10px;margin:4px 0}
.ap{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--linia);border-radius:12px;padding:8px 12px;background:var(--paper)}
.ap.ok{border-color:var(--ok);background:var(--ok-suau)}.ap.ko{border-color:var(--ko);background:#fdecec}
.ap-l{font-weight:900;color:var(--gris);min-width:22px;padding-top:6px}
.ap-cos{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.ap-num .enter-gran{font-size:1.6rem}
.ap-signes{display:flex;gap:6px}
.ap-cicle{width:62px;height:52px;border-radius:10px;border:3px solid var(--taronja);background:#fff;font-size:1.9rem;font-weight:900;cursor:pointer;line-height:1;flex:none}.ap-cicle i{font-style:normal;color:var(--taronja);font-size:1.5rem;opacity:.8}.ap-cicle:not(:disabled):hover{background:#fff3ea}.ap-cicle.ple{border-color:var(--tinta);background:#fff}.ap-cicle:focus-visible{outline:3px solid var(--taronja);outline-offset:2px}.ap-cicle:disabled{cursor:default}
.ap-signes button,.ap-ops button{min-width:48px;height:44px;border-radius:10px;border:2px solid var(--tinta);background:#fff;font-size:1.35rem;font-weight:900;padding:0 10px}
.ap-ops{display:flex;gap:6px;flex-wrap:wrap}.ap-ops button{font-size:1.05rem;font-weight:800}
.ap-signes button.triat,.ap-ops button.triat,.ap-ord-pool button.triat{background:var(--tinta);color:#fff!important}
.ap-expr{font-size:1.35rem;font-weight:800;white-space:nowrap}
.ap-ent{display:flex;align-items:center;gap:6px}.ap-ent .signes{display:flex;gap:4px}
.ap-ent .signes button{width:40px;height:40px;border-radius:9px;border:2px solid var(--tinta);font-size:1.4rem;font-weight:900;background:#fff;line-height:1}
.ap-ent .signes button.activa{background:var(--tinta);color:#fff}
.ap-ent input{width:76px;height:44px;border:2px solid var(--tinta);border-radius:10px;font-size:1.4rem;font-weight:800;text-align:center}
.ap-text{font-size:1.05rem;font-weight:600;flex:1 1 260px;line-height:1.35}
.comp-sims{display:flex;flex-direction:column;gap:10px;align-items:center;font-size:2rem;font-weight:900}.comp-sims span{color:var(--tinta);margin:0 10px}
.regla-s{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:1.4rem;font-weight:700;background:#fff;border:2px solid var(--linia);border-radius:14px;padding:16px 26px}.regla-s .res{font-size:2.6rem;font-weight:900}
.taula-signes{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;font-size:1.6rem;font-weight:700;background:#fff;border:2px solid var(--linia);border-radius:14px;padding:18px 28px}
.ap-uni{font-weight:700;color:var(--gris)}
.ap-ord{width:100%}.ap-ord-cap{font-weight:700;margin-bottom:6px}
.ap-ord-fila{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:48px}
.ap-ord-fila i{font-style:normal;font-weight:900;color:var(--gris)}
.ap-ord-fila .buit{width:54px;height:42px;border:2px dashed var(--linia);border-radius:10px;display:inline-block}
.ap-ord-fila button,.ap-ord-pool button,.ap-ord-pool .usat{min-width:54px;height:42px;border-radius:10px;border:2px solid var(--tinta);background:#fff;font-size:1.2rem;font-weight:900;padding:0 8px}
.ap-ord-pool{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ap-ord-pool .usat{display:inline-flex;align-items:center;justify-content:center;opacity:.25;border-style:dashed}
.ap-bona{width:100%;font-size:.95rem;color:#1d6b3f;font-weight:700}
.ap-buit{display:inline-block;min-width:34px;text-align:center;border-bottom:3px solid var(--tinta);font-weight:900}
.ap-corr-llista{display:inline-flex;flex-direction:column;gap:2px}
.previ-nav{display:flex;align-items:center;gap:6px;margin-left:10px}.previ-nav b{min-width:34px;text-align:center}
#banda-previ{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;z-index:90;background:#7c5cd6;color:#fff;border-radius:999px;padding:6px 8px 6px 16px;font-size:.9rem;display:flex;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(0,0,0,.2)}
#banda-previ button{border:0;background:#fff;color:#5a3fb0;border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
.retorn.previ{background:#f2edfd;border:2px solid #7c5cd6}.previ-sol{margin:4px 0 4px 18px;padding:0}
.ronda-demo{display:flex;flex-direction:column;gap:14px}
.rd-ex{border:2px solid var(--linia);border-radius:14px;background:var(--paper);overflow:hidden}
.rd-cap{display:flex;gap:10px;align-items:center;background:#f4f2ee;padding:6px 12px;font-size:.85rem;color:var(--gris)}
.rd-cap b{background:var(--tinta);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.rd-pista{margin-left:auto;color:#8a6d00;font-weight:700}
.rd-cos{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;padding:12px}
.rd-preg .visual{margin:8px 0}.rd-preg .visual svg{max-width:100%;height:auto}
.rd-sol{border-left:2px dashed var(--linia);padding-left:12px;font-size:.95rem}.rd-sol ol{margin:4px 0 0 18px;padding:0}
.punts i.salt{background:#cfcac2;border-color:#cfcac2}
#rectaz-int{width:100%;max-width:560px;display:block;margin:0 auto;touch-action:manipulation}
.ovelles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ovelles .ov{display:flex;flex-direction:column;align-items:center;gap:4px}.ovelles .ov span{font-size:3rem;line-height:1}.ovelles .ov b{font-size:1.6rem;color:var(--taronja)}
.ovelles .ov.buit span{opacity:.6}
.conj-txt{text-align:center;font-size:1.35rem;font-weight:800;margin-top:10px;letter-spacing:.02em}
.lletra-conj{font-size:1.7rem;font-weight:900;font-family:'Cambria Math','STIX Two Math','Times New Roman',serif}
.xips-z{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.xips-z span{border:2px solid var(--linia);border-radius:12px;padding:6px 14px;font-size:1.5rem;font-weight:900;background:#fff;min-width:54px;text-align:center}
#recta-int{width:100%;max-width:530px;display:block;margin:0 auto;touch-action:manipulation}
.transf{display:flex;align-items:center;gap:14px}
.transf .fl{display:flex;flex-direction:column;align-items:center;font-weight:800;color:var(--taronja);font-size:1.2rem;line-height:1.5}
.transf .fl b{color:var(--tinta);font-size:1.6rem}
.op{font-size:1.4em;font-weight:800;margin:0 .15em;vertical-align:middle}
.eq{display:inline-flex;align-items:center;gap:.2em;flex-wrap:wrap}

.cb-tbl{border-collapse:collapse;margin:8px 0;font-size:.95rem}.cb-tbl th,.cb-tbl td{border:1px solid #c3d3ec;padding:4px 8px;text-align:left}.cb-tbl th{background:#eaf1fb;color:#0b2a5b}

.cb-open .cb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}

.cb-frin{display:inline-flex;flex-direction:column;align-items:center;font-weight:800}.cb-frin input{width:4.5em;margin-bottom:3px}.cb-frin span{border-top:2px solid currentColor;padding:0 10px}
.opcio.off{opacity:.4;text-decoration:line-through;pointer-events:none}
.res-item.parc{border-color:var(--groc);background:var(--groc-suau)}
.cb-barres{min-width:360px}

.cb-i{background:#fff;color:#0b2a5b;border-radius:50%;width:22px;height:22px;font-weight:900;font-size:.85rem;line-height:1;margin-top:2px}

.cel{fill:#fff;cursor:pointer;transition:fill .12s}

.pint-peu{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}

.etiq-frac{text-align:left;font-size:1rem;line-height:2.4}
.retorn.ko{background:var(--ko-suau);border:2px solid var(--ko)}
.retorn h4{font-size:1.2rem}
.retorn p{margin-top:4px}
.accions{display:flex;gap:12px;justify-content:flex-end;margin-top:auto;align-items:center}

/* fraccions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .15em}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .2em}
.fr>span{padding:0 .2em}

.diapo-tag{position:absolute;top:-15px;left:24px;background:var(--taronja);color:#fff;font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 14px;border-radius:999px;border:3px solid var(--tinta)}
.diapo.exemple .diapo-tag{background:var(--tinta)}
.expl-vis{border:2px solid var(--linia);background:#fcfbf9;border-radius:var(--radi);min-height:300px;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:18px}

.passos i.fet{background:var(--taronja)}
.parpelleja{color:var(--taronja);animation:parpelleja 1s ease-in-out 5}

.apareix{animation:apareix .5s both}
@keyframes apareix{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dib .omple{animation:omple .45s both}
@keyframes omple{from{fill:#fff}to{fill:var(--taronja)}}
.dib .traca{stroke-dasharray:200;stroke-dashoffset:200;animation:traca .5s forwards}
@keyframes traca{to{stroke-dashoffset:0}}
.dib .pop{animation:pop .35s both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.marca-ok{color:var(--ok);font-weight:800}
.marca-ko{color:var(--ko);font-weight:800}

.finestra{position:fixed;z-index:60;background:var(--paper);border:2px solid var(--tinta);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
.finestra-cap{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--tinta);color:var(--paper);cursor:move;user-select:none;font-weight:700;font-size:.9rem}
.finestra-cap span{flex:1}
.finestra-cap button{color:var(--paper);width:28px;height:28px;border-radius:6px;font-weight:800}

.calc-tecles .igual{background:var(--taronja);color:#fff;border-color:var(--taronja)}

.esb-eines button.activa{border-color:var(--tinta);background:var(--suau)}
.pastilla{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}

#f-temps.gran{width:min(90vw,640px)}

#f-temps.gran .temps-pantalla{font-size:9rem}

.temps-fila{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}

function connectaLocal() {
  const CLAU = 'fr4c_objectius_local';
  let arbre = {};
  try { arbre = JSON.parse(localStorage.getItem(CLAU)) || {}; } catch (e) { }
  const oients = new Set();
  const trossos = p => p.split('/').filter(Boolean);
  const copia = v => v == null ? null : JSON.parse(JSON.stringify(v));
  const llegeix = p => trossos(p).reduce((o, k) => (o == null ? null : (o[k] ?? null)), arbre);
  const escriu = (p, v) => {
    const ks = trossos(p); let o = arbre;
    for (const k of ks.slice(0, -1)) { if (typeof o[k] !== 'object' || o[k] === null) o[k] = {}; o = o[k]; }
    const u = ks[ks.length - 1];
    if (v == null) delete o[u]; else o[u] = copia(v);
  };
  const avisa = () => {
    try { localStorage.setItem(CLAU, JSON.stringify(arbre)); } catch (e) { }
    for (const l of oients) l.cb(copia(llegeix(l.p)));
  };
  return {
    local: true,
    on: (p, cb) => { const l = { p, cb }; oients.add(l); setTimeout(() => cb(copia(llegeix(p)))); return () => oients.delete(l); },
    set: async (p, v) => { escriu(p, v); avisa(); },
    update: async (p, o) => { for (const [k, v] of Object.entries(o)) escriu(p + '/' + k, v); avisa(); },
    push: async (p, v) => { const k = Date.now().toString(36) + Math.random().toString(36).slice(2, 6); escriu(p + '/' + k, v); avisa(); return k; },
    remove: async p => { escriu(p, null); avisa(); },
    get: async p => copia(llegeix(p)),
    onConn: cb => cb(true),
    esProfe: () => false
  };
}

  const ops = barreja([[n, d], ...ds]).map(([a, b]) => ({ html: frac(a, b, 'mitja'), val: ftxt(a, b), txt: ftxt(a, b) }));
  return { mode: 'opcions', opcions: ops, correcta: ftxt(n, d) };
}

function pesosDesiguals(d, subtil) {

  return p;
}

  const cin = (n, d) => `<span class="c-in"><input id="${n}" inputmode="numeric" maxlength="3" autocomplete="off"><i></i><input id="${d}" inputmode="numeric" maxlength="3" autocomplete="off"></span>`;
  vista.innerHTML = `<section class="pantalla">${capObj(info, prog)}
    <div class="joc taller-joc">
      <div class="costat pregunta"><div class="etiqueta">Ara sol · ${R.solsOk + 1} de ${t.sols}</div>
        <div class="enunciat">Calcula ${opFr([[G.a, G.d1], [G.b, G.d2]], [G.sg])} i simplifica el resultat si es pot.</div>
        <div class="resum-t petit">${NOMS_PASSOS.map((n, i) => `<div><b>${i + 1}</b>${n}</div>`).join('')}</div></div>
      <div class="costat respostes">${taulesHtml({ a: G.d1, b: G.d2, mode: 'amagat', mcm: G.L })}
        <div class="cadena"><div class="c-etq" style="margin:0">Pas intermig: mateix denominador</div>
          <div class="c-fila">${opFr([[G.a, G.d1], [G.b, G.d2]], [G.sg])}<span class="op">=</span>${cin('c-n1', 'c-m1')}<span class="op">${G.sg}</span>${cin('c-n2', 'c-m2')}</div>
          <div class="c-fila"><span class="op">=</span>${cin('c-rn', 'c-rd')}<span class="c-etq">Resultat final (simplificat)</span></div></div>
        <div id="zona-retorn">${R.msg || ''}</div>
        <div class="accions"><button class="boto taronja" id="t-ok" disabled>Comprova</button></div></div></div></section>`;
  $('#btn-mapa').onclick = () => { S.ronda = null; mostra('mapa'); };
  const ok = $('#t-ok'); const ins = $$('.costat.respostes input');
  ins.forEach((inp, k) => { inp.oninput = () => { inp.value = inp.value.replace(/[^0-9]/g, ''); inp.classList.remove('mal', 'be'); ok.disabled = ins.some(x => !x.value); }; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (!ok.disabled) ok.click(); else if (ins[k + 1]) ins[k + 1].focus(); } }; });
  ins[0].focus();
  const tz = $('.taules'); tz.onclick = e => { const b = e.target.closest('[data-mostra]'); if (b) { tz.classList.remove('amagades'); b.remove(); } };
  ok.onclick = () => {
    if (R.solFet) { R.solFet = false; R.msg = null; seguentExerciciTaller(R); return; }
    const v = id => Number($('#' + id).value);
    const [n1, m1, n2, m2, rn, rd] = ['c-n1', 'c-m1', 'c-n2', 'c-m2', 'c-rn', 'c-rd'].map(v);
    const marca = (id, b) => { const el = $('#' + id); el.classList.remove('mal', 'be'); el.classList.add(b ? 'be' : 'mal'); };
    const okM = m1 === m2 && m1 % G.d1 === 0 && m1 % G.d2 === 0;
    const okN1 = m1 > 0 && n1 * G.d1 === G.a * m1, okN2 = m2 > 0 && n2 * G.d2 === G.b * m2;
    const valOk = rd > 0 && rn * G.L === G.r * rd; const simpOk = valOk && mcd(rn, rd) === 1;
    marca('c-m1', okM); marca('c-m2', okM); marca('c-n1', okN1); marca('c-n2', okN2); marca('c-rn', simpOk); marca('c-rd', simpOk);
    let fallo = null;
    if (!okM) fallo = [1, `Els dos denominadors han de ser <b>iguals</b> i sortir a les taules del ${G.d1} i del ${G.d2}.`];
    else if (!okN1 || !okN2) fallo = [2, `Revisa les fletxes: el de dalt es multiplica <b>pel mateix número</b> que el de baix.`];
    else if (!valOk) fallo = [3, `El pas intermig està bé, però ${G.sg === '+' ? 'la suma' : 'la resta'} no. Recorda: el denominador es queda igual.`];
    else if (!simpOk) fallo = [4, `El resultat és correcte, però <b>encara es pot simplificar</b>.`];
    if (fallo) { errPas(R, fallo[0]); $('#zona-retorn').innerHTML = msgT(false, `<b>Pas ${fallo[0]}:</b> ${fallo[1]} Corregeix les caselles en vermell.`); return; }
    so('ok'); R.solsOk++; const final = R.solsOk >= t.sols; desaTaller(R, final);
    $('#zona-retorn').innerHTML = msgT(true, `<b>Perfecte!</b> ${exprTaller(G, 4)}`);
    ins.forEach(i => i.disabled = true); R.solFet = true; ok.textContent = final ? 'Acaba el taller →' : 'Següent →'; ok.disabled = false; ok.focus();
  };
}

function generaRonda(o, nivell, evitar = []) {
  const tema = TEMES[o]; const ev = new Set(evitar || []); const usats = new Set(); const out = [];
  for (const [tipus, opts] of tema.sequencia[nivell]) {
    let ex = null;
    for (let k = 0; k < 60; k++) {
      const c = tema.gen[tipus](nivell, opts || {});
      if (usats.has(c.sig)) continue;
      ex = c; if (!ev.has(c.sig)) break;
    }
    if (!ex) ex = tema.gen[tipus](nivell, opts || {});
    usats.add(ex.sig); ex.tipus = ex.tipus || tipus;
    if (tema.signeEscrit) { // a partir de l'objectiu 5 el signe s'escriu, sense botons
      if (ex.resposta?.mode === 'enter') ex.resposta.escrit = true;
      if (ex.resposta?.mode === 'apartats') ex.resposta.items.forEach(it => { if (it.tipus === 'enter') it.escrit = true; });
    }
    out.push(ex);
  }
  return out;
}
function quinaPista(nv, i, ex) {
  if (ex.pistaSempre) return 'completa';
  if (nv === 1) return i === 0 ? 'completa' : i === 1 ? 'mitja' : null;
  if (nv === 2) return i === 0 ? 'completa' : null;
  return null;
}

  ctx.beginPath(); ctx.moveTo(...ultim); ctx.lineTo(...p); ctx.stroke(); ultim = p;
});

let tTotal = 300, tResta = 300, tInterval = null;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
function pintaTemps() {
  const d = $('#temps-disp'); d.textContent = mmss(tResta); d.classList.toggle('acabat', tResta === 0 && tTotal > 0);
  $('#temps-go').textContent = tInterval ? 'Pausa' : 'Inicia';
  $('#e-temps-txt').textContent = (tInterval || (tResta < tTotal && tResta > 0)) ? mmss(tResta) : (tResta === 0 ? '00:00' : '');

function sona() {
  try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .35, .7].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .3); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .3); }); } catch (e) { }
}

$$('[data-mes]').forEach(b => b.onclick = () => { const v = Number(b.dataset.mes) * 60; tResta = Math.max(0, tResta + v); tTotal = Math.max(tResta, tTotal + v, 0); pintaTemps(); });

  pintaTemps();
};

   a través de l'app principal, que ja té l'alumne identificat. */
(function(){
  let P=null;try{P=parent.__fr4cPont||null;}catch(e){}

    forEach(f){if(v&&typeof v==='object'){for(const k in v){if(f(snap(v[k],k))===true)return true;}}return false;}});

    if(p[1]==='config')return {cfg:1,sub:p.slice(2)};

      return P.get(R.r);};
    const esc=R.r!=null&&!!P;
    return {key:k.split('/').filter(Boolean).pop()||null,
      child:c=>ref(k.replace(/\/$/,'')+'/'+c),
      once:async(ev,cb)=>{const s=snap(await get());if(typeof cb==='function')cb(s);return s;},
      on:(ev,cb)=>{if(!esc){get().then(v=>cb(snap(v)));return cb;}
        const u=P.on(R.r,v=>cb(snap(v)));(subs[k]=subs[k]||[]).push(u);return cb;},
      off:()=>{(subs[k]||[]).forEach(u=>{try{u();}catch(e){}});delete subs[k];},
      set:v=>esc?P.set(R.r,fix(v)):Promise.resolve(),
      update:o=>esc?P.update(R.r,fix(o)):Promise.resolve(),
      remove:()=>esc?P.remove(R.r):Promise.resolve()};}

    auth(){return {signInAnonymously:async()=>({user:usuari}),onAuthStateChanged(cb){setTimeout(()=>cb(usuari));return ()=>{};},currentUser:usuari};}};
})();

.upTag{align-self:flex-start;background:#000;color:#fff;border-radius:999px;padding:.15em .9em;font-weight:700;animation:popin .5s both}
.intro{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;font-size:1.25em;max-width:40em;margin:0 auto}
.intro .ex{font-size:1.25em;font-weight:700;display:flex;align-items:center;gap:.4em;flex-wrap:wrap;justify-content:center}
.intro.base{font-size:1.45em}

.byeBox{border:4px solid #000;border-radius:24px;padding:1.6rem 2rem;background:#fff;box-shadow:6px 6px 0 #000;max-width:620px;text-align:center;display:flex;flex-direction:column;gap:.9rem;align-items:center}
.byeBox .robot{width:150px}
.byeBox h2{font-size:2em;margin:0}
.byeBox .row{display:flex;gap:1rem;justify-content:center}

.station .st{font-size:.9em;font-weight:700}
.station.cur{background:var(--soft);animation:glow 1.6s ease-in-out infinite}
.station.done{background:var(--accent)}
.station.locked{opacity:.5;cursor:default}
.station .bdg{font-size:.85em;background:#fff;border:3px solid #000;border-radius:999px;padding:.05em .6em}
.badges{display:flex;gap:.3em}

.badges span.pop{animation:slotpop .6s}
.u path.on2{fill:var(--dark)}

.mcm{display:flex;flex-direction:column;gap:.5rem;align-items:flex-start}
.mrow{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.mrow b{min-width:8.5em;font-size:.95em}

.mul.hit{background:var(--accent);animation:mulin .3s both,hitpulse 1s 2.4s 2}
.mul.dots{border:none;background:none}
@keyframes mulin{from{opacity:0;transform:scale(.4)}}
@keyframes hitpulse{50%{transform:scale(1.25)}}
.mres{font-weight:700;animation:popin .45s both;margin-top:.2rem}

.q.small{font-size:1.2em}

.ticket .tl .fr{font-size:.95em}
.ticket .tot{border-top:2px solid #000;font-weight:800;margin-top:.2rem;padding-top:.3rem}

.robot.shake svg{animation:rshake .5s}

.talk .mouth{animation:talk .18s infinite alternate;transform-origin:50px 60px;transform-box:view-box}
@keyframes talk{to{transform:scaleY(.4)}}
.sweat{position:absolute;right:12%;top:12%;font-size:2em;animation:drip 1.4s forwards;pointer-events:none}

  else if(mood==='think'){eyes=`<circle cx="40" cy="41" r="5" fill="${O}"/><circle cx="64" cy="41" r="5" fill="${O}"/>`;mouth=`<path d="M43 60 h14" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  else if(mood==='oops'){eyes=`<circle cx="38" cy="44" r="4.5" fill="${O}"/><circle cx="62" cy="44" r="4.5" fill="${O}"/><path d="M31 35 l11 3 M69 35 l-11 3" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;mouth=`<path d="M40 62 q5 -4 10 0 t10 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  else if(mood==='wow'){eyes=`<circle cx="38" cy="44" r="7" fill="${O}"/><circle cx="62" cy="44" r="7" fill="${O}"/>`;mouth=`<circle cx="50" cy="61" r="4.5" fill="none" stroke="${O}" stroke-width="4"/>`;}
  else{eyes=`<circle cx="38" cy="44" r="5.5" fill="${O}"/><circle cx="62" cy="44" r="5.5" fill="${O}"/>`;mouth=`<path d="M42 60 q8 4 16 0" fill="none" stroke="${O}" stroke-width="4" stroke-linecap="round"/>`;}
  const up=mood==='wave'||mood==='happy';
  const armR=up?`<path d="M72 88 L86 70" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="87" cy="68" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:`<path d="M72 88 L84 100" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="85" cy="101" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`;
  const armL=mood==='happy'?`<path d="M28 88 L14 70" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="13" cy="68" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:mood==='think'?`<path d="M28 88 L40 66" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="41" cy="64" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`:`<path d="M28 88 L16 100" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="15" cy="101" r="5" fill="${O}" stroke="#000" stroke-width="3"/>`;
  return `<svg viewBox="-12 -16 130 134" class="m-${mood}" aria-hidden="true"><g class="bob">${armL}<g class="armR">${armR}</g>
  <rect x="30" y="82" width="40" height="26" rx="8" fill="${O}" stroke="#000" stroke-width="4"/><text x="50" y="100" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="11">FR-4C</text>
  <rect x="6" y="36" width="10" height="20" rx="4" fill="#fff" stroke="#000" stroke-width="4"/><rect x="84" y="36" width="10" height="20" rx="4" fill="#fff" stroke="#000" stroke-width="4"/>
  <rect x="14" y="20" width="72" height="58" rx="16" fill="#fff" stroke="#000" stroke-width="4"/><rect x="22" y="28" width="56" height="42" rx="10" fill="#000"/>
  <g class="eyes">${eyes}</g><g class="mouth">${mouth}</g>
  <g class="ant"><line x1="50" y1="8" x2="50" y2="20" stroke="#000" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="6" r="6" fill="${O}" stroke="#000" stroke-width="3"/></g></g></svg>`;}
let sayT=null;
function say(where,html,mood='idle',anim){
  const r=$(where==='map'?'#mapRob':'#rob'),b=$(where==='map'?'#mapBubble':'#bubble');
  r.innerHTML=robotSVG(mood);r.classList.remove('jump','shake');void r.offsetWidth;
  if(anim==='jump'){r.classList.add('jump');for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=pick(['✨','⭐','✦']);const a=Math.PI*2*i/8;s.style.setProperty('--dx',Math.cos(a)*80+'px');s.style.setProperty('--dy',Math.sin(a)*80+'px');r.appendChild(s);setTimeout(()=>s.remove(),1050);}}
  if(anim==='shake'){r.classList.add('shake');const s=document.createElement('span');s.className='sweat';s.textContent='💧';r.appendChild(s);setTimeout(()=>s.remove(),1500);}
  clearInterval(sayT);const parts=html.split(/(<[^>]+>)/);let out='',pi=0,ci=0;const svg=r.querySelector('svg');svg.classList.add('talk');
  sayT=setInterval(()=>{let st=3;while(st>0&&pi<parts.length){const p=parts[pi];if(p.startsWith('<')){out+=p;pi++;continue;}if(ci<p.length){out+=p[ci++];st--;}else{pi++;ci=0;}}
    b.innerHTML=out;if(pi>=parts.length){clearInterval(sayT);b.innerHTML=html;svg.classList.remove('talk');}},22);
}

/* ============ GRÀFICS ============ */
function pieSVG(d,k,o={}){const cx=60,cy=60,r=52;let s=`<svg class="u" viewBox="0 0 120 120" aria-hidden="true">`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const on=i<k,on2=o.k2&&i>=k&&i<k+o.k2,dl=o.anim&&(on||on2)?`style="animation-delay:${((o.d0||0)+i)*.12}s"`:'';
    s+=d===1?`<circle cx="60" cy="60" r="52" class="${on?'on':''}" style="fill:${on?'var(--accent)':'var(--empty)'};stroke:#000;stroke-width:3"/>`
        :`<path class="${on?'on':''} ${on2?'on2':''} ${o.anim&&(on||on2)?'anim':''}" ${dl} d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z"/>`;}
  return s+`</svg>`;}
function barSVG(d,k,o={}){const W=300,H=64,w=W/d;let s=`<svg class="u bar" viewBox="-3 -3 ${W+6} ${H+6}" aria-hidden="true">`;
  for(let i=0;i<d;i++){const on=i<k,on2=o.k2&&i>=k&&i<k+o.k2,dl=o.anim&&(on||on2)?`style="animation-delay:${((o.d0||0)+i)*.12}s"`:'';
    s+=`<rect class="p ${on?'on':''} ${on2?'on2':''} ${o.anim&&(on||on2)?'anim':''}" ${dl} x="${(i*w).toFixed(2)}" y="0" width="${w.toFixed(2)}" height="${H}"/>`;}
  if(o.cross){for(let i=k-o.cross;i<k;i++){const x=i*w;s+=`<path class="x" style="animation-delay:${.8+(i-k+o.cross)*.2}s" d="M${x+8} 10 L${x+w-8} ${H-10} M${x+w-8} 10 L${x+8} ${H-10}"/>`;}}
  return s+`</svg>`;}
function unitsVis(d,n,shape='pie',anim=true){const u=Math.max(1,Math.ceil(n/d));let left=n,h='',d0=0;
  for(let i=0;i<u;i++){const k=Math.max(0,Math.min(d,left));left-=k;h+=(shape==='bar'?barSVG:pieSVG)(d,k,{anim,d0});d0+=k;}
  return `<div class="units">${h}</div>`;}
// barra que es parteix (amp), es torna a ajuntar (simp) o es parteix per la meitat (half)
function eqVis(a,b,k,mode){const W=360,H=70,w=W/b,fw=W/(b*k);let s=`<svg class="u bar" viewBox="-3 -3 ${W+6} ${H+6}" aria-hidden="true">`;
  for(let i=0;i<b;i++){s+=`<rect class="p ${i<a?'on anim':''}" style="animation-delay:${i*.1}s" x="${i*w}" y="0" width="${w}" height="${H}"/>`;}
  if(mode==='half'){s+=`<rect x="${fw}" y="1.5" width="${fw-1.5}" height="${H-3}" class="fade" style="fill:var(--accent);animation-delay:1.4s"/>`;}
  for(let j=1;j<b*k;j++){if(j%k===0)continue;const x=j*fw;
    s+=mode==='simp'?`<line class="uncut" style="animation-delay:${.9+j*.05}s" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`
      :`<line class="cut" style="animation-delay:${.7+j*.08}s" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;}
  for(let i=1;i<b;i++)s+=`<line x1="${i*w}" y1="0" x2="${i*w}" y2="${H}" stroke="#000" stroke-width="5"/>`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#000" stroke-width="5"/>`;
  return `<div class="units">${s}</svg></div>`;}
function cmpVis(list,cutFirst){return `<div class="cmp">${list.map(([n,d],i)=>{
  let svg=barSVG(d,Math.min(n,d),{anim:true,d0:i*3});
  if(i===0&&cutFirst){const W=300,H=64,fw=W/(d*cutFirst);let extra='';for(let j=1;j<d*cutFirst;j++){if(j%cutFirst===0)continue;extra+=`<line class="cut" style="animation-delay:${1.2+j*.06}s" x1="${j*fw}" y1="0" x2="${j*fw}" y2="${H}"/>`;}svg=svg.replace('</svg>',extra+'</svg>');}
  return `<div class="row">${F(n,d)}${svg}</div>`;}).join('')}</div>`;}
function sumVis(a,b,d,op){return `<div class="units">${op==='+'?barSVG(d,a,{anim:true,k2:b}):barSVG(d,a,{anim:true,cross:b})}</div>`;}
function multVis(n,a,d){let h='',d0=0;for(let i=0;i<n;i++){h+=barSVG(d,a,{anim:true,d0});d0+=a+1;}return `<div class="units" style="flex-direction:column;gap:.4rem">${h}</div>`;}
function mergeAid(n,d){const w=Math.floor(n/d),r=n%d,parts=[];for(let i=0;i<w;i++)parts.push(F(d,d));if(r)parts.push(F(r,d));
  return `<div class="merge"><div class="parts">${parts.join('<b>+</b>')}</div><div class="res sol">${F(n,d)} = ${r?MX(w,r,d):w}</div></div>`;}

/* ============ TIPUS DE RESPOSTA ============ */
const B=i=>({b:i});
const choice=(opts,ans,keep)=>({type:'choice',opts:keep?opts:shuffle(opts),ans});
function fopts(list){const seen=new Set(),o=[];for(const [n,d] of list){const k=n+'/'+d;if(n<=0||d<=0||seen.has(k))continue;seen.add(k);o.push({h:F(n,d),v:k});}return o;}

const tpl=(tokens,ans,check)=>({type:'tpl',tokens,ans,check});
const eqCheck=(N,D)=>v=>v[1]>0&&v[0]*D===v[1]*N;
const irrCheck=(N,D)=>v=>v[1]>0&&v[0]*D===v[1]*N&&gcd(v[0],v[1])===1;
const wordsIn=(pre,suf,alts)=>({type:'words',pre,suf,alts});
const orderIn=fr=>{const sorted=fr.slice().sort((x,y)=>x[0]/x[1]-y[0]/y[1]);return {type:'order',items:shuffle(fr.map(([n,d])=>({h:F(n,d),v:n+'/'+d}))),ans:sorted.map(([n,d])=>n+'/'+d)};};
function irr(maxB=9,minB=2){for(;;){const b=ri(minB,maxB),a=ri(1,b-1);if(gcd(a,b)===1)return [a,b];}}
function distinctFracs(cnt,dens,improper){const out=[],vals=new Set();let guard=0;while(out.length<cnt&&guard++<500){const d=pick(dens),n=ri(1,improper?d*2:d-1);const v=(n/d).toFixed(6);if(vals.has(v))continue;vals.add(v);out.push([n,d]);}return out;}
const cmpSym=(a,b)=>a>b?'>':a<b?'<':'=';
const symOpts=()=>[{h:'<',v:'<'},{h:'=',v:'='},{h:'>',v:'>'}];

/* ============ GRÀFICS NOUS: m.c.m., barres que es tornen a partir i tiquet ============ */
function mcmVis(b,d,hide){const L=lcm(b,d);
  const row=(n,ri0)=>{let h='',k=1;const lim=hide?L+2*n:L;for(;k*n<=lim;k++){const v=k*n,hit=!hide&&v===L;h+=`<span class="mul ${hit?'hit':''}" style="animation-delay:${(k-1)*.35+ri0*.17}s">${v}</span>`;}if(hide)h+='<span class="mul dots">…</span>';return `<div class="mrow"><b>Múltiples de ${n}</b>${h}</div>`;};
  const last=Math.max(L/b,L/d)*.35+.5;
  return `<div class="mcm">${row(b,0)}${row(d,1)}${hide?'':`<div class="mres" style="animation-delay:${last}s">Coincideixen al <b>${L}</b> → m.c.m. = ${L}</div>`}</div>`;}
function convVis(a,b,c,d){const L=lcm(b,d);return `<div class="cmp">${[[a,b],[c,d]].map(([n,den],i)=>{let svg=barSVG(den,n,{anim:true,d0:i*3});const k=L/den,H=64,fw=300/L;
  if(k>1){let ex='';for(let j=1;j<L;j++){if(j%k===0)continue;ex+=`<line class="cut" style="animation-delay:${1.1+j*.05}s" x1="${j*fw}" y1="0" x2="${j*fw}" y2="${H}"/>`;}svg=svg.replace('</svg>',ex+'</svg>');}
  return `<div class="row">${F(n,den)}${svg}</div>`;}).join('')}</div>`;}
function pieVis(d,k,k2){return `<div class="units">${pieSVG(d,k,{anim:true,k2})}</div>`;}
const MESES=['Taula 1','Taula 2','Per emportar','Taula 4','Repartiment','Taula 6'];
const FI=(n,d)=>`<b class="fi">${n}/${d}</b>`;
function ticketVis(sc,step){const L=sc.orders.map((o,i)=>`<div class="tl"><span>🍕 ${MESES[i]}</span><span>${FI(o[0],o[1])} de pizza</span></div>`).join('');
  const tot=step>=1?`<div class="tl tot"><span>Total venut</span><span>${FI(sc.N,sc.D)} de pizza</span></div><div class="tl"><span>Preu d'una pizza sencera</span><span>${sc.P} €</span></div>`:'';
  const caixa=step>=2?`<div class="tl tot"><span>💶 A la caixa</span><span>${sc.money} €</span></div>${sc.desp?`<div class="tl"><span>🧾 Ingredients d'avui</span><span>− ${sc.desp} €</span></div>`:''}`:'';
  return `<div class="ticket"><div class="th">PIZZERIA TRES QUARTS · Vendes d'avui</div>${L}${tot}${caixa}</div>`;}
const coprime=b=>{let a;do{a=ri(1,b-1);}while(gcd(a,b)>1&&b>2);return a;};
const HINT=(r,base,mit,rep)=>r==='base'?base:r==='mitjana'?mit:rep;

/* ============ PART 1: MATEIX DENOMINADOR ============ */
function G1(r,k){
  const [lo,hi]={base:[3,6],mitjana:[4,12],repte:[6,20]}[r];let d=ri(lo,hi);const V=r==='base';
  if(k===6||k===8||k===9)d=Math.max(d,5);
  const two=()=>{const a=ri(1,Math.max(1,d-2)),b=ri(1,Math.max(1,d-1-a));return [a,b];};
  if(k===0||k===3){const [a,b]=two();return {q:'Suma',vis:V?sumVis(a,b,d,'+'):'',in:k===0?tpl([F(a,d),'+',F(b,d),'=',{fr:[B(0),d]}],[a+b]):tpl([F(a,d),'+',F(b,d),'=',{fr:[B(0),B(1)]}],[a+b,d],eqCheck(a+b,d)),
    hint:HINT(r,`Suma només els de dalt: <b>${a} + ${b}</b>.<br>El ${d} de baix es queda igual.`,'Mateix denominador: suma els numeradors i deixa el denominador.','Suma els numeradors.'),sol:`${F(a,d)} + ${F(b,d)} = ${F(a+b,d)}`};}
  if(k===1||k===4){const a=ri(2,d-1),b=ri(1,a-1);return {q:'Resta',vis:V?sumVis(a,b,d,'-'):'',in:k===1?tpl([F(a,d),'−',F(b,d),'=',{fr:[B(0),d]}],[a-b]):tpl([F(a,d),'−',F(b,d),'=',{fr:[B(0),B(1)]}],[a-b,d],eqCheck(a-b,d)),
    hint:HINT(r,`Resta només els de dalt: <b>${a} − ${b}</b>.<br>El ${d} de baix es queda igual.`,'Mateix denominador: resta els numeradors i deixa el denominador.','Resta els numeradors.'),sol:`${F(a,d)} − ${F(b,d)} = ${F(a-b,d)}`};}
  if(k===2){const [a,b]=two();return {q:`${F(a,d)} + ${F(b,d)} =`,vis:V?sumVis(a,b,d,'+'):'',in:choice(fopts([[a+b,d],[a+b,2*d],[a+b+1,d],[Math.max(1,a*b),d]]),(a+b)+'/'+d),
    hint:HINT(r,'Compte! El número de baix <b>no</b> se suma.','El denominador no canvia.','El denominador no canvia.'),sol:F(a+b,d)};}
  if(k===5){const c=ri(2,d-1),a=ri(1,c-1);return {q:'Quina fracció falta?',vis:V?sumVis(a,c-a,d,'+'):'',in:tpl([F(a,d),'+',{fr:[B(0),d]},'=',F(c,d)],[c-a]),
    hint:HINT(r,`Quants trossos falten per arribar de ${a} a ${c}?`,`Pensa: ${a} + □ = ${c}.`,'Resta per trobar-la.'),sol:`${F(a,d)} + ${F(c-a,d)} = ${F(c,d)}`};}
  if(k===6){const a=ri(1,d-3),b=ri(1,d-2-a),c=ri(1,d-1-a-b);return {q:'Suma les tres',vis:V?`<div class="units">${barSVG(d,a,{anim:true,k2:b+c})}</div>`:'',in:tpl([F(a,d),'+',F(b,d),'+',F(c,d),'=',{fr:[B(0),d]}],[a+b+c]),
    hint:HINT(r,`Suma els tres de dalt: <b>${a} + ${b} + ${c}</b>.`,'Suma els tres numeradors.','Suma els numeradors.'),sol:`${F(a+b+c,d)}`};}
  if(k===7){const a=ri(1,d-1);return {q:'Quant falta per arribar a 1?',vis:V?`<div class="units">${barSVG(d,d,{anim:true,cross:a})}</div>`:'',in:tpl(['1','−',F(a,d),'=',{fr:[B(0),V?d:B(1)]}],V?[d-a]:[d-a,d],V?null:eqCheck(d-a,d)),
    hint:HINT(r,`Un sencer són <b>${F(d,d)}</b>. Treu-ne ${a}.`,`1 = ${F(d,d)}`,`1 = ${F(d,d)}`),sol:`1 − ${F(a,d)} = ${F(d,d)} − ${F(a,d)} = ${F(d-a,d)}`};}
  if(k===8){d=pick([6,8,9,10,12,14,15,16,18,20]);let a,b;do{[a,b]=two();}while(gcd(a+b,d)===1);const [p,q]=red(a+b,d);return {q:'Suma i simplifica',vis:'',in:tpl([F(a,d),'+',F(b,d),'=',{fr:[B(0),B(1)]}],[p,q],irrCheck(p,q)),
    hint:'Suma i després divideix dalt i baix pel mateix número.',sol:`${F(a+b,d)} = ${F(p,q)}`};}
  // k===9: el resultat passa d'1
  const a=ri(Math.ceil(d/2),d-1),b=ri(d-a+1,d-1);return {q:'Suma',vis:'',in:tpl([F(a,d),'+',F(b,d),'=',{fr:[B(0),B(1)]}],[a+b,d],eqCheck(a+b,d)),hint:'Pot sortir més d\'1!',aid:mergeAid(a+b,d)};
}
/* ============ PART 2: DENOMINADORS DIFERENTS ============ */
const PR={base:[[2,4],[3,6],[2,6],[4,8],[2,8],[5,10],[3,9]],mitjana:[[2,3],[3,4],[4,6],[2,5],[3,5],[6,8],[4,10],[2,4],[3,6]],repte:[[4,6],[6,8],[6,9],[8,12],[4,10],[5,6],[3,8],[9,12],[10,15],[6,10]]};
function G2(r,k){
  let [b,d]=shuffle(pick(PR[r]));const L=lcm(b,d);let a=coprime(b),c=coprime(d);const V=r==='base',M=r==='mitjana';
  const conv=(n,den)=>F(n*L/den,L);const A=a*L/b,C=c*L/d;
  if(k===0){if(V)return {q:`Quin és el m.c.m. de ${b} i ${d}?`,vis:mcmVis(b,d,false),in:choice(topts([L,b*d,b+d,Math.min(b,d)].map(String)),String(L)),hint:'És el primer número que surt <b>a les dues files</b>.',sol:`m.c.m.(${b}, ${d}) = ${L}`};
    return {q:`Quin és el m.c.m. de ${b} i ${d}?`,vis:mcmVis(b,d,true),in:tpl(['m.c.m. =',B(0)],[L]),hint:HINT(r,'','Busca el primer número que surt a les dues files.','El múltiple comú més petit.'),aid:mcmVis(b,d,false)};}
  if(k===1){if(b===L){[a,b,c,d]=[c,d,a,b];}const k2=L/b;return {q:`Passa ${F(a,b)} a denominador ${L}`,vis:V||M?eqVis(a,b,k2,'amp'):'',in:tpl([F(a,b),'=',{fr:[B(0),L]}],[a*k2]),
    hint:HINT(r,`${b} × ${k2} = ${L}. Fes el mateix a dalt: <b>${a} × ${k2}</b>.`,`Multiplica dalt i baix per ${k2}.`,'Fracció equivalent.'),sol:`${F(a,b)} = ${F(a*k2,L)}`};}
  if(k===2||k===4||k===6){const N=A+C;
    const sol=`${F(a,b)} + ${F(c,d)} = ${conv(a,b)} + ${conv(c,d)} = ${F(N,L)}`;
    if(k===6){let o=fopts([[N,L],[a+c,b+d],[a+c,L],[N+1,L]]).filter((x,i)=>{const [p,q]=x.v.split('/').map(Number);return i===0||p*L!==q*N;});

let introSeen={},inIntro=false;

function renderEx(){const di=S.curDoor,door=DOORS[di];inIntro=false;stopSpeak();renderTop();$('#bInfo').disabled=false;
  $('#pDoor').textContent=`Part ${di+1} · ${door.t}`;

let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^ca/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function stopSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}$('#bSpeak').classList.remove('on');}
function speakText(t){if(!SND||!('speechSynthesis' in window))return;stopSpeak();const u=new SpeechSynthesisUtterance(t);u.lang='ca-ES';if(VOICE)u.voice=VOICE;u.rate=.85;
  u.onend=u.onerror=()=>$('#bSpeak').classList.remove('on');$('#bSpeak').classList.add('on');speechSynthesis.speak(u);}
function htmlToSpeech(h){const d=document.createElement('div');d.innerHTML=h;
  d.querySelectorAll('.fr').forEach(f=>{const [a,b]=[...f.children].map(x=>x.textContent.trim());const n=+a,dd=+b;f.replaceWith(Number.isInteger(n)&&Number.isInteger(dd)&&OS[dd]!==undefined||dd>=20?' '+words(n,dd)+' ':` ${a} entre ${b} `);});
  return d.textContent.replace(/☐/g,' comparat amb ').replace(/×/g,' per ').replace(/−/g,' menys ').replace(/\+/g,' més ').replace(/=/g,' igual a ').replace(/\s+/g,' ').trim();}
function speakQ(){if(!EX)return;let t=htmlToSpeech(EX.q);const In=EX.in;
  if(In.type==='choice'){const o=In.opts.map(x=>htmlToSpeech(x.h));t+=(/[?.!:…]$/.test(t)?' ':'. ')+(o.length>1?o.slice(0,-1).join(', ')+' o '+o[o.length-1]:o[0])+'?';}
  speakText(t);}
function renderInput(){const A=$('#pAns'),In=EX.in;A.innerHTML='';$('#pFoot').innerHTML='';
  if(In.type==='choice'){A.innerHTML=In.opts.map(o=>`<button class="opt" data-v="${esc(o.v)}">${o.h}</button>`).join('');
    A.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(resolved||b.disabled)return;const ok=b.dataset.v===In.ans;
      if(ok){b.classList.add('good');A.querySelectorAll('.opt').forEach(o=>o.disabled=true);success();}
      else{b.classList.add('bad');b.disabled=true;fail();}});return;}
  if(In.type==='tpl'){A.innerHTML=`<div class="tpl">${In.tokens.map(tk=>tokHTML(tk)).join('')}</div>`;}
  if(In.type==='words'){A.innerHTML=`<div class="words">${In.pre?`<span class="fix">${esc(In.pre)}</span>`:''}<input id="wIn" autocomplete="off" spellcheck="false" aria-label="Resposta">${In.suf?`<span class="fix">${esc(In.suf)}</span>`:''}</div>`;}
  if(In.type==='order'){const chosen=[];In._ch=chosen;
    A.innerHTML=`<div class="order"><div class="slots" id="oSlots"></div><div class="pool" id="oPool"></div><div class="note">Toca les fraccions per ordre. Toca'n una de dalt per tornar-la.</div></div>`;
    const draw=()=>{$('#oSlots').innerHTML=chosen.length?chosen.map((v,i)=>`<button class="card" data-i="${i}">${In.items.find(x=>x.v===v).h}</button>`).join('<span class="lt">&lt;</span>'):'<span class="note">Més petita … més gran</span>';
      $('#oPool').innerHTML=In.items.filter(x=>!chosen.includes(x.v)).map(x=>`<button class="card" data-v="${esc(x.v)}">${x.h}</button>`).join('');
      $('#oSlots').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(resolved)return;chosen.splice(+b.dataset.i,1);sfx('click');draw();});
      $('#oPool').querySelectorAll('.card').forEach(b=>b.onclick=()=>{if(resolved)return;chosen.push(b.dataset.v);sfx('click');draw();});};
    In._draw=draw;draw();}
  $('#pFoot').innerHTML=`<button class="btn primary" id="bCheck">Comprova</button>`;$('#bCheck').onclick=check;
  A.querySelectorAll('input').forEach(inp=>{inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check();}});inp.addEventListener('input',()=>inp.classList.remove('bad'));});
  const f=A.querySelector('input');if(f)setTimeout(()=>f.focus({preventScroll:true}),60);
}
function tokHTML(tk){
  if(typeof tk==='string'||typeof tk==='number')return `<span>${tk}</span>`;
  if(tk.b!==undefined)return `<input class="box" data-b="${tk.b}" inputmode="numeric" autocomplete="off" aria-label="Casella ${tk.b+1}">`;
  if(tk.fr)return `<span class="fr">${tk.fr.map(p=>`<span>${typeof p==='object'?tokHTML(p):p}</span>`).join('')}</span>`;
  return '';}
function check(){if(resolved)return;const In=EX.in;let ok=false;
  if(In.type==='tpl'){const boxes=[...document.querySelectorAll('#pAns .box')].sort((a,b)=>a.dataset.b-b.dataset.b);const vals=boxes.map(b=>b.value.trim()===''?NaN:Number(b.value.trim().replace(',','.')));
    if(vals.some(isNaN)){say('play','Omple totes les caselles amb números.','think');return;}
    ok=In.check?In.check(vals):vals.every((v,i)=>v===In.ans[i]);
    boxes.forEach(b=>{b.classList.remove('ok','bad');b.classList.add(ok?'ok':'bad');});}
  else if(In.type==='words'){const v=$('#wIn').value;if(!v.trim()){say('play','Escriu la resposta.','think');return;}
    const m=matchWords(v,In.alts);ok=!!m;if(m==='loose')EX.spell=`Compte amb l'escriptura: <b>${esc((In.pre||'')+In.alts[0]+(In.suf||''))}</b>`;}
  else if(In.type==='order'){if(In._ch.length<In.items.length){say('play','Col·loca totes les fraccions.','think');return;}ok=In._ch.every((v,i)=>v===In.ans[i]);}
  ok?success():fail();}
function success(){resolved=true;stopSpeak();const st=doorStats(DOORS[S.curDoor].id);const p=EX.up?(tries===0?15:8):(tries===0?10:5);S.punts+=p;SESS.punts+=p;
  const k=EX.up?(tries===0?'upEncerts':'upSegon'):(tries===0?'encerts':'segon');st[k]=(st[k]|0)+1;
  sfx('ding');finishRepte();
  const msg=(EX.spell?EX.spell+'<br>':'')+(tries===0?pick(['Perfecte!','Bip-bip! Correcte!','Molt bé!','Circuits feliços!']):'Ara sí!')+` <b>+${p} 🪙</b>`;
  say('play',msg,'happy','jump');showAid();renderTop();}
function fail(){tries++;const st=doorStats(DOORS[S.curDoor].id);if(EX.up)st.upErrors=(st.upErrors|0)+1;else st.errors++;
  if(tries>=2){resolved=true;stopSpeak();if(EX.up)st.upFallats=(st.upFallats|0)+1;else st.fallats++;sfx('bup');finishRepte();say('play','Aquesta no ha sortit. Mira la solució i continuem!','oops','shake');showAid(true);
    if(EX.in.type==='choice')document.querySelectorAll('#pAns .opt').forEach(o=>{o.disabled=true;if(o.dataset.v===EX.in.ans)o.classList.add('good');});
    return;}
  sfx('bup');save();
  if(EX.in.type==='order'&&EX.in._draw){EX.in._ch.length=0;setTimeout(()=>{if(!resolved)EX.in._draw();},600);}
  if(S.ruta==='base'&&EX.hint){showHint(false);}
  else{$('#bHint').classList.add('pulse');say('play','Gairebé! Torna-ho a provar. Si vols, toca la 💡.','oops','shake');}}
function showHint(count=true){if(!EX||!EX.hint||resolved)return;
  if(count&&!hintUsed){hintUsed=true;doorStats(DOORS[S.curDoor].id).pistes++;save();}
  $('#bHint').classList.remove('pulse');$('#pVis').classList.remove('glow');void $('#pVis').offsetWidth;if(EX.vis)$('#pVis').classList.add('glow');
  sfx('pop');say('play','💡 '+EX.hint,'think');}
function showAid(fail){const a=$('#pAid');a.innerHTML=EX.aid?EX.aid:(EX.sol?`<span class="sol">${fail?'Solució: ':''}${EX.sol}</span>`:'');
  $('#pFoot').innerHTML=`<button class="btn primary" id="bNext">${S.porta>S.curDoor?(S.curDoor===3?'Tanca la caixa 💰':'Acaba la part 🎉'):'Següent'}</button>`;$('#bNext').onclick=next;setTimeout(()=>$('#bNext')&&$('#bNext').focus({preventScroll:true}),100);}
// desa el resultat del repte abans de passar al següent (així no es perd res si es tanca l'ordinador)
function finishRepte(){const st=doorStats(DOORS[S.curDoor].id);st.temps+=Math.min(240,Math.round((Date.now()-tick)/1000));st.ruta=EX.ruta||S.ruta;SESS.reptes++;
  S.repte++;if(S.repte>=nr(S.curDoor)){st.acabada=true;S.porta=S.curDoor+1;S.repte=0;if(S.porta>=NP){S.acabat=true;S.punts+=20;}}

function bye(){if(!S)return;const box=$('#byeBox'),di=Math.min(S.porta,5),where=S.porta>=NP?'Ja tens el diploma!':`La pròxima vegada continuaràs a la <b>part ${S.porta+1}</b>, repte ${S.repte+1}.`;

      <p>${SESS.reptes?`Avui has fet <b>${SESS.reptes}</b> ${SESS.reptes===1?'repte':'reptes'} i has guanyat <b>🪙 ${SESS.punts}</b> monedes.`:'Avui només has passat a saludar. La propera vegada, a la feina!'}</p>
      <button class="btn primary" id="byeOk">D'acord</button>`;sfx('bleep');
    $('#byeOk').onclick=logout;$('#byeOk').focus();clearTimeout(box._t);box._t=setTimeout(()=>{if(!$('#bye').classList.contains('hide'))logout();},12000);};}
$('#bOut').onclick=bye;$('#bBye').onclick=bye;
$('#bInfo').onclick=()=>{if(!resolved&&!inIntro)showIntro(true);};
$('#bSpeak').onclick=()=>{if(inIntro)speakText(htmlToSpeech($('#pAns').innerHTML));else speakQ();};
$('#bSnd').onclick=()=>{SND=!SND;$('#bSnd').textContent=SND?'🔊':'🔇';$('#bSnd').setAttribute('aria-pressed',SND);};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#bNext')&&!$('#scrPlay').classList.contains('hide')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#bNext').click();}});
/* ============ FR-4C: entrada automàtica des de l'app de la classe ============ */
(function(){const P=window.FR4C;if(!P)return;const a=P.alumne();
  SND=a.sons!==false;$('#bSnd').textContent=SND?'🔊':'🔇';$('#bSnd').setAttribute('aria-pressed',SND);
  const c=String(a.codi||'');$('#inNom').value=a.nom||'Alumne';$('#inCodi').value=/^\d{4}$/.test(c)?c:'0000';
  ['#bOut','#bBye'].forEach(s=>{$(s).textContent='Surt del taller';});
  logout=function(){stopSpeak();closeFun(true);unlisten();REF=null;$('#bye').classList.add('hide');P.surt();};
  kicked=function(){closeFun(true);unlisten();REF=null;P.surt();};
  login();})();

<script type="text/plain" id="joc-tesc"><!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESCAPE-FRAC · El laboratori precintat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<script>/* Pont FR-4C: aquest joc s'executa dins l'app «FR-4C · Matemàtiques 4t ESO».
   Substitueix el Firebase propi del joc: tot es desa a objectius/resultats/{alumne}/{taller}
   a través de l'app principal, que ja té l'alumne identificat. */
(function(){
  let P=null;try{P=parent.__fr4cPont||null;}catch(e){}
  window.FR4C=P;
  const fix=v=>{if(v&&typeof v==='object'&&!Array.isArray(v)){if(v['.sv'])return Date.now();const o={};for(const k in v)o[k]=fix(v[k]);return o;}return v;};
  const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
  const snap=(v,key)=>({key,val:()=>clone(v),exists:()=>v!=null,
    forEach(f){if(v&&typeof v==='object'){for(const k in v){if(f(snap(v[k],k))===true)return true;}}return false;}});
  // camí del joc → què representa: document del taller, configuració, connexió o res
  function on_(path){const p=String(path||'').split('/').filter(Boolean);
    if(p[0]==='.info')return {info:1};
    if(p[1]==='config')return {cfg:1,sub:p.slice(2)};
    if(p[1]==='alumnes'&&p.length>=3)return {r:p.slice(3).join('/')};
    return {nul:1};}
  const subs={};
  function ref(path){const R=on_(path),k=String(path||'');
    const get=async()=>{if(R.info)return true;if(!P||R.nul)return null;
      if(R.cfg){let c=P.config();for(const s of R.sub)c=c==null?null:c[s];return c==null?null:c;}
      return P.get(R.r);};
    const esc=R.r!=null&&!!P;
    return {key:k.split('/').filter(Boolean).pop()||null,
      child:c=>ref(k.replace(/\/$/,'')+'/'+c),
      once:async(ev,cb)=>{const s=snap(await get());if(typeof cb==='function')cb(s);return s;},
      on:(ev,cb)=>{if(!esc){get().then(v=>cb(snap(v)));return cb;}
        const u=P.on(R.r,v=>cb(snap(v)));(subs[k]=subs[k]||[]).push(u);return cb;},
      off:()=>{(subs[k]||[]).forEach(u=>{try{u();}catch(e){}});delete subs[k];},
      set:v=>esc?P.set(R.r,fix(v)):Promise.resolve(),
      update:o=>esc?P.update(R.r,fix(o)):Promise.resolve(),
      remove:()=>esc?P.remove(R.r):Promise.resolve()};}
  const database=()=>({ref});
  database.ServerValue={TIMESTAMP:{'.sv':'timestamp'}};
  const usuari={uid:'fr4c',isAnonymous:true};
  window.firebase={apps:[],initializeApp(c){this.apps.push(c);return {};},database,
    auth(){return {signInAnonymously:async()=>({user:usuari}),onAuthStateChanged(cb){setTimeout(()=>cb(usuari));return ()=>{};},currentUser:usuari};}};
})();
<\/script>

.mk{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.mk-ok{fill:var(--ok);stroke:var(--ink);stroke-width:2}
.counter{text-align:center;font-weight:700;font-size:1.15rem;margin:.3rem 0 .6rem;min-height:1.6em}
.eqref{display:grid;grid-template-columns:3.6rem 1fr;align-items:center;gap:.6rem;max-width:480px;margin:0 auto .8rem}
.eqlab{font-size:1.5rem;text-align:center}
.eqpair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;max-width:520px;margin:.5rem 0}
.eqpair>div{text-align:center}
.pies2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;text-align:center;max-width:460px;margin:0 auto}
.pies2 .who{font-weight:700;margin-bottom:.3rem}

.opts{display:grid;grid-template-columns:1fr;gap:.7rem}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{border:3px solid var(--ink);background:var(--surface);border-radius:12px;padding:.8rem 1rem;font-size:1.2rem;cursor:pointer;text-align:center;box-shadow:3px 3px 0 var(--ink);min-height:64px}
.opt .fr{font-size:1.15em}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.opt:disabled{cursor:default}

.ansrow{display:flex;gap:1.2rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:.8rem}
.fracin{display:inline-flex;flex-direction:column;align-items:center;gap:.35rem}
.fracin input,.numin,.mixw{width:5.2rem;text-align:center;font-size:1.8rem;font-weight:700;padding:.3rem;border:3px solid var(--ink);border-radius:10px;background:var(--bg)}
.numin{width:8rem}
.mixw{width:4.4rem;font-size:2.4rem}
.mixin{display:inline-flex;align-items:center;gap:.5rem}
.fbar{display:block;width:6rem;height:5px;background:var(--ink);border-radius:3px}
.wordin{width:min(100%,460px);font-size:1.5rem;padding:.5rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--bg)}
.keys{display:flex;gap:.4rem;justify-content:center;margin-top:.5rem}
.key{border:2px solid var(--ink);background:var(--surface);border-radius:8px;min-width:2.6rem;padding:.2rem .5rem;font-size:1.2rem;font-weight:700;cursor:pointer}

/* ---------- cartes ---------- */
.deck{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;min-height:132px;align-items:center}
.slots{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;align-items:center;margin:1rem 0;padding:.8rem;border:3px dashed var(--line);border-radius:16px}
.slot{width:84px;height:118px;border:3px dashed var(--muted);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.sign-op{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.6rem;color:var(--accent);padding:0 .1rem}
.pcard{position:relative;width:84px;height:118px;border:3px solid var(--ink);border-radius:12px;background:var(--surface);box-shadow:3px 3px 0 var(--ink);cursor:pointer;display:grid;place-items:center;font-size:1.7rem;padding:0;transition:transform .12s}
.pcard::before,.pcard::after{content:'◆';position:absolute;color:var(--accent);font-size:.8rem;line-height:1}
.pcard::before{top:6px;left:8px}
.pcard::after{bottom:6px;right:8px;transform:rotate(180deg)}
.pcard:hover:not(:disabled){transform:translateY(-4px)}
.pcard.sel{background:var(--accent);color:#000}
.pcard.sel::before,.pcard.sel::after{color:#000}
.pcard.good{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.pcard.badc{border-color:var(--bad);box-shadow:3px 3px 0 var(--bad)}
.pcard:disabled{cursor:default}
.cardlab{text-align:center;font-weight:700;color:var(--muted);font-size:.95rem}

.tools{margin-top:1.1rem;display:flex;justify-content:flex-end}
.hint{margin-top:.8rem;border:2px dashed var(--accent);border-radius:12px;padding:.6rem .9rem;background:var(--accent-soft)}
.fb{margin-top:1rem;border:3px solid var(--ink);border-left-width:12px;border-radius:12px;padding:.4rem 1rem .9rem}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb.warn{border-color:var(--accent);background:var(--accent-soft);padding:.6rem 1rem}
.fb .bot{margin:.4rem 0 .2rem}
.pts{display:inline-block;background:#000;color:var(--accent);border-radius:8px;padding:0 .45rem;font-size:.95rem;margin-left:.3rem}
.exp{margin:.4rem 0 .9rem;line-height:1.75}
.exp .fr{font-size:1.05em}
.mini{margin:.5rem 0}
.mini svg{max-width:340px}
.cmp{display:grid;gap:.7rem}
.cmp-row{display:grid;grid-template-columns:3.5rem 1fr;align-items:center;gap:.6rem}
.cmp-f{font-size:1.5rem;text-align:center}

/* ---------- revelació, porta, victòria ---------- */
.reveal{text-align:center;padding-top:1rem}
.reveal h2{font-size:clamp(2rem,7vw,3.2rem);margin:.4rem 0}
.biglock{width:120px;height:150px;margin:0 auto;display:block}
.biglock .shackle{transform-origin:78px 60px;transition:transform .6s cubic-bezier(.3,1.6,.5,1) .25s}
.biglock.open .shackle{transform:translateY(-16px) rotate(28deg)}
.bigdigit{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:8.5rem;line-height:1;width:1.4em;height:1.5em;display:grid;place-items:center;margin:1rem auto;background:#000;color:var(--accent);border-radius:24px;box-shadow:8px 8px 0 var(--accent)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes pop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.code{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;margin:1.2rem 0}
.code label{display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:1.3rem}
.code input{width:3rem;height:3.8rem;text-align:center;font-size:2rem;font-weight:800;border:3px solid var(--ink);border-radius:12px;background:var(--surface)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.win h2{font-size:clamp(2.4rem,9vw,4.5rem);margin:.3rem 0}
.stars{font-size:3rem;letter-spacing:.2rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin:1.2rem 0;text-align:left}
.statgrid div{border:3px solid var(--ink);border-radius:12px;padding:.6rem .8rem;background:var(--surface)}
.statgrid b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:2rem}
.codebox{display:inline-block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.6rem,6.5vw,2.4rem);letter-spacing:.08em;background:#000;color:var(--accent);padding:.4rem 1rem;border-radius:14px;margin:.4rem 0}
.codepanel{margin-top:1rem;border:3px solid var(--ink);border-radius:14px;padding:1rem 1.2rem;background:var(--accent-soft);text-align:center}

/* ---------- tauler professor ---------- */
.tform{display:grid;grid-template-columns:1fr 1fr auto;gap:.7rem;align-items:end;margin:1rem 0}
@media (max-width:640px){.tform{grid-template-columns:1fr}}
.tform label{font-weight:700;font-size:.95rem}
.tform input{display:block;width:100%;margin-top:.3rem;padding:.6rem .8rem;border:3px solid var(--ink);border-radius:12px;background:var(--surface);font-size:1.1rem}
.tform input#tcode{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.twrap{overflow-x:auto;border:3px solid var(--ink);border-radius:14px;background:var(--surface);margin-top:1rem}
table.res{width:100%;border-collapse:collapse;font-size:1rem;min-width:620px}
table.res th,table.res td{padding:.55rem .7rem;text-align:left;border-bottom:2px solid var(--line);white-space:nowrap}
table.res th{background:#000;color:#fff}
table.res tr:last-child td{border-bottom:0}
.rm{background:none;border:0;cursor:pointer;font-size:1.1rem;color:var(--bad)}
textarea.csv{width:100%;min-height:8rem;margin-top:.6rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;border:2px solid var(--ink);border-radius:10px;padding:.5rem;background:var(--surface);color:var(--ink)}

/* ---------- pissarra ---------- */
.wb-fab{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:40;border:3px solid var(--ink);background:var(--accent);color:#000;border-radius:999px;padding:.6rem 1.1rem;font-weight:700;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.wb-fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
body.wb-open .wb-fab{display:none}
.wb{position:fixed;z-index:45;top:0;right:0;bottom:0;width:min(560px,46vw);background:var(--surface);border-left:4px solid var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wb[hidden]{display:none}
.wb-bar{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center;padding:.5rem .6rem;border-bottom:3px solid var(--ink);background:var(--bg)}
.wb-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;margin-right:auto}
.wb-tool{border:2px solid var(--ink);background:var(--surface);border-radius:10px;min-width:46px;height:46px;font-size:1.15rem;cursor:pointer;font-weight:700;display:inline-grid;place-items:center;padding:0 .5rem}
.wb-tool.on{background:var(--accent);color:#000;box-shadow:inset 0 0 0 2px #000}
.wb-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);display:block}
.wb-q{display:none;padding:.4rem .8rem;border-bottom:2px solid var(--line);font-size:1rem;max-height:30vh;overflow:auto}
.wb-wrap{flex:1;position:relative;background-color:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;touch-action:none;overflow:hidden}
.wb canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wb-foot{font-size:.85rem;padding:.3rem .8rem;border-top:2px solid var(--line)}
@media (min-width:901px){body.wb-open main{max-width:none;margin:0 calc(min(560px,46vw) + 1rem) 0 1rem}}
@media (max-width:900px){.wb{width:100%;border-left:0}.wb-q{display:block}}
main{padding-bottom:6rem}

/* ---------- accés i tauler ---------- */
.pin{letter-spacing:.4em;max-width:180px!important;text-align:center;font-weight:700}
.heat{display:inline-grid;place-items:center;width:1.9rem;height:1.6rem;border-radius:6px;font-size:.85rem;font-weight:700;border:1.5px solid var(--line)}
.heat.h0{color:var(--muted)}.heat.h1{background:var(--accent-soft)}.heat.h2{background:#ffb27a;color:#000}.heat.h3{background:var(--accent);color:#000}
.heat.open{outline:2px solid var(--ok);outline-offset:1px}
table.res tfoot td{background:var(--accent-soft);font-weight:700;border-top:3px solid var(--ink)}
.legend{font-size:.9rem;color:var(--muted);margin:.5rem 0}
textarea.bulk{width:100%;min-height:7rem;border:3px solid var(--ink);border-radius:12px;padding:.6rem;background:var(--surface);color:var(--ink);font:1rem ui-monospace,Menlo,Consolas,monospace}

/* ---------- robot animat ---------- */
.robot .rb-all{animation:rbFloat 3.2s ease-in-out infinite}
@keyframes rbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.robot .rb-eyes{transform-box:fill-box;transform-origin:center;animation:rbBlink 4.2s infinite}
@keyframes rbBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.robot .rb-bulb{animation:rbGlow 1.6s ease-in-out infinite}
@keyframes rbGlow{0%,100%{opacity:1}50%{opacity:.3}}
.robot.talking .rb-mouth{transform-box:fill-box;transform-origin:center;animation:rbTalk .16s ease-in-out infinite alternate}
@keyframes rbTalk{from{transform:scale(1,1)}to{transform:scale(.8,.25)}}
.robot .rb-armR{transform-box:view-box;transform-origin:72px 88px}
.robot.mood-wave .rb-armR{animation:rbWave .45s ease-in-out 6 alternate}
@keyframes rbWave{from{transform:rotate(-18deg)}to{transform:rotate(22deg)}}
.robot.mood-happy .rb-all,.robot.mood-wow .rb-all{animation:rbHop .5s ease-out 2,rbFloat 3.2s ease-in-out 1s infinite}
@keyframes rbHop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}
.robot.mood-happy .rb-armL,.robot.mood-wow .rb-armL{transform-box:view-box;transform-origin:28px 88px;animation:rbArmUp .5s ease-out 2 alternate}
.robot.mood-happy .rb-armR,.robot.mood-wow .rb-armR{animation:rbArmUpR .5s ease-out 2 alternate}
@keyframes rbArmUp{to{transform:rotate(60deg)}}
@keyframes rbArmUpR{to{transform:rotate(-60deg)}}
.robot .rb-spark{transform-box:fill-box;transform-origin:center;animation:rbSpark .9s ease-out 2 both}
.robot .rb-spark.s2{animation-delay:.2s}.robot .rb-spark.s3{animation-delay:.4s}
@keyframes rbSpark{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.2) rotate(45deg);opacity:1}100%{transform:scale(.5) rotate(90deg);opacity:0}}
.robot.mood-oops .rb-headg{transform-box:view-box;transform-origin:50px 60px;animation:rbShake .45s ease-in-out 2}
@keyframes rbShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.robot .rb-sweat{animation:rbSweat 1.3s ease-in 2 both}
@keyframes rbSweat{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
.robot.mood-think .rb-eyes{animation:rbLook 2.4s ease-in-out infinite}
@keyframes rbLook{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
.robot .rb-dot{animation:rbDots 1.2s infinite}.robot .rb-dot.d2{animation-delay:.2s}.robot .rb-dot.d3{animation-delay:.4s}
@keyframes rbDots{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.robot *{animation:none!important}}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.pop,.shake,.robot,.robot .rb-bulb{animation:none!important}.biglock .shackle{transition:none}}
@media (max-width:520px){body{font-size:18px}.prompt{font-size:1.25rem}.bigdigit{font-size:6.5rem}.pcard,.slot{width:70px;height:100px;font-size:1.45rem}}
/* FR-4C: sense tauler del professor ni codis de progrés (el progrés es desa a l'app) */
[data-act="teacher"],[data-act="showrestore"],[data-act="showcode"],#restoreBox,.codepanel{display:none!important}
body.fr4c-entrant #app{visibility:hidden}
</style>
