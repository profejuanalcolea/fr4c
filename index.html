<body>
<header class="top"><div class="top-in"><button class="brand" data-act="home" aria-label="Inici" id="brand"></button><div class="stats" id="stats"></div></div>
<div class="tape" aria-hidden="true"></div></header>
<main id="app"></main>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   UTILITATS
   ========================================================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
const simp=(n,d)=>{const g=gcd(n,d)||1;return [n/g,d/g];};
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MIX=(w,n,d)=>`<span class="mix"><b>${w}</b>${F(n,d)}</span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function simpNote(n,d){const [x,y]=simp(n,d);if(y===1)return ` = <b>${x}</b>`;if(x!==n)return ` = ${F(x,y)} <span class="muted">(simplificada)</span>`;return '';}
function coprime(bmin,bmax,improper){let a,b;do{b=rnd(bmin,bmax);a=rnd(1,improper?b+3:b-1);}while(gcd(a,b)!==1||a===b);return [a,b];}
const fmtDec=x=>String(+x.toFixed(6)).replace('.',',');
const strip=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');

/* noms interculturals: pakistanesos, marroquins, catalans, espanyols, romanesos i xinesos */
const PEOPLE=[
  ['Ayesha','f'],['Hamza','m'],['Zainab','f'],['Bilal','m'],['Hira','f'],['Usman','m'],
  ['Yassin','m'],['Salma','f'],['Imane','f'],['Ayoub','m'],['Nour','f'],['Youssef','m'],
  ['Pol','m'],['Laia','f'],['Jordi','m'],['Núria','f'],['Arnau','m'],['Mireia','f'],
  ['Lucía','f'],['Pablo','m'],['Sergio','m'],['Carmen','f'],['Álvaro','m'],['Marta','f'],
  ['Andrei','m'],['Ioana','f'],['Mihai','m'],['Elena','f'],['Bogdan','m'],['Alina','f'],
  ['Wei','m'],['Mei','f'],['Hao','m'],['Lin','f'],['Jun','m'],['Yan','f']];
const art=([n,g])=>/^[AÀÁEÉÈIÍOÓÒUÚH]/i.test(n)?`l'${n}`:(g==='m'?`en ${n}`:`la ${n}`);
const Art=p=>{const s=art(p);return s[0].toUpperCase()+s.slice(1);};
const people=k=>shuffle(PEOPLE).slice(0,k);

/* =========================================================
   NOMS EN CATALÀ (dossier pàg. 3)
   ========================================================= */
const NUM=['zero','un','dos','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou','vint'];
const DEN={2:['mig','mitjos'],3:['terç','terços'],4:['quart','quarts'],5:['cinquè','cinquens'],6:['sisè','sisens'],7:['setè','setens'],8:['vuitè','vuitens'],9:['novè','novens'],10:['desè','desens'],
  11:['onzè','onzens'],12:['dotzè','dotzens'],13:['tretzè','tretzens'],14:['catorzè','catorzens'],15:['quinzè','quinzens'],16:['setzè','setzens'],17:['dissetè','dissetens'],18:['divuitè','divuitens'],19:['dinovè','dinovens']};
const CAST={2:'medios',3:'tercios',4:'cuartos',5:'quintos',6:'sextos',7:'séptimos',8:'octavos',9:'novenos',10:'décimos'};
const nameF=(n,d)=>`${NUM[n]} ${DEN[d][n===1?0:1]}`;
const normW=s=>String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[-.,;:!?«»"]/g,' ').replace(/\s+/g,' ').trim();
function acceptedNames(n,d){const s=[nameF(n,d)];if(n===1){s.push('u '+DEN[d][0]);if(d===2)s.push('la meitat','meitat','mig');}return s.map(normW);}
function checkWords(n,d,input){const v=normW(input),acc=acceptedNames(n,d);
  if(acc.includes(v))return {ok:true};
  if(acc.map(strip).includes(strip(v)))return {ok:true,msg:`Correcte! Però compte amb els accents: s'escriu <b>«${nameF(n,d)}»</b>.`};
  const sv=strip(v);let m='';
  if(/cuart|terci|quint|sext|septim|octav|decimo|medio|avo/.test(sv))m='Això és castellà! 😉';
  else if(/^dues /.test(sv))m='El numerador va en masculí: «dos», no «dues».';
  else if(n>1&&sv===strip(normW(NUM[n]+' '+DEN[d][0])))m='Quan el numerador és més gran que 1, el denominador va en <b>plural</b>.';
  else if(n===1&&sv===strip(normW('un '+DEN[d][1])))m='Quan el numerador és 1, el denominador va en <b>singular</b>.';
  return {ok:false,msg:(m?m+'<br>':'')+`La teva resposta: «${esc(input)}»`};}

/* =========================================================
   FIGURES SVG
   ========================================================= */
function pieOne(d,k,cx,cy,r,inter,u){
  if(d===1)return `<circle cx="${cx}" cy="${cy}" r="${r}" class="seg ${k>=1?'on':''}" ${inter?`data-i="${u}"`:''}/>`;
  let s='';for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    s+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" class="seg ${i<k?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;}
  return s;}
function piesSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const r=60,g=22,w=units*2*r+(units-1)*g+8,h=2*r+8;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,${units*170}px)" role="img" aria-label="cercles dividits en ${d} parts">`;
  for(let u=0;u<units;u++){const k=inter?0:Math.max(0,Math.min(d,n-u*d));s+=pieOne(d,k,4+r+u*(2*r+g),4+r,r,inter,u);}
  return s+'</svg>';}
function barsSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const W=360,H=48,g=14,h=units*H+(units-1)*g+6,sw=W/d;
  let s=`<svg viewBox="0 0 ${W+6} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,480px)" role="img" aria-label="barra dividida en ${d} parts">`;
  for(let u=0;u<units;u++){const y=3+u*(H+g),k=inter?0:Math.max(0,Math.min(d,n-u*d));
    for(let i=0;i<d;i++)s+=`<rect x="${(3+i*sw).toFixed(2)}" y="${y}" width="${sw.toFixed(2)}" height="${H}" class="seg ${i<k?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;}
  return s+'</svg>';}
/* rectangle de cols×rows; es pinta per columnes (com al dossier pàg. 10) o amb una llista d'índexs */
function rectSVG(cols,rows,on,inter=false,maxw=360){const W=300,H=170,cw=W/cols,ch=H/rows;
  let s=`<svg viewBox="0 0 ${W+8} ${H+8}" class="fig ${inter?'interactive':''}" style="width:min(100%,${maxw}px)" role="img" aria-label="rectangle dividit en ${cols*rows} parts">`;
  for(let c=0;c<cols;c++)for(let r=0;r<rows;r++){const i=c*rows+r,p=inter?false:(Array.isArray(on)?on.includes(i):i<on);
    s+=`<rect x="${(4+c*cw).toFixed(2)}" y="${(4+r*ch).toFixed(2)}" width="${cw.toFixed(2)}" height="${ch.toFixed(2)}" class="seg ${p?'on':''}" ${inter?`data-i="${i}"`:''}/>`;}
  s+=`<rect x="4" y="4" width="${W}" height="${H}" class="outline"/>`;
  return s+'</svg>';}
function barCustom(w,p){const W=360,H=60,T=w.reduce((a,b)=>a+b,0);let x=3,s=`<svg viewBox="0 0 ${W+6} ${H+6}" class="fig" style="width:min(100%,480px)" role="img" aria-label="barra">`;
  w.forEach((v,i)=>{const ww=W*v/T;s+=`<rect x="${x.toFixed(2)}" y="3" width="${ww.toFixed(2)}" height="${H}" class="seg ${i===p?'on':''}"/>`;x+=ww;});return s+'</svg>';}
function lineSVG(d,U,opt={}){const W=600,x0=30,x1=570,tot=U*d,step=(x1-x0)/tot;
  let s=`<svg viewBox="0 0 ${W} 112" class="fig ${opt.mark==null?'interactive':''}" style="width:100%;max-width:640px" data-x0="${x0}" data-step="${step}" role="img" aria-label="recta numèrica">`;
  s+=`<line x1="${x0}" y1="52" x2="${x1}" y2="52" class="axis"/>`;
  for(let i=0;i<=tot;i++){const x=x0+i*step,big=i%d===0;s+=`<line x1="${x}" y1="${big?32:42}" x2="${x}" y2="${big?72:62}" class="tick ${big?'big':''}"/>`;if(big)s+=`<text x="${x}" y="102" class="lbl">${i/d}</text>`;}
  if(opt.mark!=null)s+=`<path transform="translate(${x0+opt.mark*step},40)" d="M0,0 L-12,-22 L12,-22 Z" class="mk"/>`;
  else{for(let i=1;i<tot;i++){const x=x0+i*step;s+=`<rect x="${x-step/2}" y="6" width="${step}" height="80" class="hit" data-i="${i}"/>`;}
    s+=`<path class="mk marker" d="M0,0 L-12,-22 L12,-22 Z" style="display:none"/><circle class="mk-ok okmark" r="10" cy="52" style="display:none"/>`;}
  return s+'</svg>';}
function padlock(open=false,cls='c-lock'){return `<svg viewBox="0 0 100 120" class="${cls} ${open?'open':''}" aria-hidden="true">
  <g class="shackle"><path d="M28 58 V38 a22 22 0 0 1 44 0 V${open?44:58}" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></g>
  <rect x="12" y="54" width="76" height="60" rx="12" fill="var(--accent)" stroke="currentColor" stroke-width="6"/>
  <circle cx="50" cy="79" r="8" fill="currentColor"/><rect x="46" y="82" width="8" height="18" rx="3" fill="currentColor"/></svg>`;}

const RM=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function typeAll(root){if(RM())return;root.querySelectorAll('.say .txt:not([data-typed])').forEach(el=>{el.dataset.typed='1';
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const nodes=[];let n;while((n=w.nextNode()))nodes.push([n,n.nodeValue]);
  const total=nodes.reduce((a,[,t])=>a+t.length,0);if(!total)return;nodes.forEach(([nd])=>nd.nodeValue='');
  const rb=el.closest('.bot')&&el.closest('.bot').querySelector('.robot');if(rb)rb.classList.add('talking');
  const step=Math.max(1,Math.ceil(total/65));let shown=0;
  const iv=setInterval(()=>{shown+=step;let left=shown;for(const [nd,t] of nodes){nd.nodeValue=t.slice(0,Math.max(0,Math.min(t.length,left)));left-=t.length;}
    if(shown>=total){clearInterval(iv);if(rb)rb.classList.remove('talking');}},18);});}

function mc(prompt,correct,distr,extra={}){const opts=shuffle([correct,...distr.slice(0,3)]);return Object.assign({kind:'mc',prompt,options:opts,correct:opts.indexOf(correct)},extra);}
function uniqFr(correct,cands,n=3){const seen=new Set([correct.join('/')]);const out=[];for(const p of shuffle(cands)){if(!p||p[1]<2||p[0]<1)continue;const k=p.join('/');if(seen.has(k))continue;seen.add(k);out.push(F(p[0],p[1]));if(out.length===n)break;}return out;}
const RECT={4:[[2,2]],6:[[3,2],[2,3]],8:[[4,2]],9:[[3,3]],10:[[5,2]],12:[[4,3],[3,4]],15:[[5,3]],16:[[4,4]]};
const rectDims=d=>RECT[d]?pick(RECT[d]):[d,1];
function figStatic(kind,d,n){if(kind==='pie')return piesSVG(d,n);if(kind==='rect'){const [c,r]=rectDims(d);return rectSVG(c,r,shuffle([...Array(d).keys()]).slice(0,n));}return barsSVG(d,n);}

  ()=>{const b=pick([2,4,5,10]),a=rnd(1,b-1);return {t:`🥛 Un cartró de llet té 1000 ml. Si te'n beus ${F(a,b)}, quants ml t'has begut?`,a,b,q:1000,u:'ml'};},
  ()=>{const b=pick([2,3,4]),a=rnd(1,b-1);return {t:`📱 El mòbil té 24 hores de bateria i en gastes ${F(a,b)} jugant. Quantes hores has jugat?`,a,b,q:24,u:'hores'};}];
  const c=pick(C)(),r=c.a*c.q/c.b;
  return {kind:'num',prompt:c.t,ans:r,hint:`Divideix ${c.q} entre ${c.b} i multiplica per ${c.a}.`,
    explain:`${F(c.a,c.b)} de ${c.q}: es pot fer de dues maneres (dossier pàg. 6):<br>(${c.q} · ${c.a}) : ${c.b} = ${c.q*c.a} : ${c.b} = <b>${r}</b><br>(${c.q} : ${c.b}) · ${c.a} = ${c.q/c.b} · ${c.a} = <b>${r} ${c.u}</b>`};}

/* ---------- SALA 4 · Pròpies o impròpies? (pàg. 7–8) ---------- */
function s4_class(){const t=rnd(0,2);let n,d;
  if(t===0){d=rnd(3,12);n=rnd(1,d-1);}else if(t===1){d=rnd(2,9);n=rnd(d+1,Math.min(2*d+3,3*d-1));if(n%d===0)n++;}else{d=rnd(2,12);n=d;}
  const why=[`${n} &lt; ${d}: el numerador és més petit → <b>pròpia</b>. ${F(n,d)} = ${fmtDec(n/d)} &lt; 1`,`${n} &gt; ${d}: el numerador és més gran → <b>impròpia</b>. ${F(n,d)} = ${fmtDec(+(n/d).toFixed(3))} &gt; 1`,`${n} = ${d}: numerador i denominador iguals → <b>igual a la unitat</b>. ${F(n,d)} = 1`];
  return {kind:'mc',prompt:`Quin tipus de fracció és ${F(n,d)}?`,options:['Pròpia (menys que 1)','Impròpia (més que 1)','Igual a la unitat'],correct:t,
    hint:'Compara el numerador amb el denominador.',explain:why[t]+`<div class="mini">${piesSVG(d,n)}</div>`};}
function s4_pick(){const want=Math.random()<.5?'pròpies':'impròpies';let items;
  do{items=[];const seen=new Set();while(items.length<6){const d=rnd(2,9),n=rnd(1,2*d+2);if(n===d)continue;const k=n+'/'+d;if(seen.has(k))continue;seen.add(k);items.push([n,d]);}}
  while(!items.some(([n,d])=>n<d)||!items.some(([n,d])=>n>d));
  const set=items.map(([n,d],i)=>(want==='pròpies'?n<d:n>d)?i:-1).filter(i=>i>=0);
  return {kind:'pick',items,want:set,prompt:`Toca <b>totes</b> les cartes amb fraccions <b>${want}</b>.`,hint:want==='pròpies'?'Pròpia: numerador MÉS PETIT que el denominador.':'Impròpia: numerador MÉS GRAN que el denominador.',
    explain:`Són ${want}: ${set.map(i=>F(...items[i])).join(' ')}<br>${want==='pròpies'?'Numerador &lt; denominador → valen menys que 1.':'Numerador &gt; denominador → valen més que 1.'}`};}
function s4_toMixed(){const d=rnd(2,8);let n;do{n=rnd(d+1,4*d-1);}while(n%d===0);const w=Math.floor(n/d),r=n%d;
  return {kind:'mixed',prompt:`Escriu ${F(n,d)} com un <b>nombre mixt</b>.`,visual:piesSVG(d,n),ans:[w,r,d],hint:`Quantes vegades cap ${d} dins de ${n}? Això són les unitats senceres. El que sobra va a la fracció.`,
    explain:`${n} : ${d} = ${w} i sobren ${r}.<br>${F(n,d)} = ${w>1?F(w*d,d)+' + ':F(d,d)+' + '}${F(r,d)} = ${w} + ${F(r,d)} = ${MIX(w,r,d)}`};}
function s4_fromMixed(){const w=rnd(1,3),d=rnd(2,8),r=rnd(1,d-1),n=w*d+r;
  return {kind:'frac',equiv:true,prompt:`Escriu el nombre mixt ${MIX(w,r,d)} com una fracció impròpia.`,ans:[n,d],visual:piesSVG(d,n),hint:`Cada unitat són ${d} parts. Quantes parts hi ha en total?`,
    explain:`${w} unitat${w>1?'s':''} = ${F(w*d,d)}. Hi sumem ${F(r,d)}: ${F(w*d,d)} + ${F(r,d)} = <b>${F(n,d)}</b><br><span class="muted">Truc: ${w} · ${d} + ${r} = ${n}</span>`};}
function s4_readPies(){const d=rnd(3,6),n=rnd(d+1,Math.min(3*d-1,2*d+2));
  return {kind:'frac',equiv:true,prompt:'Cada cercle és <b>una unitat</b>. Quina fracció representa tota la part pintada?',visual:piesSVG(d,n),ans:[n,d],
    hint:`Cada cercle té ${d} parts (denominador). Compta TOTES les parts pintades.`,explain:`Cada unitat té ${d} parts i n'hi ha ${n} de pintades: ${F(n,d)}, una fracció <b>impròpia</b> (més gran que 1).`};}
function s4_paintImp(){const d=rnd(3,5),n=rnd(d+1,2*d-1),fig=pick(['bar','pie']);
  return {kind:'paint',fig,d,cols:d,rows:1,units:2,target:n,prompt:`Pinta ${F(n,d)}. Cada figura és una unitat.`,hint:`Una unitat sencera són ${d} parts. En necessites ${n}!`,
    explain:`${F(n,d)} = ${F(d,d)} + ${F(n-d,d)}: omplim una unitat sencera i en pintem ${n-d} més a la segona.<div class="mini">${fig==='pie'?piesSVG(d,n):barsSVG(d,n)}</div>`};}

/* ---------- SALA 5 · La recta real (pàg. 9) ---------- */
function s5_line(){const d=rnd(2,6),U=pick([1,2].concat(d<=4?[3]:[]));let n;do{n=rnd(1,U*d-1);}while(n%d===0&&Math.random()<.85);
  return {kind:'line',d,U,target:n,prompt:`Situa ${F(n,d)} a la recta. Toca la marca correcta.`,hint:`Cada unitat està dividida en <b>${d}</b> parts. Compta ${n} marques des del 0.`,
    explain:`Dividim cada unitat en ${d} parts i comptem <b>${n}</b> des del 0.${n>d?` Com que és impròpia, passa de l'1.`:' Com que és pròpia, queda entre 0 i 1.'}<div class="mini">${lineSVG(d,U,{mark:n})}</div>`};}
function s5_lineRead(){const d=rnd(2,6),U=pick([1,2].concat(d<=4?[3]:[]));let n;do{n=rnd(1,U*d-1);}while(n%d===0);
  return {kind:'frac',equiv:true,prompt:'Quina fracció assenyala la fletxa?',visual:lineSVG(d,U,{mark:n}),ans:[n,d],hint:'Compta en quantes parts es divideix cada unitat (denominador) i quantes n\'hi ha des del 0 fins a la fletxa (numerador).',
    explain:`Cada unitat té ${d} parts i la fletxa és a ${n} parts del 0: <b>${F(n,d)}</b>${simpNote(n,d)}`};}
function s5_between(){const d=rnd(2,8);let n;do{n=rnd(1,4*d-1);}while(n%d===0);const w=Math.floor(n/d);
  return {kind:'mc',prompt:`Entre quins dos nombres naturals es troba ${F(n,d)}?`,options:['Entre 0 i 1','Entre 1 i 2','Entre 2 i 3','Entre 3 i 4'],correct:w,hint:'Fes la divisió o passa-la a nombre mixt.',
    explain:`${F(n,d)} = ${n} : ${d} = ${fmtDec(+(n/d).toFixed(3))}, que està entre <b>${w} i ${w+1}</b>.${n<d?' És pròpia: entre 0 i 1.':''}`};}
function s5_lineMixed(){const d=rnd(2,4),w=rnd(1,2),r=rnd(1,d-1),U=w+1,n=w*d+r;
  return {kind:'line',d,U,target:n,prompt:`Situa el nombre mixt ${MIX(w,r,d)} a la recta.`,hint:`Primer avança ${w} unitat${w>1?'s':''} sencera${w>1?'s':''} i després ${r} parts més.`,
    explain:`${MIX(w,r,d)} = ${F(n,d)}: passem ${w} unitat${w>1?'s':''} i comptem ${r} parts més.<div class="mini">${lineSVG(d,U,{mark:n})}</div>`};}

/* ---------- SALA 6 · Bessones: equivalents (pàg. 10–11) ---------- */
function eqBase(){let a,b,k;do{[a,b]=coprime(2,6,false);k=rnd(2,4);}while(b*k>24);return [a,b,k];}
function s6_eqPaint(){const [a,b,k]=eqBase();
  return {kind:'paint',fig:'rect',cols:b,rows:k,d:b*k,units:1,target:a*k,
    ref:`<div class="eqref"><div class="eqlab">${F(a,b)}</div>${rectSVG(b,1,a)}</div><div class="cardlab">⬇️ Pinta aquí la mateixa quantitat (${F('?',b*k)})</div>`,
    prompt:`Pinta a la figura de baix <b>la mateixa quantitat</b> que a la de dalt.`,hint:`Cada columna de dalt ara està partida en ${k} trossos. Pinta les mateixes columnes senceres!`,
    explain:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F(a*k,b*k)}${rectSVG(b,k,a*k)}</div></div>Ocupen el mateix espai: són <b>equivalents</b>.<br>${F(a,b)} → ${F(a+' · '+k,b+' · '+k)} = ${F(a*k,b*k)} (hem <b>amplificat</b> per ${k}).`};}
function s6_eqCheck(){const [a,b,k]=eqBase();const eq=Math.random()<.5;const d=b*k;let c=a*k;if(!eq){do{c=rnd(1,d-1);}while(c===a*k);}
  return {kind:'mc',prompt:`Són equivalents ${F(a,b)} i ${F(c,d)}? Mira les figures.`,visual:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F(c,d)}${rectSVG(b,k,c)}</div></div>`,
    options:['Sí, són equivalents','No, no són equivalents'],correct:eq?0:1,hint:'Ocupen la mateixa quantitat de figura? També pots multiplicar en creu.',
    explain:`Multipliquem en creu: ${a} · ${d} = <b>${a*d}</b> i ${b} · ${c} = <b>${b*c}</b>. ${eq?'Surt el mateix → <b>són equivalents</b>.':'Surt diferent → <b>no</b> són equivalents.'}`};}
function s6_missing(){const [a,b,k]=eqBase();
  if(Math.random()<.65)return {kind:'num',prompt:`Completa perquè siguin equivalents: ${F(a,b)} = ${F('?',b*k)}`,visual:`<div class="eqpair"><div>${F(a,b)}${rectSVG(b,1,a)}</div><div>${F('?',b*k)}${rectSVG(b,k,0)}</div></div>`,
    ans:a*k,hint:`${b} · ? = ${b*k}. Multiplica el numerador pel mateix nombre.`,explain:`${b} · <b>${k}</b> = ${b*k}, per tant ${a} · <b>${k}</b> = <b>${a*k}</b>.<br>${F(a,b)} = ${F(a*k,b*k)}<div class="mini">${rectSVG(b,k,a*k)}</div>`};
  return {kind:'num',prompt:`Completa perquè siguin equivalents: ${F(a*k,b*k)} = ${F(a,'?')}`,ans:b,hint:`Per quin nombre has dividit ${a*k} per obtenir ${a}? Fes el mateix a baix.`,
    explain:`${a*k} : <b>${k}</b> = ${a}, per tant ${b*k} : <b>${k}</b> = <b>${b}</b> (hem <b>simplificat</b>).`};}
function s6_pick(){const [a,b]=coprime(2,7,false),k=rnd(2,5);
  const cands=[[a+k,b+k],[k*a,b],[a,k*b],[k*a+1,k*b],[k*a,k*b+1],[a+1,b+1]].filter(([x,y])=>x*b!==a*y);
  return mc(`Quina fracció és <b>equivalent</b> a ${F(a,b)}?`,F(k*a,k*b),uniqFr([k*a,k*b],cands),{hint:'Busca la que s\'obté multiplicant dalt i baix pel mateix nombre.',
    explain:`${F(a,b)} = ${F(a+' · '+k,b+' · '+k)} = ${F(k*a,k*b)}. <br>⚠️ Sumar el mateix nombre a dalt i a baix <b>no</b> dona una fracció equivalent.${b*k<=24?`<div class="eqpair"><div>${rectSVG(b,1,a)}</div><div>${rectSVG(b,k,a*k)}</div></div>`:''}`});}
function s6_simplify(){let a,b,k;do{[a,b]=coprime(2,6,false);k=rnd(2,4);}while(b*k>24);const n=a*k,d=b*k;
  return {kind:'frac',prompt:`<b>Simplifica</b> fins que no es pugui més: ${F(n,d)}`,ans:[a,b],
    check:(x,y)=>{if(x===a&&y===b)return {ok:true};if(x*d===n*y)return {ok:false,msg:`${F(x,y)} és equivalent, però encara es pot simplificar més!`};return {ok:false};},
    hint:`Divideix ${n} i ${d} pel mateix nombre (prova 2, 3, 5...).`,
    explain:`${F(n,d)} → ${F(n+' : '+k,d+' : '+k)} = <b>${F(a,b)}</b><div class="eqpair"><div>${rectSVG(b,k,n)}</div><div>${rectSVG(b,1,a)}</div></div>Mateixa quantitat, menys trossos.`};}

/* ---------- SALA 7 · La partida de cartes (pàg. 11–12) ---------- */
function s7_cards(){const N=rnd(4,5),asc=Math.random()<.5,v=rnd(0,2);let cards=[];const seen=new Set();
  const add=(n,d)=>{const k=(n/d).toFixed(9);if(seen.has(k))return;seen.add(k);cards.push([n,d]);};
  let g=0;const dd=rnd(6,12),nn=rnd(1,3);
  while(cards.length<N&&g++<999){if(v===0)add(rnd(1,dd+1),dd);else if(v===1){const d=rnd(nn+1,12);add(nn,d);}else{const d=pick([2,3,4,5,6,8,10,12]);add(rnd(1,d),d);}}
  const order=cards.map((c,i)=>i).sort((i,j)=>asc?cards[i][0]/cards[i][1]-cards[j][0]/cards[j][1]:cards[j][0]/cards[j][1]-cards[i][0]/cards[i][1]);
  const sign=asc?'&lt;':'&gt;';let m=cards.reduce((a,[,d])=>lcm(a,d),1);
  const how=v===0?'Tenen el <b>mateix denominador</b>: només cal comparar els numeradors.':v===1?'Tenen el <b>mateix numerador</b>: com més parts es fa la unitat, més petit és cada tros. És més gran la de denominador més petit.':
    (m<=60?`Busquem fraccions equivalents amb el <b>mateix denominador</b> (${m}) i comparem numeradors:<br>${cards.map(([n,d])=>`${F(n,d)} = ${F(n*m/d,m)}`).join(' &nbsp; ')}`:'Les passem a decimal i les comparem.');
  return {kind:'cards',cards,order,asc,prompt:`Ordena les cartes de <b>${asc?'més petita a més gran':'més gran a més petita'}</b>. Toca-les per ordre.`,hint:v===0?'Mateix denominador → mira els numeradors.':v===1?'Mateix numerador → com més gran el denominador, més petita la fracció.':'Busca un denominador comú, o fes les divisions.',
    explain:`${how}<br>Ordre correcte: ${order.map(i=>F(...cards[i])).join(` ${sign} `)}`};}
function s7_compare(){let a,b,c,d;const t=rnd(0,2);
  if(t===0){b=d=rnd(4,10);a=rnd(1,b-1);do{c=rnd(1,d-1);}while(c===a);}
  else if(t===1){a=c=rnd(1,4);b=rnd(a+1,10);do{d=rnd(c+1,10);}while(d===b);}
  else{b=rnd(2,8);a=rnd(1,b-1);if(Math.random()<.3){const k=rnd(2,3);c=a*k;d=b*k;}else{d=rnd(2,10);c=rnd(1,d-1);}if(d===b&&c===a){d=b+1;c=rnd(1,d-1);}}
  const L=a*d,R=c*b,ci=L>R?0:L<R?1:2;
  const ex=t===0?'Mateix denominador: és més gran la de numerador més gran.':t===1?'Mateix numerador: com més trossos, més petits. És més gran la de denominador més petit.':`Multipliquem en creu: ${a} · ${d} = <b>${L}</b> i ${c} · ${b} = <b>${R}</b>.${ci===2?' Són iguals: són equivalents!':''}`;
  return {kind:'mc',prompt:'Quin signe hi va? Fixa\'t en les barres.',visual:`<div class="cmp"><div class="cmp-row"><div class="cmp-f">${F(a,b)}</div>${barsSVG(b,a)}</div><div class="cmp-row"><div class="cmp-f">${F(c,d)}</div>${barsSVG(d,c)}</div></div>`,
    options:[`${F(a,b)} &gt; ${F(c,d)}`,`${F(a,b)} &lt; ${F(c,d)}`,`${F(a,b)} = ${F(c,d)}`],correct:ci,hint:'Compara quanta barra taronja hi ha a cada fila.',explain:ex};}

function s7_who(){const [P,Q]=shuffle(PEOPLE).slice(0,2);const W=pick([['de pizza','ha menjat'],['de la seva rajola de xocolata','ha menjat'],['del seu llibre','ha llegit'],['de la seva ampolla d\'aigua','ha begut']]);
  let a,b,c,d;do{b=pick([2,3,4,5,6,8]);d=pick([2,3,4,5,6,8]);a=rnd(1,b-1);c=rnd(1,d-1);}while(b===d&&a===c);
  const L=a*d,R=c*b,ci=L>R?0:L<R?1:2;const verb=W[1];
  return {kind:'mc',prompt:`${Art(P)} ${verb} ${F(a,b)} ${W[0]} i ${art(Q)}, ${F(c,d)}. Qui n'${verb} més?`,
    visual:`<div class="pies2"><div><div class="who">${P[0]}</div>${piesSVG(b,a)}</div><div><div class="who">${Q[0]}</div>${piesSVG(d,c)}</div></div>`,
    options:[Art(P),Art(Q),P[1]==='f'&&Q[1]==='f'?'Totes dues igual':'Tots dos igual'],correct:ci,hint:'Mira els dibuixos, o busca fraccions amb el mateix denominador.',
    explain:`Mateix denominador: ${F(a,b)} = ${F(a*lcm(b,d)/b,lcm(b,d))} i ${F(c,d)} = ${F(c*lcm(b,d)/d,lcm(b,d))}. ${ci===2?'Són iguals!':`N'${verb} més <b>${ci===0?art(P):art(Q)}</b>.`}`};}

/* ---------- SALA 8 · Suma i resta (pàg. 13–14) ---------- */
function opEx(a1,d1,a2,d2,plus){const op=plus?'+':'−';
  if(d1===d2){const n=plus?a1+a2:a1-a2;return {n,d:d1,html:`Mateix denominador: ${plus?'se sumen':'es resten'} els numeradors i es manté el denominador.<br>${F(a1,d1)} ${op} ${F(a2,d2)} = ${F(a1+' '+op+' '+a2,d1)} = ${F(n,d1)}${simpNote(n,d1)}`};}
  const m=lcm(d1,d2),e1=a1*m/d1,e2=a2*m/d2,n=plus?e1+e2:e1-e2;
  return {n,d:m,html:`<b>1r</b> m.c.m.(${d1}, ${d2}) = ${m}<br><b>2n</b> Arreglem els numeradors: ${F(a1,d1)} = ${F(e1,m)} i ${F(a2,d2)} = ${F(e2,m)}<br><b>3r</b> ${plus?'Sumem':'Restem'}: ${F(e1,m)} ${op} ${F(e2,m)} = ${F(n,m)}<br><b>4t</b> Simplifiquem: ${simpNote(n,m)?simpNote(n,m).replace(/^ = /,''):'no es pot simplificar.'}`};}
function s8_same(){const d=rnd(3,12),plus=Math.random()<.55;let a,b;if(plus){a=rnd(1,d-1);b=rnd(1,d-1);}else{a=rnd(2,d);b=rnd(1,a-1);}
  const r=opEx(a,d,b,d,plus);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,d)} ${plus?'+':'−'} ${F(b,d)}`,ans:[r.n,r.d],hint:'Mateix denominador. Què fas amb els numeradors? I amb el denominador?',
    explain:r.html+(r.n<=d?`<div class="mini">${barsSVG(d,r.n)}</div>`:'')+`⚠️ Mai no ${plus?'sumis':'restis'} els denominadors!`};}
const DENS=[2,3,4,5,6,8,10,12];
function s8_diff(){let d1,d2;do{d1=pick(DENS);d2=pick(DENS);}while(d1===d2||lcm(d1,d2)>30);
  let a1=rnd(1,d1-1),a2=rnd(1,d2-1);const plus=Math.random()<.55;
  if(!plus&&a1*d2===a2*d1)return s8_diff();
  if(!plus&&a1*d2<a2*d1){[a1,d1,a2,d2]=[a2,d2,a1,d1];}
  const r=opEx(a1,d1,a2,d2,plus);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a1,d1)} ${plus?'+':'−'} ${F(a2,d2)}`,ans:[r.n,r.d],hint:`Primer el m.c.m. de ${d1} i ${d2}. Després arregla els numeradors.`,explain:r.html};}
function s8_three(){const d=rnd(5,12);const a=rnd(1,d-2),b=rnd(1,d-1),c=rnd(1,d-1);const n=a+b+c;
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,d)} + ${F(b,d)} + ${F(c,d)}`,ans:[n,d],hint:'Totes tenen el mateix denominador: suma els tres numeradors.',explain:`${F(a+' + '+b+' + '+c,d)} = ${F(n,d)}${simpNote(n,d)}`};}
function pf(dens){const d=pick(dens);return [rnd(1,d-1),d];}
function s8_daily(){const t=rnd(0,5);
  if(t===0){let a,b,c;do{a=rnd(1,3);b=rnd(1,3);c=rnd(1,2);}while(a+b+c>7);const s=a+b+c,left=8-s;
    const [A,B,C,D]=people(4);return {kind:'frac',equiv:true,prompt:`🍕 D'una pizza de 8 trossos, ${art(A)} en pren ${F(a,8)}, ${art(B)} ${F(b,8)} i ${art(C)} ${F(c,8)}. Quanta pizza queda per a ${art(D)}, que ha arribat tard?`,ans:[left,8],
      hint:'Suma el que s\'han menjat i resta-ho de la pizza sencera, que és 8/8.',explain:`Han menjat ${F(a+' + '+b+' + '+c,8)} = ${F(s,8)}. Queda ${F(8,8)} − ${F(s,8)} = <b>${F(left,8)}</b>${simpNote(left,8)}<div class="mini">${piesSVG(8,left)}</div>`};}
  let a1,d1,a2,d2;const G=cond=>{do{[a1,d1]=pf([2,3,4,6,8]);[a2,d2]=pf([2,3,4,6,8]);}while(!cond());};
  if(t===1){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true);
    return {kind:'frac',equiv:true,prompt:`📚 ${Art(people(1)[0])} fa ${F(a1,d1)} dels deures abans de sopar i ${F(a2,d2)} després. Quina part dels deures ha fet?`,ans:[r.n,r.d],hint:'Has de sumar les dues parts.',explain:r.html};}
  if(t===2){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true);
    return {kind:'frac',equiv:true,prompt:`💶 De la paga, gastes ${F(a1,d1)} al cine i ${F(a2,d2)} en berenar. Quina part de la paga has gastat?`,ans:[r.n,r.d],hint:'Suma les dues parts.',explain:r.html};}
  if(t===3){G(()=>a1*d2>a2*d1);const r=opEx(a1,d1,a2,d2,false);
    return {kind:'frac',equiv:true,prompt:`🔋 El mòbil tenia ${F(a1,d1)} de bateria. Després de mirar vídeos, en té ${F(a2,d2)}. Quina part de la bateria has gastat?`,ans:[r.n,r.d],hint:'Resta el que tens ara del que tenies.',explain:r.html};}
  if(t===4){G(()=>a1*d2+a2*d1<d1*d2);const r=opEx(a1,d1,a2,d2,true),left=r.d-r.n;
    return {kind:'frac',equiv:true,prompt:`💧 Tens una ampolla d'aigua plena. Te'n beus ${F(a1,d1)} al matí i ${F(a2,d2)} a la tarda. Quina part de l'ampolla queda?`,ans:[left,r.d],hint:'1r suma el que t\'has begut. 2n resta-ho de l\'ampolla sencera (1).',
      explain:`${r.html}<br>Queda: 1 − ${F(r.n,r.d)} = ${F(r.d,r.d)} − ${F(r.n,r.d)} = <b>${F(left,r.d)}</b>${simpNote(left,r.d)}`};}
  G(()=>d1!==d2);const r=opEx(a1,d1,a2,d2,true);
  return {kind:'frac',equiv:true,prompt:`🧁 Una recepta de magdalenes demana ${F(a1,d1)} kg de farina i ${F(a2,d2)} kg de sucre. Quants kg pesen junts?`,ans:[r.n,r.d],hint:'Suma les dues quantitats.',explain:r.html};}
function s8_int(){const b=rnd(2,8),a=rnd(1,b-1);const t=pick([`🎂 Del pastís ja se n'ha menjat ${F(a,b)}. Quina part en queda?`,`📖 Ja has llegit ${F(a,b)} del llibre. Quina part et queda per llegir?`,`Calcula: 1 − ${F(a,b)}`]);
  return {kind:'frac',equiv:true,prompt:t,ans:[b-a,b],hint:`La unitat sencera és ${F(b,b)}.`,explain:`1 = ${F(b,b)}. ${F(b,b)} − ${F(a,b)} = <b>${F(b-a,b)}</b>${simpNote(b-a,b)}`};}

/* ---------- SALA 9 · Producte i divisió (pàg. 14–15) ---------- */
function s9_mul(){const a=rnd(1,7),b=rnd(2,9),c=rnd(1,7),d=rnd(2,9);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} · ${F(c,d)}`,ans:[a*c,b*d],hint:'Producte en paral·lel: dalt per dalt i baix per baix.',explain:`Es multipliquen els numeradors entre si i els denominadors entre si:<br>${F(a+' · '+c,b+' · '+d)} = ${F(a*c,b*d)}${simpNote(a*c,b*d)}`};}
function s9_div(){const a=rnd(1,7),b=rnd(2,9),c=rnd(1,7),d=rnd(2,9);
  return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} : ${F(c,d)}`,ans:[a*d,b*c],hint:'Divisió: es multiplica en CREU (fent una X).',explain:`Producte en creu: dalt ${a} · ${d}, baix ${b} · ${c}:<br>${F(a+' · '+d,b+' · '+c)} = ${F(a*d,b*c)}${simpNote(a*d,b*c)}`};}
function s9_intOps(){const a=rnd(1,7),b=rnd(2,9),k=rnd(2,9),t=rnd(0,2);
  if(t===0)return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} · ${k}`,ans:[a*k,b],hint:`Escriu el ${k} com ${F(k,1)}.`,explain:`${F(a,b)} · ${F(k,1)} = ${F(a+' · '+k,b+' · 1')} = ${F(a*k,b)}${simpNote(a*k,b)}`};
  if(t===1)return {kind:'frac',equiv:true,prompt:`Calcula: ${F(a,b)} : ${k}`,ans:[a,b*k],hint:`Escriu el ${k} com ${F(k,1)} i multiplica en creu.`,explain:`${F(a,b)} : ${F(k,1)} = ${F(a+' · 1',b+' · '+k)} = ${F(a,b*k)}${simpNote(a,b*k)}`};
  return {kind:'frac',equiv:true,prompt:`Calcula: ${k} : ${F(a,b)}`,ans:[k*b,a],hint:`Escriu el ${k} com ${F(k,1)} i multiplica en creu.`,explain:`${F(k,1)} : ${F(a,b)} = ${F(k+' · '+b,'1 · '+a)} = ${F(k*b,a)}${simpNote(k*b,a)}`};}
function s9_divInt(){const b=pick([2,3,4,5]),a=rnd(1,b-1),k=pick([2,3,4,5]);const cells=[...Array(a).keys()].map(c=>c*k);
  const t=pick([`🍬 Volem repartir ${F(a,b)} d'una capsa de llaminadures entre ${k} amics. Quina part de la capsa li toca a cadascú?`,`🍕 Tens ${F(a,b)} de pizza i la reparteixes entre ${k} germans. Quina part de la pizza sencera toca a cadascú?`]);
  return {kind:'frac',equiv:true,prompt:t,ans:[a,b*k],hint:`Dividir entre ${k} és com fer ${F(a,b)} : ${F(k,1)}.`,
    explain:`${F(a,b)} : ${k} = ${F(a,b)} : ${F(k,1)} = ${F(a+' · 1',b+' · '+k)} = <b>${F(a,b*k)}</b>${simpNote(a,b*k)}<div class="eqpair"><div>${rectSVG(b,1,a)}</div><div>${rectSVG(b,k,cells)}</div></div>Cada columna pintada es parteix en ${k} trossos: a cada amic li toca una fila.`};}
function s9_daily(){const t=rnd(0,3);
  if(t===0){const [a,b]=pick([[1,2],[3,4],[2,3],[1,3]]),[c,d]=pick([[1,2],[1,3],[1,4],[2,3]]);
    return {kind:'frac',equiv:true,prompt:`🍕 De la pizza en queda ${F(a,b)}. Te'n menges ${F(c,d)} d'aquest tros. Quina part de la pizza <b>sencera</b> t'has menjat?`,ans:[a*c,b*d],hint:'«La fracció d\'una fracció» es calcula multiplicant.',explain:`${F(c,d)} de ${F(a,b)} → ${F(c,d)} · ${F(a,b)} = ${F(c+' · '+a,d+' · '+b)} = <b>${F(a*c,b*d)}</b>${simpNote(a*c,b*d)}`};}
  if(t===1){const k=pick([2,3,4,5]);let G;do{G=rnd(k+1,4*k);}while(G%k===0);const [a,b]=simp(G,k);
    return {kind:'num',prompt:`🧃 Tens ${F(a,b)} litres de suc i omples gots de ${F(1,k)} de litre. Quants gots pots omplir?`,ans:G,hint:'Quantes vegades hi cap un got? → Divisió.',explain:`${F(a,b)} : ${F(1,k)} = ${F(a+' · '+k,b+' · 1')} = ${F(a*k,b)} = <b>${G} gots</b>`};}
  if(t===2){const b=pick([3,4,5]),a=rnd(1,b-1),d=pick([2,3,4]),c=rnd(1,d-1);
    return {kind:'frac',equiv:true,prompt:`🔵 En una bossa de bales, ${F(a,b)} són blaves, i ${F(c,d)} de les blaves són transparents. Quina fracció del total són blaves transparents?`,ans:[a*c,b*d],hint:'«de les blaves» → multiplica.',explain:`${F(c,d)} de ${F(a,b)} = ${F(c+' · '+a,d+' · '+b)} = <b>${F(a*c,b*d)}</b>${simpNote(a*c,b*d)}`};}
  const b=pick([2,3,4]),a=rnd(1,b-1),k=pick([2,3]);
  return {kind:'frac',equiv:true,prompt:`🥤 ${people(k).map(art).join(', ').replace(/, ([^,]*)$/,' i $1').replace(/^./,c=>c.toUpperCase())} van d'excursió i cadascú porta ${F(a,b)} de litre d'aigua. Quants litres porten entre tots?`,ans:[a*k,b],hint:`${k} vegades ${F(a,b)} → multiplica.`,explain:`${F(a,b)} · ${k} = ${F(a+' · '+k,b)} = <b>${F(a*k,b)}</b>${simpNote(a*k,b)}`};}

const UKEY='escape-v2:u:';
let S=null,cur=null;
const userKey=(name,pin)=>UKEY+normTeam(name)+':'+pin;
const digitsFor=name=>ROOMS.map((_,i)=>h32('dig|'+normTeam(name)+'|'+i)%10);
function newState(name,pin,free){return {team:name,pin,free:!!free,mute:false,digits:digitsFor(name),rooms:ROOMS.map(()=>({done:false,correct:0,seen:false,err:0})),score:0,streak:0,best:0,ok:0,errors:0,hints:0,start:Date.now(),last:Date.now(),end:null,won:false};}
function save(){if(!S)return;S.last=Date.now();try{localStorage.setItem(userKey(S.team,S.pin),JSON.stringify(S));}catch(e){}}
function loadUser(name,pin){try{const v=localStorage.getItem(userKey(name,pin));return v?JSON.parse(v):null;}catch(e){return null;}}
function otherPinExists(name,pin){try{const pre=UKEY+normTeam(name)+':';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre)&&k!==pre+pin)return true;}}catch(e){}return false;}
function clearSave(){if(S)try{localStorage.removeItem(userKey(S.team,S.pin));}catch(e){}}
const FKEY='escape-v2-mode-lliure';
const getFree=()=>{try{return localStorage.getItem(FKEY)==='1';}catch(e){return false;}};

let AC=null;
let MASTER=null;
function ac(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=4;comp.connect(AC.destination);MASTER=AC.createGain();MASTER.gain.value=1;MASTER.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,t0,dur,type='triangle',vol=.18,f2){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.setValueAtTime(vol,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(MASTER);o.start(t);o.stop(t+dur+.05);}
const SFX={
  ok(){tone(784,0,.14,'triangle',.45);tone(1175,.12,.28,'triangle',.45);tone(1568,.12,.28,'sine',.15);},   /* ding-ding ascendent */
  err(){tone(415,0,.22,'square',.32);tone(415,0,.22,'triangle',.55);tone(311,.26,.45,'square',.32);tone(311,.26,.45,'triangle',.55);},  /* «oh-oh» fort i clar, descendent */
  tap(){tone(660,0,.05,'square',.04);},
  hint(){tone(988,0,.08,'sine',.1);tone(988,.1,.08,'sine',.1);},
  unlock(){tone(180,0,.05,'square',.12);tone(120,.06,.06,'square',.12);[523,659,784,1047].forEach((f,i)=>tone(f,.2+i*.11,.18,'triangle',.18));},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.13,.22,'triangle',.18));},
  lockFail(){tone(150,0,.12,'square',.1);tone(150,.16,.12,'square',.1);}};
function sfx(n){if(S&&S.mute)return;try{SFX[n]();}catch(e){}}

function confetti(n=170){const c=$('#confetti');let x=null;try{x=c.getContext('2d');}catch(e){}if(!x)return;c.width=innerWidth;c.height=innerHeight;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#ff6a00','#ffa25c','#000000','#ff8a2b','#c94f00'];
  const P=Array.from({length:n},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:5+Math.random()*7,a:Math.random()*6,va:(Math.random()-.5)*.3,col:pick(cols)}));
  let t=0;cancelAnimationFrame(confetti.raf);
  (function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.col;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<280)confetti.raf=requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();}

const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const normTeam=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function h32(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
const CSM=(1<<26)-1;
function makeCode(){const secs=Math.round(((S.end||Date.now())-S.start)/1000);let n=0n;
  const put=(v,b)=>{n=(n<<BigInt(b))|BigInt(Math.max(0,Math.min(Math.round(v)||0,2**b-1)));};
  put(1,2);put(S.won?1:0,1);put(S.free?1:0,1);put(S.score,11);put(secs,14);put(S.hints,6);put(S.best,5);
  S.rooms.forEach(r=>put(r.correct,3));S.rooms.forEach(r=>put(r.err||0,3));
  n=(n<<26n)|BigInt(h32('v2p|'+normTeam(S.team)+'|'+n.toString())&CSM);
  let s='';for(let i=0;i<24;i++){s=B32[Number(n&31n)]+s;n>>=5n;}return s.match(/.{4}/g).join('-');}
function readCode(name,code){const c=String(code).toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.length!==24)return null;
  let n=0n;for(const ch of c){const i=B32.indexOf(ch);if(i<0)return null;n=(n<<5n)|BigInt(i);}
  const cs=Number(n&BigInt(CSM));n>>=26n;if(cs!==(h32('v2p|'+normTeam(name)+'|'+n.toString())&CSM))return null;
  const take=b=>{const v=Number(n&BigInt(2**b-1));n>>=BigInt(b);return v;};
  const err=[],correct=[];for(let i=ROOMS.length-1;i>=0;i--)err[i]=take(3);for(let i=ROOMS.length-1;i>=0;i--)correct[i]=take(3);
  const best=take(5),hints=take(6),secs=take(14),score=take(11),free=take(1),won=take(1),ver=take(2);
  if(n!==0n||ver!==1||correct.some(c=>c>NEED))return null;
  return {won:!!won,free:!!free,score,secs,hints,best,correct,err,rd:correct.filter(c=>c>=NEED).length,ok:correct.reduce((a,b)=>a+b,0),errors:err.reduce((a,b)=>a+b,0)};}
function stateFromCode(name,pin,v){const s=newState(name,pin,v.free);
  s.rooms.forEach((r,i)=>{r.correct=v.correct[i];r.done=v.correct[i]>=NEED;r.seen=r.correct>0||r.done;r.err=v.err[i];});
  Object.assign(s,{score:v.score,hints:v.hints,best:v.best,ok:v.ok,errors:v.errors,won:v.won,start:Date.now()-v.secs*1000});if(v.won)s.end=Date.now();return s;}

  if(!/^\d{4}$/.test(pin)){say('oops','El codi personal ha de tenir <b>4 xifres</b>.');return;}
  ac();

function flash(msg){$('#fb').innerHTML=`<div class="fb warn">${msg}</div>`;}
function evaluate(q,ans){
  if(q.kind==='mc')return {ok:ans===q.correct};
  if(q.kind==='num')return {ok:ans===q.ans,msg:ans===q.ans?'':`La teva resposta: ${ans}`};
  if(q.kind==='dec')return {ok:Math.abs(ans-q.ans)<1e-9,msg:Math.abs(ans-q.ans)<1e-9?'':`La teva resposta: ${fmtDec(ans)}`};
  if(q.kind==='paint'||q.kind==='line')return {ok:ans===q.target};
  if(q.kind==='words')return checkWords(q.n,q.d,ans);
  if(q.kind==='cards'){const ok=ans.every((v,k)=>v===q.order[k]);return {ok};}
  if(q.kind==='pick'){const a=[...ans].sort((x,y)=>x-y),b=[...q.want].sort((x,y)=>x-y);return {ok:a.length===b.length&&a.every((v,k)=>v===b[k])};}
  if(q.kind==='mixed'){const [w,n,d]=ans,[W,N,D]=q.ans;if(w===W&&n*D===N*d&&n<d)return {ok:true,msg:(n!==N?`💡 Es pot simplificar: ${MIX(W,N,D)}`:'')};return {ok:false,msg:`La teva resposta: ${MIX(w,n,d)}`};}
  const [x,y]=ans;if(q.check){const r=q.check(x,y);if(!r.ok&&!r.msg)r.msg=`La teva resposta: ${F(x,y)}`;return r;}
  const [n,d]=q.ans;
  if((x===n&&y===d)||(q.equiv&&x*d===n*y)){const [sx,sy]=simp(x,y);return {ok:true,msg:gcd(x,y)>1?`💡 Encara la pots simplificar: ${sy===1?sx:F(sx,sy)}`:''};}
  return {ok:false,msg:`La teva resposta: ${F(x,y)}`};}
const isInt=v=>/^\d+$/.test(v);
function submit(val){if(!cur||cur.answered)return;const q=cur.q;let ans;
  if(q.kind==='mc')ans=val;
  else if(q.kind==='frac'||q.kind==='mixed'){const a=$('#an').value.trim(),b=$('#ad').value.trim();
    if(q.kind==='mixed'){const w=$('#mw').value.trim();if(!isInt(w)){flash('Escriu les unitats senceres (el nombre gran de l\'esquerra).');return;}}
    if(!isInt(a)){flash('Escriu un nombre al numerador (a dalt).');return;}
    if(!isInt(b)){if(q.kind==='frac'&&b===''){}else{flash('Escriu un nombre al denominador (a baix).');return;}}

const WB={strokes:[],curS:null,tool:'ink',ctx:null,c:null,dpr:1};

   <div class="wb-foot muted">Esborrany: s'esborra sol quan canvies de repte.</div>`;
  document.body.appendChild(p);WB.c=p.querySelector('canvas');WB.ctx=WB.c.getContext&&(()=>{try{return WB.c.getContext('2d');}catch(e){return null;}})();
  document.body.addEventListener('click',e=>{const b=e.target.closest('[data-wb]');if(!b)return;const a=b.dataset.wb;

function wbSize(){if(!WB.ctx)return;const r=$('#wbw').getBoundingClientRect();WB.dpr=window.devicePixelRatio||1;WB.c.width=Math.max(1,r.width*WB.dpr);WB.c.height=Math.max(1,r.height*WB.dpr);wbDraw();}
function wbDraw(){const x=WB.ctx;if(!x)return;x.setTransform(WB.dpr,0,0,WB.dpr,0,0);x.clearRect(0,0,WB.c.width,WB.c.height);

    const [x0,y0]=s.p[0];x.moveTo(x0,y0);if(s.p.length===1)x.lineTo(x0+.1,y0+.1);for(let i=1;i<s.p.length;i++)x.lineTo(s.p[i][0],s.p[i][1]);x.stroke();}
  x.globalCompositeOperation='source-over';}
function wbClear(){WB.strokes=[];WB.curS=null;wbDraw();const q=$('#wbq');if(q)q.innerHTML=cur&&cur.q?cur.q.prompt:'';}

  else if(a==='clearres'){if(confirm('Segur que voleu esborrar tots els resultats?')){saveRes([]);renderTeacher();}}
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.matches('#mw')){e.preventDefault();$('#an').focus();return;}

(function(){const P=window.FR4C;if(!P)return;const a=P.alumne();let PRE=null;
  document.body.classList.add('fr4c-entrant');

    if(v)v.rooms=ROOMS.map((_,i)=>Object.assign({done:false,correct:0,seen:false,err:0},v.rooms&&v.rooms[i]));return v;};

  otherPinExists=()=>false;clearSave=()=>{};try{localStorage.removeItem(FKEY);}catch(e){}

  const _uh=updateHeader;updateHeader=function(){_uh();const b=document.querySelector('#stats [data-act="logout"]');if(b)b.textContent='Surt del taller';};
  P.get('').then(v=>{PRE=v;const c=String(a.codi||'');
    $('#uname').value=a.nom||'Alumne';$('#upin').value=/^\d{4}$/.test(c)?c:'0000';login();
    if(S&&a.sons===false){S.mute=true;updateHeader();}
    document.body.classList.remove('fr4c-entrant');
    P.on('',v=>{if(v==null&&S){S=null;cur=null;P.surt();}});
  }).catch(()=>document.body.classList.remove('fr4c-entrant'));

<script type="text/plain" id="joc-tpz"><!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzeria Tres Quarts · Com s'escriuen les fraccions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<script>/* Pont FR-4C: aquest joc s'executa dins l'app «FR-4C · Matemàtiques 4t ESO».
   Substitueix el Firebase propi del joc: tot es desa a objectius/resultats/{alumne}/{taller}
   a través de l'app principal, que ja té l'alumne identificat. */
(function(){
  let P=null;try{P=parent.__fr4cPont||null;}catch(e){}
  window.FR4C=P;
  const fix=v=>{if(v&&typeof v==='object'&&!Array.isArray(v)){if(v['.sv'])return Date.now();const o={};for(const k in v)o[k]=fix(v[k]);return o;}return v;};
  const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
  const snap=(v,key)=>({key,val:()=>clone(v),exists:()=>v!=null,
    forEach(f){if(v&&typeof v==='object'){for(const k in v){if(f(snap(v[k],k))===true)return true;}}return false;}});
  // camí del joc → què representa: document del taller, configuració, connexió o res
  function on_(path){const p=String(path||'').split('/').filter(Boolean);
    if(p[0]==='.info')return {info:1};
    if(p[1]==='config')return {cfg:1,sub:p.slice(2)};
    if(p[1]==='alumnes'&&p.length>=3)return {r:p.slice(3).join('/')};
    return {nul:1};}
  const subs={};
  function ref(path){const R=on_(path),k=String(path||'');
    const get=async()=>{if(R.info)return true;if(!P||R.nul)return null;
      if(R.cfg){let c=P.config();for(const s of R.sub)c=c==null?null:c[s];return c==null?null:c;}
      return P.get(R.r);};
    const esc=R.r!=null&&!!P;
    return {key:k.split('/').filter(Boolean).pop()||null,
      child:c=>ref(k.replace(/\/$/,'')+'/'+c),
      once:async(ev,cb)=>{const s=snap(await get());if(typeof cb==='function')cb(s);return s;},
      on:(ev,cb)=>{if(!esc){get().then(v=>cb(snap(v)));return cb;}
        const u=P.on(R.r,v=>cb(snap(v)));(subs[k]=subs[k]||[]).push(u);return cb;},
      off:()=>{(subs[k]||[]).forEach(u=>{try{u();}catch(e){}});delete subs[k];},
      set:v=>esc?P.set(R.r,fix(v)):Promise.resolve(),
      update:o=>esc?P.update(R.r,fix(o)):Promise.resolve(),
      remove:()=>esc?P.remove(R.r):Promise.resolve()};}
  const database=()=>({ref});
  database.ServerValue={TIMESTAMP:{'.sv':'timestamp'}};
  const usuari={uid:'fr4c',isAnonymous:true};
  window.firebase={apps:[],initializeApp(c){this.apps.push(c);return {};},database,
    auth(){return {signInAnonymously:async()=>({user:usuari}),onAuthStateChanged(cb){setTimeout(()=>cb(usuari));return ()=>{};},currentUser:usuari};}};
})();
<\/script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#545454; --line:#d4d4d4; --slot:#efefef;

<body>
<header class="top"><div class="top-in"><button class="brand" data-act="home">🍕 Pizzeria Tres Quarts</button><div class="stats" id="stats"></div></div><div class="awning" aria-hidden="true"></div></header>
<main id="app"></main>
<canvas id="confetti"></canvas>
<script>
/* =========================================================
   UTILITATS
   ========================================================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const normTeam=t=>strip(t).toLowerCase().replace(/[^a-z0-9]/g,'');
function h32(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}return h>>>0;}

/* =========================================================
   NOMS DE LES FRACCIONS EN CATALÀ
   Font: GIEC 17.2.5 (fraccionaris en -è: vint-i-dosè, trenta-dosè, centè)
   i dossier pàg. 3. Per al 100 fem servir «centèsim» (també és correcte «centè»).
   ========================================================= */
const UNI=['','un','dos','tres','quatre','cinc','sis','set','vuit','nou'];
const TEEN=['deu','onze','dotze','tretze','catorze','quinze','setze','disset','divuit','dinou'];
const TENS=['','','vint','trenta','quaranta','cinquanta','seixanta','setanta','vuitanta','noranta'];
function card(n){if(n<10)return UNI[n];if(n<20)return TEEN[n-10];if(n===100)return 'cent';const t=Math.floor(n/10),u=n%10;if(!u)return TENS[t];return t===2?`vint-i-${UNI[u]}`:`${TENS[t]}-${UNI[u]}`;}
const PSPEC={2:'mig',3:'terç',4:'quart',5:'cinquè',6:'sisè',7:'setè',8:'vuitè',9:'novè',10:'desè',11:'onzè',12:'dotzè',13:'tretzè',14:'catorzè',15:'quinzè',16:'setzè',17:'dissetè',18:'divuitè',19:'dinovè',20:'vintè'};
const UORD=['','unè','dosè','tresè','quatrè','cinquè','sisè','setè','vuitè','novè'];
const TORD=['','','vintè','trentè','quarantè','cinquantè','seixantè','setantè','vuitantè','norantè'];
function part(d){if(PSPEC[d])return PSPEC[d];if(d===100)return 'centèsim';const t=Math.floor(d/10),u=d%10;if(!u)return TORD[t];return t===2?`vint-i-${UORD[u]}`:`${TENS[t]}-${UORD[u]}`;}
function partPl(d){if(d===2)return 'mitjos';if(d===3)return 'terços';if(d===4)return 'quarts';if(d===100)return 'centèsims';return part(d).replace(/è$/,'ens');}
const nameF=(n,d)=>n===1?`un ${part(d)}`:`${card(n)} ${partPl(d)}`;
function variants(n,d){const v=[nameF(n,d)];
  if(n===1){v.push('u '+part(d));if(d===2)v.push('la meitat','meitat','mig');if(d===100)v.push('un centè','u centè');}
  if(n>20&&n%10===1){const c=card(n).replace(/un$/,'u');v.push(`${c} ${partPl(d)}`);}
  if(d===100&&n>1){const base=v.slice();base.forEach(x=>v.push(x.replace(/centèsims$/,'centens')));}
  return v;}
const tight=s=>String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/[.,;:!?«»"]/g,' ').replace(/\s*-\s*/g,'-').replace(/\s+/g,' ').trim();
const loose=s=>strip(tight(s)).replace(/-/g,' ').replace(/\s+/g,' ');
const CAST={2:'medios',3:'tercios',4:'cuartos',5:'quintos',6:'sextos',7:'séptimos',8:'octavos',9:'novenos',10:'décimos',100:'centésimos'};
function castName(n,d){if(CAST[d]){const w=CAST[d];return `${card(n)} ${n===1?w.replace(/s$/,''):w}`;}return `${card(n)} ${card(d)}avo${n===1?'':'s'}`;}
function checkWords(n,d,input){const t=tight(input),V=variants(n,d);
  if(V.map(tight).includes(t))return {ok:true};
  if(V.map(loose).includes(loose(input)))return {ok:true,msg:`Correcte! Però fixa't en com s'escriu exactament: <b class="nm">«${nameF(n,d)}»</b>${/-/.test(nameF(n,d))?', amb els guionets':''}${/[èçà]/.test(nameF(n,d))?' i els accents':''}.`};
  const sv=loose(input);let m='';
  if(/cuart|terci|quint|sext|septim|octav|noven|decim|medio|avos?\b|centesimos|onceav|doceav/.test(sv))m='Això és castellà! 😉 En català no es diu així.';
  else if(/\bdues\b/.test(sv))m='El numerador va en masculí: «dos», no «dues».';
  else if(n>1&&sv===loose(`${card(n)} ${part(d)}`))m='Quan el numerador és més gran que 1, el denominador va en <b>plural</b>.';
  else if(n===1&&sv===loose(`un ${partPl(d)}`))m='Quan el numerador és 1, el denominador va en <b>singular</b>.';
  else if(sv===loose(`${card(n)} ${card(d)}`))m='El denominador no es diu com un nombre normal: té un nom especial de fracció.';
  return {ok:false,msg:(m?m+'<br>':'')+`La teva resposta: «${esc(input)}»`};}
function wrongNames(n,d,L){const c=nameF(n,d),s=new Set();
  const cand=[castName(n,d),n===2?`dues ${partPl(d)}`:(n>20&&n%10===2?`${card(n).replace(/dos$/,'dues')} ${partPl(d)}`:null),
    n>1?`${card(n)} ${part(d)}`:`un ${partPl(d)}`,`${card(n)} ${card(d)}`,`${card(n)} de ${card(d)}`,
    inLevel(L,d+1)?nameF(n,d+1):null,inLevel(L,d-1)&&d>2?nameF(n,d-1):null,(n>=2&&n<=100&&d<=99&&n!==d)?nameF(d,n):null];
  for(const x of shuffle(cand))if(x&&x!==c&&!s.has(x))s.add(x);return [...s].slice(0,3);}
function explainName(n,d){let r;
  if(d<=10)r=`El ${d} com a denominador es diu <b class="nm">«${part(d)}»</b>${d>=3?`, en plural <b class="nm">«${partPl(d)}»</b>`:', en plural <b class="nm">«mitjos»</b>'}.`;
  else if(d<=20)r=`A partir d'11, el denominador és el nombre + <b>«-è»</b>: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  else if(d===100)r=`El 100 es diu <b class="nm">«centèsim»</b>, en plural <b class="nm">«centèsims»</b>. (També és correcte «centè».)`;
  else if(d%10===0)r=`Les desenes: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  else r=`Nombres compostos: s'escriuen <b>amb guionets</b> i la darrera part fa «-è»: ${card(d)} → <b class="nm">«${part(d)}»</b>, en plural <b class="nm">«${partPl(d)}»</b>.`;
  let nn=n===1?' Com que el numerador és 1, el denominador va en <b>singular</b>.':' El numerador és més gran que 1, per tant el denominador va en <b>plural</b>.';
  if(n%10===2&&n!==12)nn+=' El numerador va en masculí: «dos», no «dues».';
  return `${F(n,d)} → <b class="nm">«${nameF(n,d)}»</b><br>${r}${nn}`;}

/* =========================================================
   NIVELLS I TORNS
   ========================================================= */
const D3=[21,22,23,24,25,26,28,30,32,35,40,45,48,50,60,64,70,75,80,90,100,100,100];
const LEVELS=[
  {icon:'🏠',name:'La pizzeria del barri',rng:'Denominadors del 2 al 10',min:2,max:10},
  {icon:'🍝',name:'La trattoria',rng:'Denominadors de l\'11 al 20',min:11,max:20},
  {icon:'🎪',name:'El gran festival de la pizza',rng:'Denominadors fins al 100',min:21,max:100}];
const inLevel=(L,d)=>L===2?D3.includes(d):(d>=LEVELS[L].min&&d<=LEVELS[L].max);
function genFrac(L,{proper=false}={}){let d,n;
  if(L===0){d=rnd(2,10);n=proper||Math.random()<.75?rnd(1,d-1):rnd(1,10);}
  else if(L===1){d=rnd(11,20);n=proper||Math.random()<.8?rnd(1,d-1):rnd(1,20);}
  else{d=pick(D3);n=rnd(1,Math.min(99,d-1));}
  return [n,d];}
const STAGES=[
  {icon:'🎫',name:'Els tiquets',desc:'Uneix cada fracció amb el seu tiquet',count:3},
  {icon:'🙋',name:'Què demana el client?',desc:'Tria el tiquet correcte',count:5},
  {icon:'☎️',name:'Comanda per telèfon',desc:'Escolta i escriu la fracció',count:5},
  {icon:'👨‍🍳',name:'Prepara la comanda',desc:'Llegeix el tiquet i fes la fracció',count:5},
  {icon:'✍️',name:'Escriu el tiquet',desc:'Escriu el nom en lletres',count:5},
  {icon:'⏱️',name:"L'hora punta",desc:'Comandes barrejades, ràpid!',count:8}];
const NS=LEVELS.length*STAGES.length;
const TIPS=[
  ['Tres quarts, dos terços, cinc sisens... El numerador va primer!','Si el numerador és 1: singular (un quart). Si és més gran: plural (tres quarts).','Recorda: el 2 és «mig», el 3 és «terç» i el 4 és «quart».'],
  ['A partir d\'11: onzens, dotzens, tretzens... fins a vintens!','Compte: nou → novè, i dinou → dinovè.','Disset → dissetens, divuit → divuitens.'],
  ['Compostos amb guionet: vint-i-cinquens, trenta-dosens.','Les desenes: trentens, quarantens, cinquantens...','El 100 és especial: centèsims.']];

/* =========================================================
   FIGURES: PIZZES
   ========================================================= */
function pizzaOne(d,k,cx,cy,r,inter,u){let s=`<circle cx="${cx}" cy="${cy}" r="${r+7}" class="plate"/>`;
  for(let i=0;i<d;i++){const a0=-Math.PI/2+2*Math.PI*i/d,a1=-Math.PI/2+2*Math.PI*(i+1)/d,on=i<k;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const path=d===1?`<circle cx="${cx}" cy="${cy}" r="${r}" class="sl ${on?'on':''}" ${inter?`data-i="${u*d}"`:''}/>`:`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" class="sl ${on?'on':''}" ${inter?`data-i="${u*d+i}"`:''}/>`;
    s+=path;
    if(on&&!inter){const am=(a0+a1)/2,pr=Math.max(3,Math.min(7,r*1.6/d+2));const px=cx+r*.6*Math.cos(am),py=cy+r*.6*Math.sin(am);
      s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${pr.toFixed(1)}" class="pep"/>`;
      if(d<=8){const bx=cx+r*.33*Math.cos(am+.15),by=cy+r*.33*Math.sin(am+.15);s+=`<ellipse cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" rx="4" ry="2.4" class="bas" transform="rotate(${(am*57).toFixed(0)} ${bx.toFixed(1)} ${by.toFixed(1)})"/>`;}}}
  return s;}
function pizzaSVG(d,n,inter=false,units){units=units||Math.max(1,Math.ceil(n/d));const r=64,g=26,w=units*2*(r+7)+(units-1)*g+8,h=2*(r+7)+8;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="fig ${inter?'interactive':''}" style="width:min(100%,${units*190}px)" role="img" aria-label="pizza tallada en ${d} trossos">`;
  for(let u=0;u<units;u++){const k=inter?0:Math.max(0,Math.min(d,n-u*d));s+=pizzaOne(d,k,4+r+7+u*(2*(r+7)+g),4+r+7,r,inter,u);}
  return s+'</svg>';}

function traySVG(d,n,inter=false){const [c,r]=TRAY[d],W=360,H=r===1?70:Math.min(240,Math.round(W*r/c)),cw=W/c,ch=H/r;

  for(let i=0;i<d;i++){const cx=i%c,cy=Math.floor(i/c),x=7+cx*cw,y=7+cy*ch,on=!inter&&i<n;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" class="sl ${on?'on':''}" ${inter?`data-i="${i}"`:''}/>`;

function tone(f,t0,dur,type='triangle',vol=.18){const a=ac();if(!a)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);

const B32='23456789ABCDEFGHJKLMNPQRSTUVWXYZ',CSB=13,CSM=(1<<CSB)-1;
function makeCode(){const secs=Math.round(((S.end||Date.now())-S.start)/1000);let n=0n;
  const put=(v,b)=>{n=(n<<BigInt(b))|BigInt(Math.max(0,Math.min(Math.round(v)||0,2**b-1)));};
  put(1,2);put(S.won?1:0,1);put(S.free?1:0,1);put(S.score,13);put(secs,15);put(S.angry,7);put(S.best,6);put(S.ok,8);
  S.stages.forEach(s=>put(s.done?1:0,1));S.lstars.forEach(v=>put(v,2));S.terr.forEach(v=>put(v,5));
  n=(n<<BigInt(CSB))|BigInt(h32('pz34|'+normTeam(S.team)+'|'+n.toString())&CSM);
  let s='';for(let i=0;i<24;i++){s=B32[Number(n&31n)]+s;n>>=5n;}return s.match(/.{4}/g).join('-');}
function readCode(name,code){const c=String(code).toUpperCase().replace(/[^0-9A-Z]/g,'');if(c.length!==24)return null;
  let n=0n;for(const ch of c){const i=B32.indexOf(ch);if(i<0)return null;n=(n<<5n)|BigInt(i);}
  const cs=Number(n&BigInt(CSM));n>>=BigInt(CSB);if(cs!==(h32('pz34|'+normTeam(name)+'|'+n.toString())&CSM))return null;
  const take=b=>{const v=Number(n&BigInt(2**b-1));n>>=BigInt(b);return v;};
  const terr=[],lstars=[],done=[];for(let i=5;i>=0;i--)terr[i]=take(5);for(let i=2;i>=0;i--)lstars[i]=take(2);for(let i=NS-1;i>=0;i--)done[i]=take(1)===1;
  const ok=take(8),best=take(6),angry=take(7),secs=take(15),score=take(13),free=take(1),won=take(1),ver=take(2);
  if(n!==0n||ver!==1)return null;
  return {won:!!won,free:!!free,score,secs,angry,best,ok,done,lstars,terr,errors:terr.reduce((a,b)=>a+b,0),nd:done.filter(Boolean).length};}
function stateFromCode(name,pin,v){const s=newState(name,pin,v.free);s.stages.forEach((st,i)=>st.done=v.done[i]);
  Object.assign(s,{lstars:v.lstars,terr:v.terr,score:v.score,best:v.best,ok:v.ok,errors:v.errors,angry:v.angry,won:v.won,start:Date.now()-v.secs*1000});if(v.won)s.end=Date.now();return s;}

let TMR=null;const TLIM=25000;
function startTimer(){clearInterval(TMR);TMR=setInterval(()=>{const b=$('#tbar');if(!b||!cur||cur.answered){clearInterval(TMR);return;}const f=Math.max(0,1-(Date.now()-cur.qStart)/TLIM);b.style.transform=`scaleX(${f})`;},250);}

function flash(msg){$('#fb').innerHTML=`<div class="fb warn">${msg}</div>`;}
const isInt=v=>/^\d+$/.test(v);
const PRAISE=['<i>Perfetto!</i> Comanda servida.','<i>Bravissimo!</i> El client està content.','Molt bé! Aquí tens la propina.','<i>Che buono!</i> Ho has clavat.','Comanda perfecta! 🍕'];
const RETRY=['<i>Mamma mia!</i> Aquesta no és la comanda. Torna-hi!','Ui, el client diu que no és això. Prova-ho una altra vegada!','Gairebé! Revisa-ho amb calma.'];
const ANGRY=['<i>Mamma mia!</i> El client s\'ha enfadat. Mira com es diu:','Ai, ai... client enfadat. Fixa-t\'hi bé:'];
function evaluate(q,ans){
  if(q.kind==='mc')return {ok:ans===q.correct};
  if(q.kind==='words')return checkWords(q.n,q.d,ans);
  if(q.kind==='paint')return {ok:ans===q.target,msg:ans===q.target?'':`Has posat ${ans} trossos.`};
  const [x,y]=ans,[n,d]=q.ans;return {ok:x===n&&y===d,msg:x===n&&y===d?'':`La teva resposta: ${F(x,y)}`};}
function submit(val){if(!cur||cur.answered)return;const q=cur.q;let ans;
  if(q.kind==='mc')ans=val;
  else if(q.kind==='frac'||q.kind==='listen'){const a=$('#an').value.trim(),b=$('#ad').value.trim();if(!isInt(a)||!isInt(b)){flash('Escriu el numerador (dalt) i el denominador (baix).');return;}if(+b===0){flash('El denominador no pot ser 0!');return;}ans=[+a,+b];}
  else if(q.kind==='words'){const a=$('#ww').value.trim();if(!a){flash('Escriu el tiquet en lletres.');return;}if(/\d/.test(a)){flash('Ho has d\'escriure amb <b>lletres</b>, no amb xifres. 😉');return;}ans=a;}
  else if(q.kind==='paint'){ans=app.querySelectorAll('.qcard .interactive .sl.on').length;if(!ans){flash('Toca els trossos per posar-los a la pizza.');return;}}
  const res=evaluate(q,ans);const T=cur.s===5?5:cur.type;
  if(!res.ok&&!cur.tries){cur.tries=1;S.errors++;S.terr[T]=Math.min(31,S.terr[T]+1);S.stages[cur.g].err++;cur.err++;S.streak=0;save();updateHeader();sfx('err');
    if(q.kind==='mc'){const o=app.querySelectorAll('.opt')[val];o.classList.add('wrong');o.disabled=true;}
    $('#fb').innerHTML=`<div class="fb bad">${botSay('oops',pick(RETRY),60,'small')}${res.msg?`<p>${res.msg}</p>`:''}<p><b>Segon intent!</b> Si ara l'encertes, guanyes <b>+5</b>.</p></div>`;
    $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});return;}
  cur.answered=true;clearInterval(TMR);
  app.querySelectorAll('.qcard input,.qcard .opt,.qcard .key,[data-act="submit"],#hintBtn,[data-act="listen"],[data-act="showtext"]').forEach(e=>e.disabled=true);
  app.querySelectorAll('.qcard .interactive').forEach(e=>e.classList.remove('interactive'));
  if(q.kind==='mc'){const o=app.querySelectorAll('.opt');o[q.correct].classList.add('right');if(!res.ok)o[val].classList.add('wrong');}
  let pts=0,fast=false,angryNow=false;
  if(res.ok){S.ok++;S.streak++;S.best=Math.max(S.best,S.streak);pts=cur.tries?5:10+(S.streak>=3?5:0);if(cur.s===5&&!cur.tries&&Date.now()-cur.qStart<TLIM){pts+=5;fast=true;}S.score+=pts;sfx('cash');}
  else{S.errors++;S.terr[T]=Math.min(31,S.terr[T]+1);S.stages[cur.g].err++;cur.err++;S.streak=0;S.angry++;cur.angry++;angryNow=true;sfx('angry');}

  const btn=failed?'<button class="btn primary" data-act="failed">Continuar</button>':fin?'<button class="btn primary" data-act="stagedone">Tancar el torn 🎉</button>':'<button class="btn primary" data-act="next">Següent comanda</button>';
  $('#fb').innerHTML=`<div class="fb ${res.ok?'ok':'bad'}">${botSay(res.ok?'happy':'oops',say,60,'small')}${res.msg?`<p>${res.msg}</p>`:''}<div class="exp">${q.explain}</div>${btn}</div>`;

function useHint(){if(!cur||cur.hint||cur.answered)return;cur.hint=true;S.score=Math.max(0,S.score-3);save();updateHeader();

function pairClick(side,i,btn){if(!cur||cur.answered||btn.classList.contains('matched'))return;sfx('tap');
  if(side==='l'){app.querySelectorAll('.pc.frc.sel').forEach(e=>e.classList.remove('sel'));cur.selL=i;}else{app.querySelectorAll('.pc.nm.sel').forEach(e=>e.classList.remove('sel'));cur.selR=i;}

      $('#fb').innerHTML=`<div class="fb bad">${botSay('oops',`<i>Mamma mia!</i> Aquest tiquet no és el d'aquesta fracció. Llegeix-lo bé!`,50,'small')}</div>`;save();updateHeader();}

function stageFailed(){show(`<section class="reveal">${botSay('oops','<i>Mamma mia!</i> Tres clients enfadats... Tanquem un moment, repassem la carta i tornem a obrir. Tu pots!',80)}
  <div style="max-width:720px;margin:0 auto;text-align:left">${cartaHTML(cur.L).replace('<details class="carta">','<details class="carta" open>')}</div>
  <div class="row center"><button class="btn primary big" data-act="retry">Tornar a començar el torn</button><button class="btn" data-act="map">Mapa</button></div></section>`);}
function stageDone(){const g=cur.g,L=cur.L,s=cur.s;const first=!S.stages[g].done;S.stages[g].done=true;let extra='';
  if(s===5){const e=S.stages.slice(gIdx(L,0),gIdx(L,6)).reduce((a,st)=>a+st.err,0),stars=e<=3?3:e<=8?2:1;S.lstars[L]=Math.max(S.lstars[L],stars);
    extra=`<div class="bigstars">${starsTxt(stars)}</div><p>Ressenya dels clients de <b>${LEVELS[L].name}</b></p>`;}
  const allDone=S.stages.every(st=>st.done);if(allDone&&!S.won){S.won=true;S.end=S.end||Date.now();}
  save();updateHeader();
  if(allDone&&first&&s===5){renderDiploma(true);return;}
  const nextG=g+1<NS&&unlockedG(g+1)?g+1:null;
  show(`<section class="reveal"><h2>${s===5?`${LEVELS[L].name}: superat!`:'Torn acabat!'}</h2>${extra}
  ${botSay(s===5?'wow':'happy',s===5&&L<2?`Increïble! La pizzeria creix: ara obrim <b>${LEVELS[L+1].name}</b>! 🎉`:pick(['<i>Grazie mille!</i> Els clients han marxat contents.','Quin torn més bo! 🍕','<i>Bravo!</i> Cuina neta i clients feliços.']),80)}
  <div class="row center">${nextG!=null?`<button class="btn primary big" data-act="stage" data-g="${nextG}">Següent torn: ${STAGES[nextG%6].icon} ${STAGES[nextG%6].name}</button>`:''}<button class="btn" data-act="map">Mapa</button></div></section>`);
  sfx('stage');confetti(s===5?160:70);}
function renderDiploma(celebrate){const tot=S.lstars.reduce((a,b)=>a+b,0);
  show(`<section class="reveal"><div class="diploma"><div style="font-size:2.4rem">🎓🍕</div><h3>Diploma de pizzaiolo de les fraccions</h3>
  <p>La Pizzeria Tres Quarts certifica que</p><p style="font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2rem;margin:.2rem 0">${esc(S.team)}</p>
  <p>sap escriure les fraccions en català fins al 100.</p><div class="bigstars">${'⭐'.repeat(tot)}</div><p class="muted" style="color:#555">Signat: FR-4C, pizzaiolo en cap · Matemàtiques · Ins Júlia Minguell, Badalona</p></div>
  <div class="statgrid"><div>Propines<b>${S.score} 💶</b></div><div>Temps<b>${fmt((S.end||Date.now())-S.start)}</b></div><div>Encerts<b>${S.ok}</b></div><div>Errors<b>${S.errors}</b></div><div>Clients enfadats<b>${S.angry}</b></div><div>Millor ratxa<b>🔥 ${S.best}</b></div></div>
  <div class="codepanel">Codi de progrés per al professor<br><span class="codebox">${makeCode()}</span></div>
  <div class="row center"><button class="btn primary" data-act="map">Mapa</button><button class="btn" data-act="logout">Sortir</button></div></section>`);
  if(celebrate){sfx('win');confetti(240);}}

/* ---------- tauler del professor ---------- */
const TNAMES=STAGES.map(s=>s.icon+' '+s.name);
function sortRes(R){return R.sort((a,b)=>(b.won-a.won)||(b.nd-a.nd)||(b.score-a.score)||(a.secs-b.secs));}
const heat=e=>`<span class="heat h${e===0?0:e<=3?1:e<=7?2:3}">${e>=31?'31+':e}</span>`;
function where(r){if(r.won)return '🎓 Diploma';const g=r.done.findIndex(x=>!x);if(g<0)return '—';return `${LEVELS[Math.floor(g/6)].icon} ${STAGES[g%6].icon} ${STAGES[g%6].name}`;}
function renderTeacher(msg=''){if(S)save();S=null;cur=null;const R=sortRes(loadRes());const tot=[0,1,2,3,4,5].map(k=>R.reduce((a,r)=>a+r.terr[k],0)),maxT=Math.max(0,...tot);
  show(`<section class="room"><div class="rhead"><button class="btn small" data-act="home2">← Inici</button></div><h2>Tauler del professor</h2>
  <p class="muted">Cada alumne et dona el seu nom i el <b>codi de progrés</b>. El codi va lligat al nom. Els resultats es desen només en aquest dispositiu.</p>
  <details class="box"><summary>⚙️ Opcions del professor</summary><div>
    <label class="check"><input type="checkbox" id="tfree" data-act="togglefree" ${getFree()?'checked':''}> <span><b>Mode lliure en aquest dispositiu:</b> tots els torns oberts des del principi.</span></label>
    <p class="muted" style="font-size:.95rem;margin:.5rem 0 0">S'aplica als alumnes que entrin en aquest ordinador o tauleta mentre estigui activat. Si el desactives, ningú perd el progrés.</p></div></details>
  <div class="tform"><label>Nom de l'alumne<input id="tteam" autocomplete="off" placeholder="Com l'ha escrit l'alumne"></label><label>Codi de progrés<input id="tcode" autocomplete="off" placeholder="XXXX-XXXX-..." maxlength="40"></label><button class="btn primary" data-act="addres">Afegir</button></div>
  <details class="box"><summary>📋 Afegir-ne molts de cop (enganxar una llista)</summary><div>
    <p style="margin-top:0">Una línia per alumne, amb el nom i el codi (per exemple, copiat d'un formulari del Classroom):</p>
    <textarea class="bulk" id="bulk" placeholder="Salma	7K2M-QX9P-...&#10;Andrei; 4HT8-..."></textarea>
    <div class="row"><button class="btn primary small" data-act="bulkadd">Afegir la llista</button></div></div></details>
  <div id="tmsg">${msg}</div>
  ${R.length?`<div class="twrap"><table class="res"><thead><tr><th>#</th><th>Alumne</th><th>On és</th><th>Torns</th><th>⭐ Barri</th><th>⭐ Trattoria</th><th>⭐ Festival</th><th>Propines</th><th>Temps</th><th>Errors</th><th>😠</th>${STAGES.map(s=>`<th title="${esc(s.name)}">${s.icon}</th>`).join('')}<th>S'encalla a</th><th></th></tr></thead><tbody>
  ${R.map((r,i)=>{const mx=Math.max(...r.terr),w=mx>0?r.terr.indexOf(mx):-1;
    return `<tr><td>${i+1}</td><td><b>${esc(r.team)}</b></td><td>${where(r)}</td><td>${r.nd}/${NS}</td>${r.lstars.map(v=>`<td>${v?'⭐'.repeat(v):'—'}</td>`).join('')}<td>${r.score}</td><td>${fmt(r.secs*1000)}</td><td>${r.errors}</td><td>${r.angry}</td>${r.terr.map(e=>`<td>${heat(e)}</td>`).join('')}<td>${w>=0?esc(TNAMES[w]):'—'}</td><td><button class="rm" data-act="delres" data-k="${esc(r.key)}" aria-label="Esborrar">✕</button></td></tr>`;}).join('')}
  </tbody><tfoot><tr><td></td><td>Total classe</td><td colspan="9">${maxT>0?`Tipus d'exercici amb més errors: <b>${esc(TNAMES[tot.indexOf(maxT)])}</b>`:''}</td>${tot.map(t=>`<td>${t}</td>`).join('')}<td colspan="2"></td></tr></tfoot></table></div>
  <p class="legend">Columnes 🎫 🙋 ☎️ 👨‍🍳 ✍️ ⏱️: errors a cada tipus d'exercici (tiquets, triar el nom, escoltar, del nom a la fracció, escriure el nom, hora punta). Com més taronja, més errors.</p>
  <div class="row"><button class="btn primary" data-act="xlsx">⬇️ Exportar a Excel</button><button class="btn small" data-act="copyres">📋 Copiar la taula</button><button class="btn small ghost" data-act="clearres">Esborrar-ho tot</button></div><div id="csvArea"></div>`
  :`<div class="codepanel">Encara no hi ha cap alumne. Afegeix el primer amb el formulari de dalt.</div>`}</section>`);}
function upsertRes(team,v){const key=normTeam(team),R=loadRes(),old=R.findIndex(r=>r.key===key);const row=Object.assign({key,team,at:Date.now()},v);if(old>=0)R[old]=row;else R.push(row);saveRes(R);return old>=0;}
function addRes(){const team=$('#tteam').value.trim().replace(/\s+/g,' '),code=$('#tcode').value.trim();
  if(!team||!code){$('#tmsg').innerHTML='<div class="fb warn">Cal el nom i el codi de progrés.</div>';return;}
  const v=readCode(team,code);if(!v){$('#tmsg').innerHTML='<div class="fb bad" style="padding:.6rem 1rem">Codi no vàlid per a aquest nom. Comprova el codi i que el nom sigui el mateix que va escriure l\'alumne (majúscules i accents no importen).</div>';return;}
  const was=upsertRes(team,v);renderTeacher(`<div class="fb ok" style="padding:.6rem 1rem">✅ ${esc(team)}: ${v.won?'té el diploma!':v.nd+' de '+NS+' torns'} · ${v.score} 💶${was?' (resultat anterior actualitzat)':''}</div>`);}
const CODE_RE=/([2-9A-HJ-NP-Z]{4}(?:-?[2-9A-HJ-NP-Z]{4}){5})["'\s]*$/i;
function bulkAdd(){const lines=$('#bulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0;const bad=[];
  lines.forEach(l=>{const m=l.match(CODE_RE);if(!m){bad.push(l);return;}const name=l.slice(0,m.index).replace(/[\t,;|"]+/g,' ').replace(/\s+/g,' ').trim();const v=name&&readCode(name,m[1]);if(!v){bad.push(l);return;}upsertRes(name,v);ok++;});
  renderTeacher(`<div class="fb ${bad.length?'warn':'ok'}" style="padding:.6rem 1rem">✅ Afegits o actualitzats: <b>${ok}</b>.${bad.length?`<br>No s'han pogut llegir (${bad.length}):<br>${bad.map(esc).join('<br>')}`:''}</div>`);}
function resRows(R){return R.map((r,i)=>{const o={'Posició':i+1,'Alumne':r.team,'On és':where(r).replace(/[^\p{L}\p{N}\s'·:-]/gu,'').trim(),'Torns fets':r.nd,'Estrelles barri':r.lstars[0],'Estrelles trattoria':r.lstars[1],'Estrelles festival':r.lstars[2],'Propines':r.score,'Temps (min)':+(r.secs/60).toFixed(1),'Encerts':r.ok,'Errors':r.errors,'Clients enfadats':r.angry,'Millor ratxa':r.best};
  STAGES.forEach((s,k)=>{o[`Errors: ${s.name}`]=r.terr[k];});const mx=Math.max(...r.terr);o["S'encalla a"]=mx>0?STAGES[r.terr.indexOf(mx)].name:'';o['Codi afegit el']=new Date(r.at).toLocaleString('ca-ES');return o;});}
function tmsg2(html){$('#csvArea').innerHTML=`<div class="fb warn" style="margin-top:.8rem">${html}</div>`;}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>window.XLSX?res(window.XLSX):rej();s.onerror=rej;document.head.appendChild(s);});}
async function exportXlsx(){const R=sortRes(loadRes());if(!R.length)return;tmsg2('Preparant el fitxer d\'Excel...');
  let dl=null;try{if(window.claude&&typeof window.claude.use==='function')dl=await window.claude.use('downloads');}catch(e){dl=null;}
  if(!dl){tmsg2('La descàrrega directa no està disponible en aquesta vista. Fes servir <b>«Copiar la taula»</b> i enganxa-la a Excel.');return;}
  let X;try{X=await loadXLSX();}catch(e){tmsg2('No s\'ha pogut carregar el generador d\'Excel. Pots fer servir «Copiar la taula».');return;}
  const ws=X.utils.json_to_sheet(resRows(R));ws['!cols']=Object.keys(resRows(R)[0]).map(k=>({wch:Math.max(9,Math.min(30,k.length+2))}));
  const sum=STAGES.map((s,k)=>{const e=R.reduce((a,r)=>a+r.terr[k],0);return {"Tipus d'exercici":s.name,'Què fa l\'alumne':s.desc,'Errors totals':e,"Mitjana d'errors per alumne":+(e/R.length).toFixed(2)};});
  const ws2=X.utils.json_to_sheet(sum);ws2['!cols']=[{wch:24},{wch:36},{wch:13},{wch:26}];
  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Alumnes');X.utils.book_append_sheet(wb,ws2,'Per tipus');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});const dt=new Date().toISOString().slice(0,10);
  try{await dl.save({filename:`Pizzeria_Tres_Quarts_resultats_${dt}.xlsx`,data:new Blob([buf])});$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">✅ Fitxer d\'Excel preparat. Mira a la carpeta de descàrregues.</div>';}
  catch(e){const c=e&&e.code;tmsg2(c==='declined'?'Descàrrega cancel·lada.':c==='rate_limited'?'Ja hi ha una descàrrega oberta. Espera un moment.':'No s\'ha pogut descarregar en aquesta vista. Fes servir <b>«Copiar la taula»</b>.');}}
function copyRes(){const rows=resRows(sortRes(loadRes()));if(!rows.length)return;const keys=Object.keys(rows[0]);const txt=[keys.join('\t'),...rows.map(o=>keys.map(k=>o[k]).join('\t'))].join('\n');
  const fb=()=>{$('#csvArea').innerHTML=`<p class="muted">Selecciona el text, copia'l (Ctrl+C) i enganxa'l a Excel:</p><textarea class="csv" readonly>${esc(txt)}</textarea>`;const ta=app.querySelector('textarea.csv');ta.focus();ta.select();};
  try{navigator.clipboard.writeText(txt).then(()=>{$('#csvArea').innerHTML='<div class="fb ok" style="padding:.6rem 1rem;margin-top:.8rem">Taula copiada. Enganxa-la a Excel.</div>';},fb);}catch(e){fb();}}

/* =========================================================
   ESDEVENIMENTS
   ========================================================= */
if(app){
new MutationObserver(()=>typeAll(app)).observe(app,{childList:true,subtree:true});
document.querySelector('.top').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='mute'&&S){S.mute=!S.mute;save();updateHeader();}
  if(a==='logout'){try{speechSynthesis.cancel();}catch(_){}renderStart();}
  if(a==='home'){if(S)renderMap();else renderStart();}});
app.addEventListener('click',e=>{
  const sl=e.target.closest('.qcard .interactive .sl');
  if(sl&&cur&&!cur.answered){sl.classList.toggle('on');$('#cnt').textContent=`Trossos posats: ${app.querySelectorAll('.qcard .interactive .sl.on').length}`;sfx('tap');return;}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='login')login();
  else if(a==='showrestore'){const r=$('#restoreBox');r.hidden=!r.hidden;if(!r.hidden)$('#ucode').focus();}
  else if(a==='soundtest'){SFX.ok();setTimeout(()=>SFX.err(),700);$('#stMsg').innerHTML=botSay('happy','Has d\'haver sentit dos sons: <b>«ding-ding»</b> (encert) i <b>«oh-oh»</b> (error). Si no sents res, revisa el volum.',56,'small');}
  else if(a==='voicetest'){pickVoice();const ok=speak('Hola! Voldria tres quarts de pizza, si us plau.');
    $('#stMsg').innerHTML=botSay(ok?'happy':'think',ok?`Veu en català trobada: <b>${esc(VOICE.name)}</b>. Has d'haver sentit «tres quarts de pizza». 🍕`:'Aquest dispositiu <b>no té veu en català</b>. No passa res: les comandes per telèfon sortiran escrites. (En alguns ordinadors es pot instal·lar la veu catalana des de la configuració d\'idioma del sistema.)',56,'small');}
  else if(a==='map'){try{speechSynthesis.cancel();}catch(_){}renderMap();}
  else if(a==='stage')enterStage(+b.dataset.g);
  else if(a==='mc')submit(+b.dataset.i);
  else if(a==='submit')submit();
  else if(a==='next')nextQ();
  else if(a==='hint')useHint();
  else if(a==='pl')pairClick('l',+b.dataset.i,b);
  else if(a==='pr')pairClick('r',+b.dataset.i,b);
  else if(a==='listen')playOrder(false);
  else if(a==='showtext'){if(!cur.textShown){cur.textShown=true;S.score=Math.max(0,S.score-3);save();updateHeader();}$('#written').textContent=`«${cur.q.say}»`;}
  else if(a==='ins'){const w=$('#ww');if(w&&!w.disabled){const s=w.selectionStart??w.value.length;w.value=w.value.slice(0,s)+b.dataset.c+w.value.slice(w.selectionEnd??s);w.focus();w.setSelectionRange(s+1,s+1);}}
  else if(a==='failed')stageFailed();
  else if(a==='retry')enterStage(cur.g);
  else if(a==='stagedone')stageDone();
  else if(a==='diploma')renderDiploma(false);
  else if(a==='showcode')showCode();
  else if(a==='logout'){try{speechSynthesis.cancel();}catch(_){}renderStart();}
  else if(a==='reset'){if(confirm('Segur que vols reiniciar la teva pizzeria? Es perdrà tot el progrés.')){const n=S.team,p=S.pin;try{localStorage.removeItem(userKey(n,p));}catch(_){}S=newState(n,p,getFree());save();renderMap();}}
  else if(a==='teacher')renderTeacher();
  else if(a==='home2')renderStart();
  else if(a==='addres')addRes();
  else if(a==='bulkadd')bulkAdd();
  else if(a==='delres'){saveRes(loadRes().filter(r=>r.key!==b.dataset.k));renderTeacher();}
  else if(a==='copyres')copyRes();
  else if(a==='xlsx')exportXlsx();
  else if(a==='clearres'){if(confirm('Segur que vols esborrar tots els resultats?')){saveRes([]);renderTeacher();}}
  else if(a==='togglefree'){setFree(b.checked);$('#tmsg').innerHTML=`<div class="fb ok" style="padding:.6rem 1rem">${b.checked?'🔓 Mode lliure activat en aquest dispositiu.':'🔒 Mode lliure desactivat: els torns s\'obren per ordre.'}</div>`;}
});
app.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
  if(t.matches('#an')&&$('#ad')&&$('#ad').value===''){e.preventDefault();$('#ad').focus();return;}
  if(t.matches('#an,#ad,#ww')){e.preventDefault();submit();}
  else if(t.matches('#uname')){e.preventDefault();$('#upin').focus();}
  else if(t.matches('#upin,#ucode')){e.preventDefault();login();}
  else if(t.matches('#tteam')){e.preventDefault();$('#tcode').focus();}
  else if(t.matches('#tcode')){e.preventDefault();addRes();}});
setInterval(()=>{if(S&&!S.end){const c=$('#clock');if(c)c.textContent=fmt(Date.now()-S.start);}},1000);
renderStart();
/* ============ FR-4C: entrada automàtica i progrés a l'app de la classe ============ */
(function(){const P=window.FR4C;if(!P)return;const a=P.alumne();let PRE=null;
  document.body.classList.add('fr4c-entrant');
  const net=v=>v==null?null:JSON.parse(JSON.stringify(v));
  const arr=(x,n,def)=>{const v=x==null?[]:Array.isArray(x)?x:Object.values(x);return Array.from({length:n},(_,i)=>v[i]==null?(typeof def==='function'?def():def):v[i]);};
  loadUser=()=>{const v=net(PRE);if(!v)return null;
    v.stages=arr(v.stages,NS,()=>({done:false,err:0})).map(x=>Object.assign({done:false,err:0},x));v.lstars=arr(v.lstars,3,0);v.terr=arr(v.terr,6,0);return v;};
  save=function(){if(!S)return;S.last=Date.now();PRE=net(S);P.set('',PRE);};
  otherPinExists=()=>false;try{localStorage.removeItem(FKEY);}catch(e){}
  renderStart=function(){if(S)save();S=null;cur=null;try{speechSynthesis.cancel();}catch(e){}P.surt();};
  const _uh=updateHeader;updateHeader=function(){_uh();const b=document.querySelector('#stats [data-act="logout"]');if(b)b.textContent='Surt del taller';};
  P.get('').then(v=>{PRE=v;const c=String(a.codi||'');
    $('#uname').value=a.nom||'Alumne';$('#upin').value=/^\d{4}$/.test(c)?c:'0000';login();
    if(S&&a.sons===false){S.mute=true;updateHeader();}
    document.body.classList.remove('fr4c-entrant');
    P.on('',v=>{if(v==null&&S){S=null;cur=null;P.surt();}});
  }).catch(()=>document.body.classList.remove('fr4c-entrant'));
})();
}
