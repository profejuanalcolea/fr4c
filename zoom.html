<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El zoom de FR-4C · FR-4C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
/* Taller de l'app FR-4C · Mesura (i potències de 10): coses gegants i diminutes, notació científica. Protocol fr4c-zoom-ini/llest/fi/tanca. */
:root{--taronja:#f26b1d;--tinta:#1b1b1b;--ok:#2c9a58;--ko:#d64242;--fons:#f3f1ea;--blau:#2a6fd6;--verd:#1d9a5a;--lila:#7c5cd6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:var(--fons);color:var(--tinta);overflow:hidden;user-select:none}
#joc{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:14px;padding:62px 16px 14px}
.cap{position:absolute;top:10px;left:16px;right:16px;display:flex;align-items:center;gap:14px;z-index:5;font-weight:700}
.cap .tit{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}.cap .compta{font-size:1.05rem;color:#555}
.cap .punts{margin-left:auto;font-size:1.7rem;font-family:"Bricolage Grotesque",sans-serif}
.btn{border:3px solid var(--tinta);background:#fff;color:var(--tinta);border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
#esc{width:100%;height:100%;min-height:0;border:4px solid var(--tinta);border-radius:20px;background:#9fd3ff;display:block;overflow:hidden}
.panel{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:4px}
.targ{background:#fff;border:4px solid var(--tinta);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 #0002}
.targ h2{font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;margin:0 0 6px}
.targ p{margin:6px 0;font-size:1.1rem;line-height:1.4}
.formula{font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;line-height:1.5;background:#fff8ec;border-radius:14px;padding:8px 12px;margin-top:6px}
.formula .nova{animation:apareix .4s}
@keyframes apareix{from{opacity:0;transform:translateY(6px)}}
.zbtns{display:flex;gap:10px;flex-wrap:wrap}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;border-radius:14px;padding:9px 18px;border:4px solid var(--tinta);cursor:pointer;background:var(--taronja);color:#fff;box-shadow:0 5px 0 #0004}
.big.sec{background:#fff;color:var(--tinta)}.big:disabled{opacity:.4;cursor:default}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.entra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem}
.entra input{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;width:120px;padding:6px 8px;border:4px solid var(--tinta);border-radius:12px;text-align:center}
.entra input.exp{width:70px;font-size:1.1rem;padding:4px;transform:translateY(-14px)}
.entra input.llarg{width:220px}
.opcions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.opc{font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem;padding:8px 12px;border-radius:14px;border:4px solid var(--tinta);background:#fff;cursor:pointer;text-align:left}
.opc:disabled{opacity:.4}.opc.be{background:var(--ok);color:#fff;border-color:var(--ok);opacity:1}
.cartes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.carta{border:4px solid var(--tinta);border-radius:14px;background:#fff;padding:6px;cursor:pointer;text-align:center;font-weight:700;position:relative}
.carta svg{width:100%;height:70px}.carta .n{position:absolute;top:4px;left:8px;background:var(--taronja);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-family:"Bricolage Grotesque",sans-serif}
.carta.triada{opacity:.65}
.msg{font-weight:700;font-size:1.08rem;margin-top:8px}.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.calc{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem;line-height:1.45;margin:6px 0 0}
.fitxa{display:flex;gap:10px;align-items:center}.fitxa svg{flex:none;width:110px;height:80px;background:#f5f3ee;border-radius:12px}
.fitxa h3{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:1.3rem}.fitxa .mida{font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem;color:var(--blau)}
.fitxa p{margin:2px 0;font-size:1rem}
.llista{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.llista span{font-size:.9rem;border-radius:10px;padding:2px 8px;background:#eee;color:#888}.llista span.fet{background:#e3f4e8;color:var(--ok);font-weight:700}
.sacseja{animation:sacseja .35s}@keyframes sacseja{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pantalla{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#1b1b1b99}
.panell{background:#fff;border-radius:24px;border:4px solid var(--tinta);padding:20px 26px;max-width:860px;width:92%;box-shadow:0 10px 0 #0006;max-height:94vh;overflow:auto}
.panell h1{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 6px;font-size:2rem}.panell p{font-size:1.12rem;line-height:1.45;margin:8px 0}
.big2{font-size:1.3rem;padding:12px 24px}
.seg{display:inline-flex;border:3px solid var(--tinta);border-radius:12px;overflow:hidden}.seg button{border:0;background:#fff;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--tinta);color:#fff}
.resum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.resum div{background:#f5f3ef;border-radius:14px;padding:10px;text-align:center}.resum b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:2rem}
.mini{font-size:.95rem;color:#666}.rec{color:var(--taronja);font-weight:800}
.salta{position:absolute;right:30px;bottom:26px;z-index:9}
/* animacions dels dibuixos */
.pota{transform-box:fill-box;transform-origin:50% 0;animation:pota .5s ease-in-out infinite alternate}.pota.b{animation-delay:-.25s}
@keyframes pota{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.cua{transform-box:fill-box;transform-origin:100% 50%;animation:cua 1.6s ease-in-out infinite alternate}@keyframes cua{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.cap-d{transform-box:fill-box;transform-origin:0% 100%;animation:capd 2.2s ease-in-out infinite alternate}@keyframes capd{from{transform:rotate(-6deg)}to{transform:rotate(4deg)}}
.boca{transform-box:fill-box;transform-origin:0 0;animation:boca 1.4s ease-in-out infinite}@keyframes boca{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(16deg)}}
.raig{transform-box:fill-box;transform-origin:50% 100%;animation:raig 2s ease-out infinite}@keyframes raig{0%{transform:scaleY(.2);opacity:0}30%{opacity:.9}100%{transform:scaleY(1.2);opacity:0}}
.salt{transform-box:fill-box;transform-origin:50% 100%;animation:salt 1.6s ease-in-out infinite}@keyframes salt{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-40%)}}
.balanc{transform-box:fill-box;transform-origin:50% 50%;animation:balanc 2.4s ease-in-out infinite alternate}@keyframes balanc{from{transform:rotate(-4deg) translateY(-3%)}to{transform:rotate(4deg) translateY(3%)}}
.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 1.2s ease-in-out infinite alternate}@keyframes flag{to{transform:scaleX(.8)}}
.gira{transform-box:fill-box;transform-origin:50% 50%;animation:gira 30s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
.llumeta{animation:llumeta 1s steps(2) infinite}@keyframes llumeta{50%{opacity:.2}}
.brilla{animation:brilla 1.4s ease-out forwards}@keyframes brilla{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.8)}}
.obj{cursor:pointer}
</style>
</head>
<body>
<div id="joc">
  <div class="cap"><span class="tit">🔍 El zoom de FR-4C</span><span class="compta" id="compta"></span><span class="punts" id="punts"></span>
    <button class="btn" id="so" title="So">🔊</button><button class="btn" id="surt" title="Surt">✕</button></div>
  <svg id="esc" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid meet" aria-label="Escena del zoom"></svg>
  <div class="panel" id="panel"></div>
</div>
<div class="pantalla" id="pant" style="display:none"></div>
<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), tria = a => a[Math.floor(Math.random() * a.length)];
const barreja = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const N = '#1b1b1b', T = '#f26b1d';
const M = { nom: '', nivell: 1, dinsApp: false, so: true, pantalla: 'inici', record: 0 };
try { M.so = localStorage.getItem('fr4c_zoom_so') !== '0'; } catch (e) {}
let RAPID = false; // «Ja ho entenc»: les animacions passen de cop
const LENT = () => M.pantalla === 'expl' ? 1.8 : 1; // l'explicació va més a poc a poc
const espera = ms => new Promise(r => setTimeout(r, RAPID ? 0 : ms * LENT()));
const anim = (ms, f) => new Promise(res => { if (RAPID) { f(1); return res(); } ms *= LENT(); const t0 = performance.now(); const pas = t => { const u = Math.min(1, (t - t0) / ms); f(u < .5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2, u); if (u < 1) requestAnimationFrame(pas); else res(); }; requestAnimationFrame(pas); });
// nombres en català: milers amb punt, decimals amb coma
const fmt = v => { if (Math.abs(v) >= 1) { const [e, d] = String(Math.round(v * 1e6) / 1e6).split('.'); return e.replace(/\B(?=(\d{3})+$)/g, '.') + (d ? ',' + d : ''); } return String(+v.toPrecision(6)).replace(/^(\d)e-(\d+)$/, (m, a, b) => '0,' + '0'.repeat(+b - 1) + a).replace('.', ','); };
const fmtPetit = v => { if (v >= 1e-3 || v === 0) return fmt(v); const s = v.toFixed(12).replace(/0+$/, ''); return s.replace('.', ','); };
const NUM = v => v < 1 ? fmtPetit(v) : fmt(v);
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
const pw = e => '10' + String(e).split('').map(c => SUP[c]).join('');
const ncTxt = (m, e) => m === 1 ? pw(e) : `${String(m).replace('.', ',')} · ${pw(e)}`;
const llegeix = s => { s = String(s).trim().replace(/\s/g, ''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); s = s.replace('−', '-'); return isNaN(+s) ? null : +s; };
const igual = (a, b) => Math.abs(a - b) <= Math.abs(b) * 1e-9 + 1e-15;

/* ================= SONS ================= */
const SO = {
  ctx: null,
  ac() { if (!M.so) return null; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  to(f, d, { ona = 'triangle', vol = .05, t0 = 0, f2 = null } = {}) { const ac = this.ac(); if (!ac || RAPID) return; const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain(); o.type = ona; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .05); },
  vent(d, puja) { const ac = this.ac(); if (!ac || RAPID) return; const n = Math.floor(ac.sampleRate * d), b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime; s.buffer = b; f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(puja ? 300 : 2400, t); f.frequency.exponentialRampToValueAtTime(puja ? 2400 : 300, t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + d * .3); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + d); },
  clac(i = 0) { this.to(500 + i * 40, .05, { ona: 'square', vol: .025 }); },
  ping() { this.to(1320, .1, { vol: .05 }); this.to(1760, .25, { vol: .05, t0: .08 }); },
  be() { [523, 659, 784].forEach((f, i) => this.to(f, .2, { t0: i * .1, vol: .055 })); },
  mal() { this.to(330, .32, { ona: 'sine', vol: .06, f2: 140 }); },
  fi() { [392, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.to(f, .24, { t0: i * .14, vol: .055 })); },
  veu(id) { const V = { trex: () => { this.to(220, .9, { ona: 'sawtooth', vol: .035, f2: 70 }); this.to(160, .9, { ona: 'sawtooth', vol: .025, f2: 60 }); }, raptor: () => this.to(900, .25, { ona: 'sawtooth', vol: .025, f2: 1300 }), diplo: () => this.to(150, .8, { vol: .05, f2: 110 }),
    balena: () => { this.to(300, 1.2, { ona: 'sine', vol: .06, f2: 520 }); }, coma: () => { this.to(620, .18, { ona: 'sine', vol: .06, f2: 1050 }); this.to(1050, .3, { ona: 'sine', vol: .06, f2: 560, t0: .17 }); }, puca: () => this.to(1800, .08, { vol: .04, f2: 2600 }),
    formiga: () => [0, 1, 2].forEach(i => this.to(2400, .02, { ona: 'square', vol: .015, t0: i * .07 })), bacteri: () => this.to(800, .3, { ona: 'sine', vol: .04, f2: 1200 }) }; (V[id] || (() => this.ping()))(); }
};

/* ================= DIBUIXOS (inventats) =================
   Cada dibuix: peus a y=0 i 100 unitats de la mida principal (llarg o alt). s = px per unitat (per mantenir detalls visibles). */
const st = (w = 2) => `stroke="${N}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const ull = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${N}"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .38}" fill="#fff"/>`;
const D = {
  fr4c: () => `<g transform="translate(0 -100) scale(.667)"><line x1="70" y1="34" x2="70" y2="19" stroke="${N}" stroke-width="5"/><circle cx="70" cy="13" r="8" fill="${T}" stroke="${N}" stroke-width="4" class="llumeta"/><line x1="48" y1="132" x2="31" y2="147" stroke="${N}" stroke-width="5" stroke-linecap="round"/><circle cx="27" cy="150" r="7" fill="${T}" stroke="${N}" stroke-width="4"/><path d="M92 128 L110 117 L116 101" fill="none" stroke="${N}" stroke-width="5" stroke-linecap="round"/><circle cx="117" cy="95" r="7" fill="${T}" stroke="${N}" stroke-width="4"/><rect x="14" y="56" width="14" height="32" rx="6" fill="#fff" stroke="${N}" stroke-width="4"/><rect x="112" y="56" width="14" height="32" rx="6" fill="#fff" stroke="${N}" stroke-width="4"/><rect x="24" y="34" width="92" height="78" rx="22" fill="#fff" stroke="${N}" stroke-width="7"/><rect x="36" y="46" width="68" height="52" rx="12" fill="${N}"/><circle cx="55" cy="66" r="7.5" fill="${T}"/><circle cx="85" cy="66" r="7.5" fill="${T}"/><path d="M60 81 q10 8 20 0" stroke="${T}" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="48" y="114" width="44" height="34" rx="10" fill="${T}" stroke="${N}" stroke-width="5"/><text x="70" y="136" text-anchor="middle" font-size="12.5" font-weight="900" fill="${N}" font-family="system-ui">FR-4C</text></g>`,
  coma: () => `<g transform="translate(-4 -100) scale(1.33)"><path d="M60 60Q82 58 74 36" fill="none" stroke="${N}" stroke-width="9" stroke-linecap="round"/><path d="M60 60Q82 58 74 36" fill="none" stroke="${T}" stroke-width="5" stroke-linecap="round" class="cua"/><ellipse cx="40" cy="54" rx="21" ry="18" fill="${T}" ${st(3)}/><ellipse cx="40" cy="60" rx="10" ry="10" fill="#fff"/><path d="M25 20L20 3L35 12Z M55 20L60 3L45 12Z" fill="${T}" ${st(3)}/><circle cx="40" cy="27" r="17" fill="${T}" ${st(3)}/><path d="M40 11v7M33 12l2 6M47 12l-2 6" stroke="#b84a0c" stroke-width="2.4" stroke-linecap="round"/>${ull(33.5, 26, 3)}${ull(46.5, 26, 3)}<path d="M38 31h4l-2 2.6Z" fill="${N}"/><path d="M40 33.6q-3 4 -6 1M40 33.6q3 4 6 1" fill="none" stroke="${N}" stroke-width="1.8"/></g>`,
  raptor: () => `<path class="cua" d="M38 -24 Q18 -26 0 -34 Q16 -20 36 -16Z" fill="#a0723c" ${st(1.4)}/>
    <g class="pota b"><path d="M48 -16 L46 -6 L50 0 L58 0" fill="none" stroke="#7d5428" stroke-width="3.6"/></g>
    <ellipse cx="50" cy="-21" rx="15" ry="8" fill="#b9854a" ${st(1.4)}/><path d="M40 -25 q4 -3 8 0 M47 -27 q4 -3 8 0 M54 -27 q4 -3 8 0" stroke="#7d5428" stroke-width="1.4" fill="none"/>
    <g class="pota"><path d="M52 -16 L55 -6 L52 0 L61 0" fill="none" stroke="#7d5428" stroke-width="3.6"/><path d="M60 0 l2 -3" stroke="${N}" stroke-width="1.5"/></g>
    <path d="M60 -26 Q68 -34 74 -38" stroke="#b9854a" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M62 -20 l7 4 l2 3" stroke="#7d5428" stroke-width="2" fill="none"/><path d="M60 -21 l8 2" stroke="#d8c19a" stroke-width="2"/>
    <g class="cap-d"><path d="M70 -42 Q80 -46 92 -40 Q90 -35 80 -35 Q72 -34 70 -38Z" fill="#b9854a" ${st(1.4)}/><path d="M80 -36 l12 0" stroke="${N}" stroke-width="1"/><path d="M82 -36 l1 1.5 l1 -1.5 l1 1.5 l1 -1.5" stroke="#fff" stroke-width=".7" fill="none"/>${ull(78, -41, 1.5)}</g>`,
  trex: () => `<path class="cua" d="M30 -26 Q12 -24 0 -18 Q14 -14 32 -14Z" fill="#4f8a3a" ${st(1.2)}/>
    <g class="pota b"><path d="M42 -12 Q40 -6 42 0 L50 0" stroke="#3f7030" stroke-width="5" fill="none"/></g>
    <ellipse cx="46" cy="-21" rx="18" ry="11" fill="#5b9a42" ${st(1.2)}/><path d="M34 -14 Q46 -10 58 -16" fill="none" stroke="#a7c98a" stroke-width="3"/>
    <path d="M36 -29 q3 -3 6 0 M44 -31 q3 -3 6 0 M52 -30 q3 -3 6 0" stroke="#3f7030" stroke-width="1.2" fill="none"/>
    <g class="pota"><path d="M50 -14 Q54 -7 51 0 L60 0" stroke="#3f7030" stroke-width="5.5" fill="none"/><path d="M59 0 l2 -1.5 M60 0 l2 .5" stroke="${N}" stroke-width=".8"/></g>
    <path d="M62 -20 l4 4 l-1 2" stroke="#3f7030" stroke-width="1.6" fill="none"/>
    <path d="M58 -28 Q66 -33 70 -32" stroke="#5b9a42" stroke-width="8" fill="none"/>
    <path d="M66 -36 Q80 -42 96 -36 Q98 -31 94 -30 L74 -30 Q68 -28 66 -32Z" fill="#5b9a42" ${st(1.2)}/>${ull(80, -36.5, 1.5)}<path d="M77 -40 l4 -1.2" stroke="${N}" stroke-width=".8"/>
    <g class="boca"><path d="M74 -29.5 L94 -29.5 Q92 -25 80 -25 Q74 -25 74 -28Z" fill="#4f8a3a" ${st(1)}/></g>
    <path d="M78 -30 l1 1.6 l1 -1.6 l1 1.6 l1 -1.6 l1 1.6 l1 -1.6 l1 1.6 l1 -1.6 l1 1.6 l1 -1.6" stroke="#fff" stroke-width=".7" fill="none"/>`,
  diplo: () => `<path class="cua" d="M30 -16 Q14 -14 0 -8 Q14 -8 30 -10Z" fill="#7f9cc4" ${st(.8)}/>
    <g class="pota b"><rect x="30" y="-10" width="5" height="10" rx="2" fill="#6a86ad" ${st(.7)}/><rect x="52" y="-10" width="5" height="10" rx="2" fill="#6a86ad" ${st(.7)}/></g>

  vegades: r => { const [a, b] = r.ab; return [`${pw(a.p)} : ${pw(b.p)}`, `= 10<sup>${a.p} − ${b.p < 0 ? `(−${-b.p})` : b.p}</sup>`, `= <b>${pw(a.p - b.p)}</b> vegades`, a.p - b.p <= 6 ? `= ${fmt(10 ** (a.p - b.p))} vegades` : ''].filter(Boolean); },
  ordena: r => [r.os.slice().sort((a, b) => a.mida - b.mida).map(o => `${o.nom} (${o.txt})`).join('<br>')]
};
SOL.ncPetit = SOL.nc; SOL.ncInvPetit = SOL.ncInv;
async function respon(v = null, boto = null) {
  const r = P.reptes[P.i]; if (P.bloc) return; let ok, resp;
  if (r.t === 'rang') { ok = v === r.bona; resp = `entre ${pw(v)} i ${pw(v + 1)}`; }
  else if (r.t === 'ordena') { ok = v === 'ok'; resp = 'ordre equivocat'; }
  else if (r.t === 'nc' || r.t === 'ncPetit') { const m = llegeix($('#i1').value), e = llegeix($('#i2').value); if (m == null || e == null) return sacseja(); resp = `${String(m).replace('.', ',')} · ${pw(e)}`; ok = igual(m, r.bona[0]) && e === r.bona[1];
    if (!ok && igual(m * 10 ** e, r.val) && (m < 1 || m >= 10)) r.consell = 'El valor és bo, però en notació científica el primer nombre ha d\'anar entre 1 i 10.'; }
  else if (r.t === 'pot' || r.t === 'vegades') { const e = llegeix($('#i2').value); if (e == null) return sacseja(); ok = e === r.bona; resp = pw(e); }
  else { const x = llegeix($('#i1').value); if (x == null) return sacseja(); ok = igual(x, r.bona); resp = NUM(x); if (!ok && (igual(x, r.bona * 10) || igual(x, r.bona / 10))) r.consell = 'Hi ha un zero de més o de menys: compta bé els salts de la coma.'; }
  P.intents++;
  if (!ok && P.intents === 1 && r.t !== 'ordena') { P.errors++; SO.mal(); if (boto) { boto.disabled = true; } $('#msg').innerHTML = `<p class="msg ko">No és correcte. ${r.consell || ''} Torna-ho a provar.</p>`; r.consell = ''; ['#i1', '#i2'].forEach(s => { const i = $(s); if (i) i.value = ''; }); ($('#i1') || $('#i2'))?.focus(); return; }
  P.bloc = true; $$('.opc, #ok').forEach(b => b.disabled = true);
  if (ok) { const pts = P.intents === 1 ? 10 : 5; P.punts += pts; P.encerts++; SO.be(); if (boto) boto.classList.add('be'); $('#msg').innerHTML = `<p class="msg ok">Correcte! +${pts}</p><div class="calc">${SOL[r.t](r).join('<br>')}</div>`; }
  else { P.errors++; SO.mal(); P.fallades.push(`${titolRepte(r)} → vas dir ${resp}`); $('#msg').innerHTML = `<p class="msg ko">${r.consell || 'No és correcte.'} Mira-ho:</p><div class="calc">${SOL[r.t](r).join('<br>')}</div>`; }
  pintaCap();
  await visualitza(r);
  $('#tq').insertAdjacentHTML('beforeend', `<div class="fila"><button class="big" id="seg">${P.i < 7 ? 'Següent repte ▸' : 'Al museu ▸'}</button></div>`); $('#seg').focus();
  $('#seg').onclick = () => { P.i++; if (P.i >= 8) return museu(); mostraRepte(); };
}
const sacseja = () => { const t = $('#tq'); t.classList.add('sacseja'); setTimeout(() => t.classList.remove('sacseja'), 400); };
function titolRepte(r) { return r.t === 'vegades' ? `${r.ab[0].nom} / ${r.ab[1].nom}: ${pw(r.bona)} vegades` : r.t === 'ordena' ? `Ordenar: ${r.os.slice().sort((a, b) => a.mida - b.mida).map(o => o.nom).join(' < ')}` : r.t === 'rang' ? `${r.o.nom}: entre ${pw(r.bona)} i ${pw(r.bona + 1)}` : `${r.o.nom}: ${r.t.startsWith('nc') && !r.t.includes('Inv') ? ncTxt(...r.bona) : r.t === 'pot' ? pw(r.bona) : NUM(r.bona) + ' m'}`; }
async function visualitza(r) { // l'escena ensenya per què
  if (r.t === 'rang') { await zoomA(r.bona + 1, 800, { marca: r.o.id }); const ppm = 100 / 10 ** ZF; const w1 = 10 ** r.bona * ppm, w2 = 10 ** (r.bona + 1) * ppm;
    $('#capa').innerHTML = `<g transform="translate(${AX + r.o.x * ppm} ${G + 22})"><rect x="0" y="0" width="${w1}" height="10" fill="${PCOL[1]}" stroke="${N}" stroke-width="1.5"/><text x="${w1 + 4}" y="10" font-size="16" font-weight="800" font-family="Bricolage Grotesque,system-ui">${pw(r.bona)} m</text><rect x="0" y="18" width="${w2}" height="10" fill="${PCOL[2]}" stroke="${N}" stroke-width="1.5"/><text x="${Math.min(w2 + 4, 800 - AX)}" y="28" font-size="16" font-weight="800" font-family="Bricolage Grotesque,system-ui">${pw(r.bona + 1)} m</text></g>`; }
  if (r.t === 'vegades') { const [a, b] = r.ab; await zoomA(b.p, 600, { marca: b.id }); await espera(400); const pas = Math.max(120, 1800 / (a.p - b.p)); for (let z = b.p + 1; z <= a.p; z++) { await zoomA(z, pas, { marca: z === a.p ? a.id : b.id }); } }
  if (r.t === 'ordena') { pintaRegle(r.os.slice().sort((a, b) => a.mida - b.mida)); }
  if (['nc', 'ncPetit'].includes(r.t)) { const [m, e] = r.bona; const xs = String(r.val < 1 ? fmtPetit(r.val) : Math.round(r.val)).replace(/\./g, '').replace(',', ''); if (e >= 0) await salts(xs, xs.length, 1, `${NUM(r.val)} = ${ncTxt(m, e)}`); else { const d = xs.replace(/^0+/, ''); const zeros = xs.length - d.length; await salts(xs, 1, zeros + 1, `${NUM(r.val)} = ${ncTxt(m, e)}`); } }
}
/* ================= MUSEU (final) ================= */
function museu() {
  M.pantalla = 'fi'; P.acabada = true; pintaCap(); SO.fi();
  const nouRec = P.punts > M.record; if (nouRec) M.record = P.punts; try { localStorage.setItem('fr4c_zoom_rec_' + M.nivell, M.record); } catch (e) {}
  const temps = Math.round((performance.now() - P.t0) / 1000);
  envia({ tipus: 'fr4c-zoom-fi', punts: P.punts, encerts: P.encerts, errors: P.errors, nivell: M.nivell, temps, fallades: P.fallades.slice(0, 12) });
  const os = OBJS().filter(o => P.capt.has(o.id)).sort((a, b) => a.mida - b.mida); pintaRegle(os);
  $('#panel').innerHTML = `<div class="targ"><h2>🏛️ El museu de les mides</h2><p>${M.nom ? `<b>${esc(M.nom)}</b>, h` : 'H'}as fet <b>${P.punts}</b> punts de 80. ${nouRec ? '<span class="rec">🏆 Nou rècord!</span>' : M.record ? `Rècord: <b>${M.record}</b>.` : ''}</p>
    <div class="resum"><div><b>${P.encerts}</b>encerts</div><div><b>${P.errors}</b>errors</div><div><b>${P.capt.size}</b>objectes</div></div>
    ${P.fallades.length ? `<p><b>Repassa:</b></p><ul style="margin:0;padding-left:20px">${P.fallades.map(f => `<li>${esc(f).replace(/10([⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, '10$1')}</li>`).join('')}</ul>` : '<p>Cap error! 🌟</p>'}
    <div class="fila"><button class="big" id="torna">Torna a jugar</button><button class="big sec" id="tanca2">Surt</button></div></div>`;
  $('#torna').onclick = () => { P.capt = new Set(); inici(); }; $('#tanca2').onclick = surt;
}

/* ================= INICI ================= */
function inici() {
  M.pantalla = 'inici'; RAPID = false; pintaCap(); ZF = 0; pintaZoom(0); $('#panel').innerHTML = '';
  let vist = false; try { vist = localStorage.getItem('fr4c_zoom_vist_' + M.nivell) === '1'; } catch (e) {}
  try { M.record = Math.max(M.record, +(localStorage.getItem('fr4c_zoom_rec_' + M.nivell) || 0)); } catch (e) {}
  const txt = { 1: 'coses gegants i potències de 10', 2: 'coses gegants i notació científica', 3: 'el viatge té dues parts: 🔭 cap enfora (coses gegants) i 🔬 cap endins amb el microscopi (coses diminutes, amb exponents negatius)' }[M.nivell];
  pantalla(`<h1>🔍 El zoom de FR-4C</h1><p>${M.nom ? `Hola, <b>${esc(M.nom)}</b>! ` : ''}Amb el zoom d'en <b>FR-4C</b> veurem coses enormes (dinosaures, balenes, muntanyes, la Terra…)${M.nivell === 3 ? ' i coses diminutes (formigues, puces, cèl·lules…)' : ''} i les mesurarem amb <b>potències de 10</b>.</p>
    <p class="mini">Nivell ${M.nivell}: ${txt}.${M.record ? ` Rècord: <b>${M.record}</b>.` : ''}</p>
    ${!M.dinsApp ? `<div class="fila"><b>Nivell:</b><span class="seg" id="nv">${[1, 2, 3].map(n => `<button data-n="${n}" class="${n === M.nivell ? 'on' : ''}">${n}</button>`).join('')}</span></div>` : ''}
    <div class="fila">${vist ? `<button class="big big2" id="bviatge">🔍 Comença el viatge</button><button class="big sec big2" id="bexpl">▶ Torna a veure l'explicació</button>` : `<button class="big big2" id="bexpl">▶ Comença</button>`}</div>`);
  $('#bexpl').onclick = () => { $('#pant').style.display = 'none'; SO.ac(); explicacio(); };
  const bv = $('#bviatge'); if (bv) bv.onclick = () => { $('#pant').style.display = 'none'; exploracio(); };
  $$('#nv button').forEach(b => b.onclick = () => { M.nivell = +b.dataset.n; M.record = 0; inici(); });
}
function pantalla(html) { const p = $('#pant'); p.innerHTML = `<div class="panell">${html}</div>`; p.style.display = 'flex'; }
const envia = m => { try { if (window.parent !== window) window.parent.postMessage(m, '*'); } catch (e) {} };
function surt() { M.pantalla = 'fora'; envia({ tipus: 'fr4c-zoom-tanca' }); if (window.parent === window) inici(); }
window.addEventListener('message', ev => {
  const d = ev.data || {}; if (d.tipus !== 'fr4c-zoom-ini') return;
  M.dinsApp = true; M.nom = d.nom || ''; M.nivell = Math.max(1, Math.min(3, d.nivell || 1)); M.record = Math.max(d.record || 0, 0);
  if (d.so === false) M.so = false; $('#so').textContent = M.so ? '🔊' : '🔇';
  if (M.pantalla === 'inici') inici();
});
$('#so').onclick = () => { M.so = !M.so; $('#so').textContent = M.so ? '🔊' : '🔇'; try { localStorage.setItem('fr4c_zoom_so', M.so ? '1' : '0'); } catch (e) {} };
$('#surt').onclick = surt; $('#so').textContent = M.so ? '🔊' : '🔇';
const qs = new URLSearchParams(location.search); if (qs.get('nivell')) M.nivell = Math.max(1, Math.min(3, +qs.get('nivell')));
P.capt = new Set(); inici(); envia({ tipus: 'fr4c-zoom-llest' });
window.__zoom = { P, M, OBJ, pintaZoom, zoomA, respon, nousReptes, comencaReptes, exploracio, explicacio, museu, captura, respCaptura, canviEtapa, notacio, expRang, set rapid(v) { RAPID = v; } };
</script>
