<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La gran final de FR-4C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
/* Taller final de l'app FR-4C: concurs de la tele per equips, amb preguntes de totes les unitats. Per a la pissarra; no desa res. */
:root{--taronja:#f26b1d;--tinta:#1b1b1b;--ok:#2fbf71;--ko:#ff5a5a;--or:#ffd23f;--fons:#1a1240}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:var(--fons);color:#fff;overflow:hidden;user-select:none}
.estudi{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 120%,#5b2bb5 0%,#2a176b 45%,#120b30 100%)}
.focus{position:absolute;top:-10%;width:30%;height:120%;background:linear-gradient(180deg,#ffffff22,#ffffff00 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:focus 6s ease-in-out infinite alternate;transform-origin:50% 0}
.focus.f1{left:5%}.focus.f2{right:5%;animation-delay:-3s}
@keyframes focus{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.llums{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,var(--or) 0 10px,transparent 10px 34px);opacity:.6;animation:llums 1s steps(2) infinite}
@keyframes llums{50%{opacity:.25}}
#app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:12px 18px}
.logo{display:flex;align-items:center;gap:14px}
.logo h1{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-size:2.2rem;letter-spacing:1px;color:#fff;text-shadow:0 0 8px #ff4fd8,0 0 18px #ff4fd8,0 0 30px #7a5cff}
.logo h1 span{color:var(--or);text-shadow:0 0 8px #ffb000,0 0 20px #ff7a00}
.logo .info{margin-left:auto;font-size:1.2rem;font-weight:700;background:#ffffff1a;border-radius:14px;padding:6px 14px}
.btn{border:3px solid #fff;background:transparent;color:#fff;border-radius:12px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
.mig{display:grid;grid-template-columns:minmax(220px,22%) 1fr;gap:14px;min-height:0;align-items:center}
.presentador{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.presentador svg{width:96%;height:auto;max-height:58vh}
.bafarada{background:#fff;color:var(--tinta);border-radius:18px;padding:10px 14px;font-weight:700;font-size:1.2rem;line-height:1.3;position:relative;margin-bottom:10px;max-width:100%;box-shadow:0 6px 0 #0005;text-align:center;min-height:2.6em}
.bafarada::after{content:'';position:absolute;left:50%;bottom:-14px;border:10px solid transparent;border-top-color:#fff;transform:translateX(-50%)}
.escenari{height:100%;min-height:0;display:flex;align-items:center;justify-content:safe center;flex-direction:column;gap:12px;overflow:auto;padding:8px 4px}
.targeta{background:#fff;color:var(--tinta);border-radius:26px;padding:18px 26px;width:100%;max-width:1000px;box-shadow:0 10px 0 #0006,0 0 0 6px var(--or)}
.targeta .uni{display:inline-block;border-radius:12px;padding:4px 12px;color:#fff;font-weight:800;font-size:1.05rem}
.targeta .preg{font-family:"Bricolage Grotesque",sans-serif;font-size:2.1rem;margin:10px 0 6px;line-height:1.25;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.opcions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.opc{display:flex;align-items:center;gap:14px;font-family:"Bricolage Grotesque",sans-serif;font-size:1.9rem;padding:10px 16px;border-radius:18px;border:4px solid var(--tinta);background:#f5f3ff;cursor:pointer;text-align:left;color:var(--tinta);box-shadow:0 5px 0 #0003}
.opc b{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--tinta);color:#fff;font-size:1.4rem;flex:none}
.opc:hover:not(:disabled){background:#fff1b8}
.opc:disabled{cursor:default}.opc.amagada{visibility:hidden}
.opc.be{background:var(--ok);color:#fff;border-color:#1c7d48}.opc.be b{background:#fff;color:#1c7d48}
.opc.mal{background:var(--ko);color:#fff;border-color:#a02020}
.expl{margin-top:12px;background:#f1ecff;border-radius:16px;padding:10px 16px;font-family:"Bricolage Grotesque",sans-serif;font-size:1.45rem;line-height:1.45;color:#3b2a85}
.temps{height:12px;border-radius:6px;background:#0002;margin-top:12px;overflow:hidden}.temps i{display:block;height:100%;background:var(--taronja);transform-origin:left}
.accions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;border-radius:18px;padding:12px 26px;border:4px solid #fff;cursor:pointer;background:var(--taronja);color:#fff;box-shadow:0 6px 0 #0006}
.big.sec{background:transparent}.big:disabled{opacity:.35;cursor:default}
.comodins{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.com{font-size:1.1rem;font-weight:800;border-radius:14px;padding:8px 14px;border:3px solid var(--tinta);background:var(--or);color:var(--tinta);cursor:pointer}
.com:disabled{opacity:.3;cursor:default}
.marcador{display:flex;gap:12px;justify-content:center;padding-top:8px}
.equip{min-width:130px;border-radius:18px;padding:8px 14px;text-align:center;border:4px solid #ffffff55;background:#ffffff14;transition:transform .2s}
.equip.torn{transform:translateY(-8px);border-color:#fff;box-shadow:0 0 22px #fff8}
.equip .n{font-weight:800;font-size:1.1rem}.equip .p{font-family:"Bricolage Grotesque",sans-serif;font-size:2.1rem;line-height:1.1}
.equip .c{font-size:.95rem;opacity:.9;letter-spacing:2px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 3px}
.fr i{font-style:normal;padding:0 4px}.fr i:first-child{border-bottom:3px solid currentColor;padding-bottom:2px}.fr i:last-child{padding-top:2px}
.config{background:#fff;color:var(--tinta);border-radius:26px;padding:20px 26px;max-width:900px;width:100%;box-shadow:0 10px 0 #0006}
.config h2{font-family:"Bricolage Grotesque",sans-serif;margin:0 0 8px;font-size:1.8rem}
.config .fila{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.config label{font-weight:700;font-size:1.1rem}
.seg{display:inline-flex;border:3px solid var(--tinta);border-radius:12px;overflow:hidden}.seg button{border:0;background:#fff;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;font-size:1.05rem}.seg button.on{background:var(--tinta);color:#fff}
.xip{border:3px solid var(--tinta);border-radius:12px;padding:6px 10px;font-weight:700;cursor:pointer;background:#fff;font-size:1rem}.xip.on{color:#fff}
.noms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.noms input{font:inherit;font-size:1.05rem;padding:6px 10px;border-radius:10px;border:3px solid;font-weight:700}
.ruleta{position:relative;width:min(56vh,520px);aspect-ratio:1}
.ruleta svg{width:100%;height:100%}
.ruleta .agulla{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border:22px solid transparent;border-top:40px solid var(--or);filter:drop-shadow(0 4px 0 #0007)}
.podi{display:flex;align-items:flex-end;gap:18px;justify-content:center}
.podi .pl{display:flex;flex-direction:column;align-items:center;gap:6px}
.podi .bloc{width:170px;border-radius:14px 14px 0 0;display:flex;align-items:flex-start;justify-content:center;font-family:"Bricolage Grotesque",sans-serif;font-size:3rem;padding-top:8px;color:#fff;border:4px solid #fff}
.podi .nom{font-weight:800;font-size:1.3rem}.podi .pts{font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem}
.confeti{position:fixed;top:-20px;width:12px;height:18px;z-index:20;animation:cau linear forwards}
@keyframes cau{to{transform:translateY(110vh) rotate(720deg)}}
.salta{animation:salta .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes salta{to{transform:translateY(-8px)}}
.parla{animation:parla .25s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes parla{to{transform:scaleY(.5)}}
.gran{font-size:1.25rem}
.amb-fig .cos{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.amb-fig .preg{flex-direction:column;align-items:flex-start;font-size:1.7rem}
.amb-fig .opcions{grid-template-columns:1fr 1fr}
</style>
</head>
<body>
<div class="estudi"><div class="focus f1"></div><div class="focus f2"></div><div class="llums"></div></div>
<div id="app">
  <div class="logo"><h1>LA GRAN FINAL <span>de FR-4C</span></h1><span class="info" id="info"></span><button class="btn" id="so" title="So">🔊</button><button class="btn" id="pc" title="Pantalla completa">⛶</button><button class="btn" id="surt" title="Surt">✕</button></div>
  <div class="mig"><div class="presentador"><div class="bafarada" id="baf">Benvinguts!</div><div id="pres"></div></div><div class="escenari" id="esc"></div></div>
  <div class="marcador" id="marc"></div>
</div>
<script>
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const tria = a => a[Math.floor(Math.random() * a.length)];
const barreja = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const espera = ms => new Promise(r => setTimeout(r, ms));
const N = '#1b1b1b', T = '#f26b1d';
const M = { so: true };
try { M.so = localStorage.getItem('fr4c_final_so') !== '0'; } catch (e) {}

/* ================= SONS ================= */
const SO = {
  ctx: null,
  ac() { if (!M.so) return null; try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; } catch (e) { return null; } },
  to(f, d, { ona = 'triangle', vol = .06, t0 = 0, f2 = null } = {}) { const ac = this.ac(); if (!ac) return; const t = ac.currentTime + t0, o = ac.createOscillator(), g = ac.createGain(); o.type = ona; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .05); },
  soroll(d, { vol = .08, t0 = 0, freq = 1500 } = {}) { const ac = this.ac(); if (!ac) return; const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), x = buf.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + t0; s.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = .7; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + d); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + d + .05); },
  sintonia() { [[523, .15], [659, .15], [784, .15], [1047, .35], [988, .15], [1047, .5]].reduce((t, [f, d]) => { this.to(f, d * 1.1, { t0: t, vol: .07 }); this.to(f / 2, d, { t0: t, vol: .04, ona: 'sine' }); return t + d; }, 0); },
  aplaudiment(d = 2) { for (let i = 0; i < d * 14; i++) this.soroll(.06, { vol: .05 + Math.random() * .05, t0: i / 14 + Math.random() * .05, freq: 1200 + Math.random() * 2000 }); },
  tambor(d = 2.6) { for (let i = 0; i < d * 16; i++) this.to(110 + Math.random() * 20, .05, { ona: 'square', vol: .02 + i / (d * 16) * .03, t0: i / 16 }); },
  tic() { this.to(1400, .03, { ona: 'square', vol: .015 }); },
  be() { [659, 784, 1047, 1319].forEach((f, i) => this.to(f, .2, { t0: i * .09, vol: .07 })); setTimeout(() => this.aplaudiment(1.6), 350); },
  mal() { this.to(160, .55, { ona: 'sawtooth', vol: .05 }); this.to(150, .55, { ona: 'square', vol: .03 }); },
  clic() { this.to(900, .04, { vol: .03 }); },
  fi() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.to(f, .3, { t0: i * .15, vol: .07 })); setTimeout(() => this.aplaudiment(3), 900); }
};

/* ================= PERSONATGES ================= */
// FR-4C presentador: pajarita i armilla, amb micròfon
const presentador = (parla = false) => `<svg viewBox="0 0 150 168" aria-label="FR-4C presentador" style="overflow:visible">
  <ellipse cx="72" cy="163" rx="46" ry="5" fill="#0005"/>
  <line x1="70" y1="34" x2="70" y2="19" stroke="${N}" stroke-width="5"/><circle cx="70" cy="13" r="8" fill="${T}" stroke="${N}" stroke-width="4"/>
  <line x1="48" y1="134" x2="31" y2="149" stroke="${N}" stroke-width="5" stroke-linecap="round"/><circle cx="27" cy="152" r="7" fill="${T}" stroke="${N}" stroke-width="4"/>
  <rect x="14" y="56" width="14" height="32" rx="6" fill="#fff" stroke="${N}" stroke-width="4"/><rect x="112" y="56" width="14" height="32" rx="6" fill="#fff" stroke="${N}" stroke-width="4"/>
  <rect x="24" y="34" width="92" height="78" rx="22" fill="#fff" stroke="${N}" stroke-width="7"/>
  <rect x="36" y="46" width="68" height="52" rx="12" fill="${N}"/>
  <circle cx="55" cy="66" r="7.5" fill="${T}"/><circle cx="85" cy="66" r="7.5" fill="${T}"/>
  <g class="${parla ? 'parla' : ''}"><path d="M60 81 q10 8 20 0" stroke="${T}" stroke-width="5" fill="none" stroke-linecap="round"/></g>
  <rect x="46" y="114" width="48" height="40" rx="10" fill="#fff" stroke="${N}" stroke-width="5"/>
  <path d="M48.5 124 Q48.5 116.5 56 116.5 H62 L70 140 L78 116.5 H84 Q91.5 116.5 91.5 124 V142 Q91.5 151.5 82 151.5 H58 Q48.5 151.5 48.5 142Z" fill="#c0392b"/>
  <path d="M62 116.5 L70 140 L78 116.5" fill="none" stroke="${N}" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="70" cy="145" r="2.6" fill="${N}"/>
  <rect x="46" y="114" width="48" height="40" rx="10" fill="none" stroke="${N}" stroke-width="5"/>
  <path d="M56 112 L68 118 L56 124Z M84 112 L72 118 L84 124Z" fill="${T}" stroke="${N}" stroke-width="3.5" stroke-linejoin="round"/><circle cx="70" cy="118" r="4.5" fill="${T}" stroke="${N}" stroke-width="3.5"/>
  <path d="M92 128 L120 122 L132 106" fill="none" stroke="${N}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="127" y="78" width="11" height="22" rx="4" fill="#555" stroke="${N}" stroke-width="3"/><circle cx="132.5" cy="74" r="9" fill="#888" stroke="${N}" stroke-width="3"/><path d="M126 72h13M126 76h13" stroke="#666" stroke-width="1.5"/>
  <circle cx="133" cy="102" r="7" fill="${T}" stroke="${N}" stroke-width="4"/>
</svg>`;
// en Coma, ajudant amb una targeta
const coma = () => `<svg viewBox="0 0 90 100" width="90" aria-label="En Coma"><g transform="translate(5 18)"><ellipse cx="40" cy="54" rx="21" ry="18" fill="${T}" stroke="${N}" stroke-width="3"/><ellipse cx="40" cy="60" rx="10" ry="10" fill="#fff"/><path d="M25 20L20 3L35 12Z M55 20L60 3L45 12Z" fill="${T}" stroke="${N}" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="27" r="17" fill="${T}" stroke="${N}" stroke-width="3"/><ellipse cx="33.5" cy="26" rx="2.6" ry="3.6" fill="${N}"/><ellipse cx="46.5" cy="26" rx="2.6" ry="3.6" fill="${N}"/><path d="M38 31h4l-2 2.6Z" fill="${N}"/><path d="M28 38L22 36L26 45Z M52 38L58 36L54 45Z" fill="#1b1b1b"/><circle cx="40" cy="40" r="2.5" fill="#1b1b1b"/></g><rect x="56" y="34" width="30" height="40" rx="4" fill="#ffd23f" stroke="${N}" stroke-width="3" transform="rotate(12 71 54)"/><text x="72" y="62" font-size="20" font-weight="900" text-anchor="middle" transform="rotate(12 71 54)" font-family="system-ui">?</text></svg>`;
let parlaTm = null;
function diu(t, ms = 1800) { $('#baf').innerHTML = t; $('#pres').innerHTML = presentador(true); clearTimeout(parlaTm); parlaTm = setTimeout(() => { $('#pres').innerHTML = presentador(false); }, ms); }

/* ================= PREGUNTES ================= */
const fr = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const mcd = (a, b) => b ? mcd(b, a % b) : Math.abs(a);
const simp = (n, d) => { const g = mcd(n, d); return [n / g, d / g]; };
const frT = (n, d) => { [n, d] = simp(n, d); return d === 1 ? String(n) : `${n}/${d}`; };
const frH = t => /^-?\d+\/\d+$/.test(t) ? fr(...t.split('/')) : t;
const z = n => n < 0 ? `(−${-n})` : String(n), zs = n => n < 0 ? `−${-n}` : String(n);
const dec = v => String(Math.round(v * 1e6) / 1e6).replace('.', ',');
const UNITATS = {
  f: { nom: 'Fraccions', col: '#e85d75' }, e: { nom: 'Enters', col: '#2a6fd6' }, p: { nom: 'Potències', col: '#8e44ad' }, q: { nom: 'Equacions', col: '#16a085' },
  m: { nom: 'Mesura', col: '#d35400' }, r: { nom: 'Gràfiques', col: '#2c9a58' }, g: { nom: 'Geometria', col: '#c0392b' }
};
// cada generador torna { q (html), r (text), mals [text], fmt (opcional), ex [línies] }
const GEN = {
  f(L) {
    const t = rnd(0, L === 1 ? 2 : L === 2 ? 4 : 5);
    if (t === 0) { const d = tria([2, 3, 4, 5]), k = rnd(2, 8), n = rnd(1, d - 1), q = d * k; return { q: `${fr(n, d)} de ${q}`, r: String(n * k), mals: [String(q / n | 0), String(n * k + d), String(k), String(q - n * k)], ex: [`${q} : ${d} = ${k}`, `${k} · ${n} = <b>${n * k}</b>`] }; }
    if (t === 1) { const d = tria([2, 3, 4, 5]), n = rnd(1, d - 1), k = rnd(2, 4); return { q: `${fr(n, d)} = ${fr('?', d * k)}`, r: String(n * k), mals: [String(n + k), String(n * k + 1), String(d * k - n)], ex: [`${d} · ${k} = ${d * k}`, `${n} · ${k} = <b>${n * k}</b>`] }; }
    if (t === 2) { const d = tria([5, 6, 7, 8, 9]), a = rnd(1, d - 3), b = rnd(1, d - a - 1); return { q: `${fr(a, d)} + ${fr(b, d)}`, r: `${a + b}/${d}`, mals: [`${a + b}/${2 * d}`, `${a * b}/${d}`, `${a + b + 1}/${d}`], ex: ['Mateix denominador: sumem els de dalt', `${a} + ${b} = ${a + b}`, `= <b>${fr(a + b, d)}</b>`] }; }
    if (t === 3) { const [f, v] = tria([['1/2', '0,5'], ['1/4', '0,25'], ['3/4', '0,75'], ['1/5', '0,2'], ['3/10', '0,3'], ['2/5', '0,4']]); const [n, d] = f.split('/'); return { q: `${fr(n, d)} en decimal`, r: v, mals: [`0,${n}${d}`, `${n},${d}`, `0,${d}`], ex: [`${n} : ${d} = <b>${v}</b>`] }; }
    if (t === 4) { const [a, b] = tria([[6, 8], [4, 10], [9, 12], [10, 15], [8, 12], [6, 9]]); const g = mcd(a, b); return { q: `Simplifica ${fr(a, b)}`, r: `${a / g}/${b / g}`, mals: [`${a / 2 | 0}/${b / 2 | 0}`.replace(/\/0$/, '/1'), `${a - 2}/${b - 2}`, `${b / g}/${a / g}`], ex: [`Dividim dalt i baix per ${g}`, `${a} : ${g} = ${a / g}`, `${b} : ${g} = ${b / g}`] }; }
    const [x, y] = tria([[2, 4], [3, 6], [2, 6], [4, 8], [3, 9]]); const b = rnd(1, y - 1); const n = y / x + b;
    return { q: `${fr(1, x)} + ${fr(b, y)}`, r: frT(n, y), mals: [frT(1 + b, x + y), frT(1 + b, y), frT(n + 1, y)], ex: [`${fr(1, x)} = ${fr(y / x, y)}`, `${fr(y / x, y)} + ${fr(b, y)} = ${fr(n, y)}`, frT(n, y) !== `${n}/${y}` ? `= <b>${frH(frT(n, y))}</b>` : ''].filter(Boolean) };
  },

    const p = a => `${R + R * Math.cos(a)} ${R + R * Math.sin(a)}`;
    s += n === 1 ? `<circle cx="${R}" cy="${R}" r="${R}" fill="${UNITATS[k].col}"/>` : `<path d="M${R} ${R} L${p(a0)} A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${p(a1)}Z" fill="${UNITATS[k].col}" stroke="#fff" stroke-width="4"/>`;

function respon(v) {
